<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIT-CONNECT 승인 영상 복사</title><style>body{margin:0;padding:28px 16px;background:#f3f6fc;color:#243953;font:15px/1.7 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:25px;background:#fff;border:1px solid #dfe6f2;border-radius:20px}h1{font-size:23px;margin:0 0 10px}p{color:#61718a}label{display:block;margin:15px 0;font-weight:650}input{display:block;box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #ccd7e8;border-radius:11px;background:#f8f9fd;color:#243953;font:inherit}button{width:100%;min-height:48px;padding:12px;border:0;border-radius:12px;background:#6558df;color:#fff;font:inherit;font-weight:700}button:disabled{opacity:.6}#status{white-space:pre-line;background:#f0edff;color:#514575;padding:15px;border-radius:12px;margin-top:18px}video{display:block;width:100%;margin-top:20px;border-radius:12px}[hidden]{display:none!important}</style></head><body><main><h1>승인 영상 고속 재생 연결</h1><p>승인된 김윤지 회원 원본 영상 한 개만 서버에서 안전하게 복사합니다. 휴대폰이나 컴퓨터에서 원본 파일을 다시 고를 필요가 없고, Drive 원본과 기존 피드백은 변경하지 않습니다.</p><form id="copyForm"><label for="member">회원 이름<input id="member" name="member" value="김윤지" required readonly></label><label for="password">트레이너 비밀번호<input id="password" name="password" type="password" required autocomplete="current-password"></label><button id="copyButton" type="submit">원본 보존 복사·검증·연결</button></form><div id="status" role="status" aria-live="polite">트레이너 인증 후 원본을 자동으로 복사·검증합니다.</div><video id="playback" hidden controls playsinline preload="metadata"></video></main><script>
const form=document.getElementById('copyForm'),status=document.getElementById('status'),button=document.getElementById('copyButton');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;const member=document.getElementById('member').value.trim(),password=document.getElementById('password').value;const date=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});try{status.textContent='Drive 원본 관계를 확인하고 비공개 고속 저장소로 복사하고 있습니다…';const response=await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'approvedVideoCopyServer',member,password,date})});const result=await response.json();if(!response.ok||result.status!=='success'||!result.verified)throw Error(result.code||result.message||'요청 실패');const video=document.getElementById('playback');video.hidden=false;video.src=result.url;video.muted=true;video.autoplay=true;const started=performance.now();video.addEventListener('playing',()=>{status.textContent='복사·검증·연결 완료 ✓\n원본과 복사본 SHA-256 해시가 일치합니다.\n재생 시작: '+((performance.now()-started)/1000).toFixed(2)+'초\nDrive 원본과 기존 피드백은 변경하지 않았습니다.';},{once:true});video.addEventListener('error',()=>{status.textContent='복사·검증·연결은 완료됐지만 브라우저 재생을 확인하지 못했어요.';},{once:true});status.textContent='복사·검증·연결 완료 ✓ · 재생 확인 중…';await video.play().catch(()=>{});document.getElementById('password').value='';}catch(error){status.textContent='처리를 멈췄습니다: '+error.message+'\nDrive 원본과 기존 피드백은 변경하지 않았습니다.';}finally{button.disabled=false;}});
</script></body></html>
