<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIT-CONNECT 승인 영상 복사</title><style>body{margin:0;padding:28px 16px;background:#f3f6fc;color:#243953;font:15px/1.7 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:25px;background:#fff;border:1px solid #dfe6f2;border-radius:20px}h1{font-size:23px;margin:0 0 10px}p{color:#61718a}label{display:block;margin:15px 0;font-weight:650}input{display:block;box-sizing:border-box;width:100%;margin-top:6px;padding:12px;border:1px solid #ccd7e8;border-radius:11px;background:#f8f9fd;color:#243953;font:inherit}button{width:100%;min-height:48px;padding:12px;border:0;border-radius:12px;background:#6558df;color:#fff;font:inherit;font-weight:700}button:disabled{opacity:.6}#status{white-space:pre-line;background:#f0edff;color:#514575;padding:15px;border-radius:12px;margin-top:18px}video{display:block;width:100%;margin-top:20px;border-radius:12px}[hidden]{display:none!important}</style></head><body><main><h1>승인 영상 고속 재생 연결</h1><p>승인된 원본 파일 하나만 복사합니다. 원본 영상과 기존 피드백은 변경하지 않으며, 파일 해시가 다르면 연결하지 않습니다.</p><form id="copyForm"><label for="member">회원 이름<input id="member" name="member" required autocomplete="off"></label><label for="password">트레이너 비밀번호<input id="password" name="password" type="password" required autocomplete="current-password"></label><label for="originalFile">원본 영상 파일<input id="originalFile" name="originalFile" type="file" accept="video/mp4" required></label><button id="copyButton" type="submit">원본 보존 복사·연결</button></form><div id="status" role="status" aria-live="polite">원본 파일과 트레이너 인증을 준비해주세요.</div><video id="playback" hidden controls playsinline preload="metadata"></video></main><script>
const form=document.getElementById('copyForm'),status=document.getElementById('status'),button=document.getElementById('copyButton');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;
 const member=document.getElementById('member').value.trim(),password=document.getElementById('password').value,file=document.getElementById('originalFile').files[0];
 const date=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Seoul'});
 const api=async(action,extra={})=>{const response=await fetch('/api/records',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,member,password,date,...extra})});const result=await response.json();if(!response.ok||result.status!=='success')throw Error(result.code||result.message||'요청 실패');return result;};
 try{
  status.textContent='승인 대상과 원본 관계를 확인하고 있습니다…';
  const begin=await api('approvedVideoCopyBegin');
  if(!file||file.size!==begin.expected.size)throw Error('원본 파일 크기가 일치하지 않습니다. 연결하지 않았어요.');
  status.textContent='원본 파일 해시를 확인하고 있습니다…';
  const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer())),b=>b.toString(16).padStart(2,'0')).join('');
  if(hash!==begin.expected.sha256)throw Error('원본 파일 해시가 일치하지 않습니다. 연결하지 않았어요.');
  if(!begin.alreadyLinked){
   status.textContent='원본 확인 완료 · 비공개 저장소에 같은 파일을 복사하고 있습니다…';
   const uploaded=await fetch(begin.uploadUrl,{method:'PUT',headers:{'Content-Type':begin.expected.mime},body:file});
   if(!uploaded.ok&&uploaded.status!==409)throw Error('복사 전송 실패 · HTTP '+uploaded.status);
  }
  status.textContent='복사본 전체 해시와 원본 일치를 검증한 뒤 재생 경로를 연결합니다…';
  const result=await api('approvedVideoCopyFinish');
  if(!result.verified||result.sha256!==hash||result.bytes!==file.size)throw Error('복사본 검증 응답을 확인하지 못했습니다.');
  const video=document.getElementById('playback');video.hidden=false;video.src=result.url;video.muted=true;video.autoplay=true;
  const started=performance.now();
  video.addEventListener('playing',()=>{status.textContent='복사·연결 완료 ✓\n원본과 복사본의 SHA-256 해시가 일치합니다.\n재생 시작: '+((performance.now()-started)/1000).toFixed(2)+'초\n원본 영상과 피드백은 변경하지 않았습니다.';},{once:true});
  video.addEventListener('error',()=>{status.textContent='복사·연결 검증은 완료됐지만 브라우저 재생을 확인하지 못했어요.';},{once:true});
  status.textContent='복사·연결 완료 ✓ · 원본과 복사본 해시 일치 · 재생 확인 중…';
  await video.play().catch(()=>{});document.getElementById('password').value='';
 }catch(error){status.textContent='처리를 멈췄습니다: '+error.message+'\n원본 영상과 기존 피드백은 변경하지 않았습니다.';}
 finally{button.disabled=false;}
});
</script></body></html>
