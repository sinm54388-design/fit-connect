<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FIT-CONNECT 홈 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#19212c;font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif}main{max-width:440px;margin:auto;background:#fff;min-height:100dvh;padding:0 22px 100px}header{height:65px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:15px;letter-spacing:-.04em}button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid #2866bd;outline-offset:3px}button:active{opacity:.77}header button{width:44px;height:44px;display:grid;place-items:center;color:#546278}small{color:#596574;font-size:13px}h1{font-size:26px;letter-spacing:-.055em;margin:5px 0 0;font-weight:760}h2{font-size:16px;letter-spacing:-.035em;margin:0 0 12px}p{margin:0;line-height:1.55}.date{padding:17px 0 20px}.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:14px}.dates button{height:48px;border-radius:11px;color:#5a6573;font-size:12px}.dates b{display:block;color:#243247;font-size:14px;margin-top:3px}.dates [aria-pressed=true]{background:#eaf2fb;color:#245daf}.dates [aria-pressed=true] b{color:#245daf}.work{background:#f5f7fa;padding:17px;border-radius:15px}.work strong{font-size:18px;letter-spacing:-.04em}.meta{display:block;margin:5px 0 12px}.primary{min-height:46px;padding:0 15px;border-radius:9px;background:#245daf;color:white;font-size:14px;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.section{padding:21px 0;border-bottom:1px solid #edf0f3}.section p{color:#465364;font-size:14px}.meals{display:grid;grid-template-columns:repeat(3,1fr);text-align:left}.meals button{text-align:left;min-height:48px;padding:0}.meals b,.meals small{display:block}.meals small{margin-top:4px}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);display:grid;grid-template-columns:repeat(5,1fr);padding:5px 10px max(7px,env(safe-area-inset-bottom));background:#fffffff5;backdrop-filter:blur(12px);border-top:1px solid #edf0f3}nav button{min-height:49px;color:#596574;font-size:11px}nav span{display:block;font-size:16px;margin-bottom:2px}nav [aria-current]{color:#245daf;font-weight:750}[hidden]{display:none!important}dialog{border:0;border-radius:18px;padding:20px;width:min(90%,380px);color:inherit}dialog::backdrop{background:#18233155}dialog input{font:inherit;padding:10px;width:100%;margin:12px 0;border:1px solid #cbd4df;border-radius:8px}#hint{margin:16px 0;font-size:12px;color:#596574}
</style>
<main><header><strong>FIT-CONNECT</strong><button id="profile" aria-label="프로필"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a7 7 0 0 1 14 0v2"/></svg></button></header>
<section id="home"><div class="date"><small id="dateText">11월 18일 수요일</small><h1>오늘</h1><div id="dates" class="dates" aria-label="기록 날짜"></div></div>
<article class="work"><h2 id="workTitle">오늘의 운동</h2><div class="row"><div><strong id="routine">하체 루틴</strong><small id="routineMeta" class="meta">스쿼트 외 3개 · 12세트</small></div><button id="start" class="primary">운동 시작</button></div></article>
<section class="section"><div class="row"><h2>코치 메모</h2><button id="memoOpen" aria-label="코치 메모 열기">›</button></div><p id="note">스쿼트는 내려갈 때 속도를 조금 늦춰보세요.</p></section>
<section class="section"><h2>식단</h2><div class="meals"><button data-meal="아침"><b>아침</b><small>기록 완료</small></button><button data-meal="점심"><b>점심</b><small>기록하기</small></button><button data-meal="저녁"><b>저녁</b><small>기록하기</small></button></div></section><p id="hint">디자인 미리보기 · 예시 기록</p></section>
<section id="detail" hidden><h1 id="detailTitle"></h1><div id="detailBody" class="section"></div></section>
<nav aria-label="회원 메뉴"><button data-tab="홈" aria-current="page"><span>⌂</span>홈</button><button data-tab="운동"><span>◈</span>운동</button><button data-tab="식단"><span>▤</span>식단</button><button data-tab="성장"><span>↗</span>성장</button><button data-tab="메모"><span>✎</span>메모</button></nav></main>
<dialog id="sheet"><form method="dialog"><div class="row"><h2 id="sheetTitle"></h2><button aria-label="닫기">닫기</button></div><label id="fieldWrap">식단 내용<input id="food" placeholder="예: 닭가슴살과 밥"></label><button id="save" class="primary" value="save">저장</button></form></dialog>
<script>
const id=x=>document.getElementById(x), home=id('home'),detail=id('detail'),sheet=id('sheet');
let chosen=null;const meals={아침:'오트밀'};
function edit(meal){chosen=meal;id('sheetTitle').textContent=meal+' 기록';id('food').value=meals[meal]||'';id('fieldWrap').hidden=id('save').hidden=false;sheet.showModal();}
function tab(name){home.hidden=name!=='홈';detail.hidden=!home.hidden;id('detailTitle').textContent=name;for(const b of document.querySelectorAll('[data-tab]')){if(b.dataset.tab===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}const body=id('detailBody');body.replaceChildren();if(name==='운동'){for(const [exercise,sets] of [['스쿼트','4세트'],['레그 프레스','3세트'],['런지','3세트'],['레그 컬','2세트']]){const line=document.createElement('p');line.className='row section';line.append(exercise,sets);body.append(line);}}else if(name==='식단'){for(const label of ['아침','점심','저녁']){const b=document.createElement('button');b.className='section row';b.textContent=label+' 기록하기 ›';b.onclick=()=>edit(label);body.append(b);}}else body.textContent=name==='메모'?id('note').textContent:'성장 기록이 여기에 표시돼요.';window.scrollTo(0,0);}
for(const b of document.querySelectorAll('[data-tab]'))b.onclick=()=>tab(b.dataset.tab);
for(const b of document.querySelectorAll('[data-meal]'))b.onclick=()=>edit(b.dataset.meal);
id('start').onclick=()=>tab('운동');id('memoOpen').onclick=()=>tab('메모');
id('profile').onclick=()=>{chosen=null;id('sheetTitle').textContent='프로필 · 예시 회원';id('fieldWrap').hidden=id('save').hidden=true;sheet.showModal();};
sheet.addEventListener('close',()=>{if(sheet.returnValue==='save'&&chosen&&id('food').value.trim()){meals[chosen]=id('food').value.trim();document.querySelector('[data-meal="'+chosen+'"] small').textContent='기록 완료';}sheet.returnValue='';});
for(let i=16;i<=22;i++){const b=document.createElement('button');b.innerHTML='<span>'+('월화수목금토일'[i-16])+'</span><b>'+i+'</b>';b.setAttribute('aria-label','11월 '+i+'일');b.setAttribute('aria-pressed',String(i===18));b.onclick=()=>{id('dateText').textContent='11월 '+i+'일 '+('월화수목금토일'[i-16])+'요일';for(const x of id('dates').children)x.setAttribute('aria-pressed',String(x===b));id('workTitle').textContent=i===18?'오늘의 운동':'선택한 날의 운동';};id('dates').append(b);}
</script></html>
