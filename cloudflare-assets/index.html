      redrawItems();renderRecentFoods();

      const previewFood = () => {
        if (!selectedFood) return;
        const {grams,display}=selectedAmount();
        if (!(grams > 0 && grams <= 2000)) {foodPreview.textContent='중량 1~2000g 또는 수량 0.5~20 사이로 입력해 주세요';return;}
        const n=foodValues(selectedFood,grams);
        foodPreview.innerHTML='<div class="rounded-lg border border-[#E2E8F0] overflow-hidden"><div class="bg-[#F1F5F9] px-2 py-1 text-[11px] font-bold text-[#334155]">예상 영양성분표 · '+(display?display:grams+'g')+'</div><div class="grid grid-cols-4 divide-x divide-[#E2E8F0] text-center"><div class="p-1.5"><b class="block text-[#111827]">'+n.kcal+'</b>kcal</div><div class="p-1.5"><b class="block text-[#111827]">'+n.carb+'g</b>탄수화물</div><div class="p-1.5"><b class="block text-[#111827]">'+n.prot+'g</b>단백질</div><div class="p-1.5"><b class="block text-[#111827]">'+n.fat+'g</b>지방</div></div></div>';
      };
      foodSearch?.addEventListener('input',()=>{
        const term=foodSearch.value.trim().toLowerCase().replace(/\s+/g,'');
        foodOptions.replaceChildren();
        if(!term){foodOptions.classList.add('hidden');return;}
        const matches=FOOD_LOOKUP.filter(f=>(f[0]+' '+f[1]).toLowerCase().replace(/\s+/g,'').includes(term)).slice(0,7);
        // Show each common portion as its own initial search option.
        // Example: boiled egg 1개, boiled egg 2개, fried egg 1개.
        for(const food of matches){
          const portions=foodPortionOptions(food);
          const variants=portions.length
            ? [{index:0,qty:1}, {index:0,qty:2}]
            : [{index:-1,qty:100}, {index:-1,qty:200}];
          for(const variant of variants){
            const p=variant.index>=0?portions[variant.index]:null;
            const grams=p?p.grams*variant.qty:variant.qty;
            const kcal=Math.round(food[2]*grams/100);
            const protein=Math.round(food[4]*grams/10)/10;
            const btn=document.createElement('button');
            btn.type='button';
            btn.setAttribute('role','option');
            btn.className='block w-full text-left rounded-xl bg-white px-3 py-2 text-[12px] text-[#111827] hover:bg-[#EFF6FF]';
            btn.textContent=food[0]+' · '+(p?variant.qty+p.label:grams+'g')+' · 약 '+kcal+'kcal / 단백질 '+protein+'g';
            btn.addEventListener('click',()=>{
              selectedFood=food;
              foodPortions=portions;
              foodUnit.replaceChildren();
              foodPortions.forEach((portion,i)=>{
                const o=document.createElement('option');
                o.value=String(i);
                o.textContent='1'+portion.label;
                foodUnit.appendChild(o);
              });
              const gramsOption=document.createElement('option');
              gramsOption.value='g';
              gramsOption.textContent='직접 g 입력';
              foodUnit.appendChild(gramsOption);
              foodUnit.value=p?String(variant.index):'g';
              foodQuantity.value=p?String(variant.qty):'1';
              foodGrams.value=String(grams);
              document.getElementById('food-choice-title').textContent=food[0]+' · '+foodWeightBasis(food);
              foodChoice.classList.remove('hidden');
              foodOptions.classList.add('hidden');
              refreshFoodUnit();
            });
            foodOptions.appendChild(btn);
          }
        }
        if(!matches.length){
          const msg=document.createElement('p');msg.className='p-2 text-[11px] text-[#64748B]';
          msg.textContent='해당 음식은 없어요. 아래 입력칸에 직접 기록해 주세요.';
          foodOptions.appendChild(msg);
        }
        foodOptions.classList.remove('hidden');
      });
      foodGrams?.addEventListener('input',previewFood);
      foodQuantity?.addEventListener('input',refreshFoodUnit);
      foodUnit?.addEventListener('change',refreshFoodUnit);
      const invalidateAutomatic = () => {
        if(foodEntries.length){foodEntries.length=0;foodItemsChanged=true;redrawItems();}
        automaticNutrition=null; foodTotals.classList.add('hidden');
      };
      descField?.addEventListener('input',invalidateAutomatic);
      calField?.addEventListener('input',invalidateAutomatic);
      document.getElementById('food-apply')?.addEventListener('click',()=>{
        const {grams,display}=selectedAmount();
        if(!selectedFood || !(grams>0 && grams<=2000)){showToast('중량 또는 수량을 확인해 주세요');return;}
        const n=foodValues(selectedFood,grams);
        if(foodEntries.length>=24){showToast('한 끼에 최대 24개까지 추가할 수 있어요');return;}
        foodEntries.push({name:selectedFood[0],grams,display,unitLabel:display?display.replace(/^[0-9.]+/,''):'g',
          unitGrams:display ? grams/Number(foodQuantity.value) : 1,
          qty:display?Number(foodQuantity.value):grams,...n});
        foodItemsChanged=true;recomputeItems();redrawItems();
        foodSearch.value='';foodOptions.classList.add('hidden');foodChoice.classList.add('hidden');selectedFood=null;
        showToast('자동 입력했어요 · 확인 후 저장해 주세요');
      });

      let selectedPreset = null;
      document.querySelectorAll('.pr-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pr = presets[Number(btn.dataset.pr)];
          if (!pr) return;
          automaticNutrition = null;
          foodEntries.length = 0;
          foodItemsChanged=true;redrawItems();
          foodTotals.classList.add('hidden');
          selectedPreset = pr;
          if (descField) descField.value = '[' + pr.tag + '] ' + pr.desc;
          if (calField) calField.value = pr.cal;
          preserveMealDraft();
          showToast('입력칸에 적용했어요 · 확인 후 저장해 주세요');
          document.getElementById('meal-form')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
      });

      document.getElementById('meal-form').addEventListener('submit', e => {
        e.preventDefault();
        const desc = document.getElementById('mf-desc').value.trim();
        const cal = document.getElementById('mf-cal').value.trim();
        if (!desc && !cal && !compressedPhoto && !foodItemsChanged) {
          showToast('메뉴, 칼로리 또는 사진 중 하나를 입력해 주세요');
          return;
        }
        const presetMatches = selectedPreset && desc === '[' + selectedPreset.tag + '] ' + selectedPreset.desc && cal === selectedPreset.cal;
        const changedManually = desc !== String(m.desc || '') || cal !== String(m.cal || '');
        const updated = { ...m, desc: desc || (compressedPhoto?'사진 기록':''), cal,
          ...(foodItemsChanged?{foods:foodEntries.map(v=>({...v}))}:{}),
          ...(automaticNutrition || (presetMatches ? {carb:selectedPreset.carb, prot:selectedPreset.prot, fat:selectedPreset.fat} : (changedManually ? {carb:'',prot:'',fat:''} : {}))),
          ...(compressedPhoto ? { photos: [compressedPhoto] } : {}) };
        commitMealSave(updated, `${mealLabel} 식단 저장 완료`);
      });
    }

    function buildVideoPlayerHtml(videoUrl) {
      const u = String(videoUrl || '').trim();
      if (!u) return '';
      const ytMatch = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      if (ytMatch) {
        return `
          <div class="rounded-[20px] overflow-hidden bg-black aspect-video shadow-sm">
            <iframe src="https://www.youtube.com/embed/${ytMatch[1]}?playsinline=1&rel=0" class="w-full h-full" frameborder="0" referrerpolicy="origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        `;
      }
      return `
        <div class="rounded-[20px] overflow-hidden bg-black shadow-sm">
          <video src="${escapeHtml(u)}" controls autoplay muted playsinline preload="auto" class="w-full max-h-56 object-contain"></video>
        </div>
      `;
    }

    // Date-specific magazine selection: a different lead article each day.
    // Use canonical array indexes so list buttons always open the correct text.
    function getDailyMagazinePicks(dateStr) {
      const items = Array.isArray(state.columns) ? state.columns : [];
      if (!items.length) return [];
      const day = Math.floor(Date.parse(dateStr + 'T00:00:00Z') / 86400000);
      // Exactly one article per category each day. Rotate independently within
      // each category; use the original indexes for opening the right article.
      return ['회복/습관', '영양/식단', '트레이닝'].map(category => {
        const options = items.map((col, index) => ({ col, index }))
          .filter(item => item.col?.category === category);
        if (!options.length) return null;
        // Daily auto-published articles take priority on their own date.
        // If publishing fails, retain the existing date-based rotation.
        const todaysArticle = options.find(item => String(item.col.published_at || '').slice(0,10) === dateStr);
        return todaysArticle || options[((day % options.length) + options.length) % options.length];
      }).filter(Boolean);
    }

    // --- Coach Modals (Unified One-Stop Detail & Immediate Reply Sheet) ---
    let coachLoginVersion = 0;
    async function enterCoachWithPassword(pw, isAuto) {
      const version = ++coachLoginVersion;
      const date = state.selectedDate;
      const isCurrentLogin = () => version === coachLoginVersion;
      if (isLiveOrigin) {
        try {
          const v = await postRecords({ action: 'verify', password: pw, date });
          if (!isCurrentLogin()) return false;
          if (v?.status !== 'success') {
            if (isAuto) {
              try {
                localStorage.removeItem('fit_coach_pw_v2');
                localStorage.removeItem('fit_coach_auto_v1');
              } catch {}
              return false;
            }
            showToast('비밀번호가 일치하지 않아요');
            return false;
          }
          state.trainerPassword = 'coach-cookie';
          try {
            localStorage.removeItem('fit_coach_pw_v2');
            localStorage.setItem('fit_coach_auto_v1', '1');
          } catch {}
          const legacyMembers = postAppsScript({ action: 'listMembers', password: pw }).catch(() => null);
          const [ovRes, fastRes] = await Promise.allSettled([
            postRecords({ action: 'trainerOverview', password: pw, date }),
            postRecords({ action: 'listMembersFast', password: pw, date })
          ]);
          if (!isCurrentLogin()) return false;
          const ov = ovRes.status === 'fulfilled' ? ovRes.value : null;
          const fast = fastRes.status === 'fulfilled' ? fastRes.value : null;
          const tokenMap = Object.create(null);
          let localAdded = [];
          try {
            Object.assign(tokenMap, JSON.parse(localStorage.getItem('fit_member_tokens_v2') || '{}'));
            localAdded = JSON.parse(localStorage.getItem('fit_added_members_v2') || '[]');
          } catch {}
          const membersFrom = source => Array.isArray(source) ? source
            : Array.isArray(source?.members) ? source.members : Array.isArray(source?.data) ? source.data : [];
          const attachMembers = (target, entries, archived) => {
            let added = false;
            for (const entry of entries) {
              const name = String(typeof entry === 'string' ? entry : entry?.name || entry?.member || '').trim();
              if (!name || archived.has(name)) continue;
              const token = entry?.token || entry?.memberToken || extractTokenValue(entry?.url || entry?.link || '');
              const previousToken = tokenMap[name];
              if (token) tokenMap[name] = token;
              const existing = target.find(member => member.name === name);
              if (existing) {
                if ((!existing.token || existing.token === previousToken) && tokenMap[name]) existing.token = tokenMap[name];
              } else {
                target.push({ name, lastDate: '', activeToday: false, pendingWorkout: false, pendingDiet: false,
                  weeklyWorkoutDays: 0, token: tokenMap[name] || '' });
                added = true;
              }
            }
            return added;
          };
          const archivedMembers = new Set(Array.isArray(fast?.archivedMembers) ? fast.archivedMembers : []);
          const hasOverview = ov?.status === 'success' && Array.isArray(ov.members);
          const hasFastList = fast?.status === 'success' && Array.isArray(fast.members);
          const merged = hasOverview ? ov.members.filter(m => !archivedMembers.has(m.name))
            .map(m => ({ ...m, token: m.token || tokenMap[m.name] || '' })) : [];
          attachMembers(merged, membersFrom(fast), archivedMembers);
          if (!hasOverview && !hasFastList) {
            attachMembers(merged, membersFrom(await legacyMembers), archivedMembers);
            if (!isCurrentLogin()) return false;
          }
          localAdded.forEach(lm => {
            if (lm?.name && !archivedMembers.has(lm.name) && !merged.some(sm => sm.name === lm.name)) {
              merged.unshift(lm);
            }
          });
          state.archivedMemberNames = [...archivedMembers];
          state.trainerOverview = merged;
          state.isLive = true;
          const nativeMembers = new Set(fast?.nativeMembers || []);
          const refreshLegacyOverview = () => postAppsScript({ action: 'trainerOverview', password: pw, date }).then(asOv => {
            if (!isCurrentLogin() || state.appMode !== 'coach' || state.selectedDate !== date) return;
            const archived = new Set(state.archivedMemberNames || []);
            if (asOv?.status === 'success' && Array.isArray(asOv.members)) {
              const byName = new Map(asOv.members.map(m => [m.name, m]));
              let changed = false;
              state.trainerOverview = (state.trainerOverview || []).map(m => {
                const am = byName.get(m.name);
                if (!am || nativeMembers.has(m.name)) return m;
                changed = true;
                return {
                  ...m,
                  lastDate: (am.lastDate || '') > (m.lastDate || '') ? am.lastDate : m.lastDate,
                  activeToday: Boolean(m.activeToday || am.activeToday),
                  workoutToday: Boolean(m.workoutToday || am.workoutToday),
                  dietToday: Boolean(m.dietToday || am.dietToday),
                  pendingWorkout: Boolean(m.pendingWorkout || am.pendingWorkout),
                  pendingDiet: Boolean(m.pendingDiet || am.pendingDiet),
                  feedbackDone: Boolean(m.feedbackDone || am.feedbackDone),
                  weeklyWorkoutDays: Math.max(Number(m.weeklyWorkoutDays) || 0, Number(am.weeklyWorkoutDays) || 0)
                };
              });
              asOv.members.forEach(am => {
                if (am?.name && !nativeMembers.has(am.name) && !archived.has(am.name) && !state.trainerOverview.some(x => x.name === am.name)) {
                  state.trainerOverview.push({ ...am, token: tokenMap[am.name] || '' });
                  changed = true;
                }
              });
              if (changed && state.appMode === 'coach') renderAll();
            }
          }).catch(() => {});
          const needLegacyOverview = members => members.some(m => !nativeMembers.has(m.name)) || !fast;
          const requestedOverview = needLegacyOverview(merged);
          state.coachNativeOverview = hasFastList && hasOverview && !requestedOverview;
          if (requestedOverview) refreshLegacyOverview();
          if (hasOverview || hasFastList) legacyMembers.then(source => {
            if (!isCurrentLogin() || state.appMode !== 'coach') return;
            const added = attachMembers(state.trainerOverview, membersFrom(source), new Set(state.archivedMemberNames || []));
            if (added) {
              if (needLegacyOverview(state.trainerOverview)) {
                state.coachNativeOverview = false;
                if (!requestedOverview) {
                  if (state.selectedDate !== date) {
                    return enterCoachWithPassword(state.trainerPassword, true);
                  }
                  refreshLegacyOverview();
                }
              }
              if (!document.querySelector('input:focus, textarea:focus, select:focus')) renderAll();
            }
          }).catch(() => {});
        } catch {
          if (isCurrentLogin() && !isAuto) showToast('코치 인증 중 오류가 발생했어요');
          return false;
        }
      } else {
        state.trainerPassword = pw;
        try { localStorage.removeItem('fit_coach_pw_v2'); } catch {}
        const baseMock = [
          { name: '김윤지', lastDate: state.selectedDate, activeToday: true, pendingWorkout: true, pendingDiet: true, weeklyWorkoutDays: 2 },
          { name: '이서연', lastDate: state.selectedDate, activeToday: true, pendingWorkout: false, pendingDiet: true, weeklyWorkoutDays: 3 },
          { name: '최민수', lastDate: shiftDateStr(state.selectedDate, -5), activeToday: false, pendingWorkout: false, pendingDiet: false, weeklyWorkoutDays: 0 }
        ];
        let localAdded = [];
        try { localAdded = JSON.parse(localStorage.getItem('fit_added_members_v2') || '[]'); } catch {}
        localAdded.forEach(lm => {
          if (lm?.name && !baseMock.some(sm => sm.name === lm.name)) baseMock.unshift(lm);
        });
        state.trainerOverview = baseMock;
      }
      state.appMode = 'coach';
      state.coachOverviewDate = date;
      state.coachOverviewStatus = '';
      state.coachTab = 'coaching';
      const hasPending = state.trainerOverview.some(m => m.pendingWorkout || m.pendingDiet);
      state.coachFilter = hasPending ? 'pending' : 'all';
      state.fabOpen = false;
      closeModal();
      showToast(isAuto ? '저장된 코치 인증으로 바로 입장했어요' : '코치 모드로 전환되었어요');
      renderAll();
      return true;
    }

    async function fetchMemberForCoach(memberName, detailDate) {
      if (!state.isLive || !state.trainerPassword) {
        return { daily: state.record, history: { previous: {} } };
      }
      const weekDays = buildWeekDays(detailDate);
      const memberAuth = { member: memberName, password: state.trainerPassword };
      const readCoachRecords = date => postRecords({ ...memberAuth, action: 'read', date });
      const readCoachLegacy = async (records, date) => records?.nativeDaily
        ? unwrapDailyRecord(records)
        : readAppsDailyRecord({ ...memberAuth, date });
      async function loadSchedule(date) {
        const fromRecords = await readCoachRecords(date).catch(() => null);
        const preferred = await readCoachLegacy(fromRecords, date).catch(() => null);
        return getPtSchedule(preferred) ??
          (fromRecords ? getPtSchedule(unwrapDailyRecord(fromRecords)) || { ptScheduled: false, ptTime: '' } : null);
      }
      const dailyRecords = readCoachRecords(detailDate);
      const dailyRequests = Promise.allSettled([
        dailyRecords,
        dailyRecords.catch(() => null).then(records => readCoachLegacy(records, detailDate)),
        postRecords({ ...memberAuth, action: 'workoutHistory', date: detailDate, month: detailDate.slice(0, 7) })
      ]);
      const otherDates = weekDays.map(({ fullDate }) => fullDate).filter(date => date !== detailDate);
      const weekPtRequest = postRecords({ ...memberAuth, action: 'coachPtWeek', date: detailDate })
        .catch(() => null).then(async result => {
          if (result?.status === 'success' && result.schedules &&
              otherDates.every(date => typeof result.schedules[date]?.ptScheduled === 'boolean')) {
            return Object.fromEntries(otherDates.map(date => [date, result.schedules[date]]));
          }
          const entries = await Promise.all(otherDates.map(async date => [date, await loadSchedule(date)]));
          return Object.fromEntries(entries);
        });
      const [dRecRes, dAsRes, hRes] = await dailyRequests;
      const recObj = dRecRes.status === 'fulfilled' ? unwrapDailyRecord(dRecRes.value) : null;
      const asObj = dAsRes.status === 'fulfilled' ? dAsRes.value : null;
      const hasDietData = obj => obj?.diet && ['breakfast', 'lunch', 'dinner', 'snack'].some(k => {
        const ml = obj.diet[k];
        return ml && (String(ml.desc || '').trim() || (Array.isArray(ml.photos) && ml.photos.length > 0) || Number(ml.cal) > 0);
      });
      const asHasRoutines = Array.isArray(asObj?.routines) && asObj.routines.length > 0;
      const recHasRoutines = Array.isArray(recObj?.routines) && recObj.routines.length > 0;
      const baseChosen = asHasRoutines ? asObj : (recHasRoutines ? recObj : ((asObj && (asObj.headerMessage || asObj.diet || asObj.memos)) ? asObj : (recObj || asObj || {})));
      const mergedCoachDiet = mergeDietRecords(asObj?.diet, recObj?.diet, recObj?.deletedPhotoMeals || []);
      const chosen = {
        ...(baseChosen || {}),
        ...(getPtSchedule(asObj) ?? getPtSchedule(recObj)),
        diet: mergedCoachDiet,
        ...(asObj && hasDietData(asObj) ? { feedback: asObj.feedback || baseChosen?.feedback, memos: (Array.isArray(asObj.memos) && asObj.memos.length) ? asObj.memos : baseChosen?.memos } : {}),
        ...(recObj?.coachFeedbackStored
          ? { headerMessage: recObj.headerMessage, feedback: recObj.feedback }
          : {})
      };
      const weekPtMap = Object.fromEntries(weekDays.map(({ fullDate }) => [fullDate, null]));
      if (recObj || asObj) {
        weekPtMap[detailDate] = getPtSchedule(chosen) || { ptScheduled: false, ptTime: '' };
      }
      return {
        daily: chosen,
        history: (hRes.status === 'fulfilled' && hRes.value?.status === 'success') ? hRes.value : { previous: {} },
        weekPtMap,
        weekPtRequest
      };
    }

    function memberLinkUrl(base, member, token, date) {
      const url = new URL(base);
      if (date) url.searchParams.set('date', date);
      url.hash = new URLSearchParams({ name: member, token }).toString();
      return url.toString();
    }

    function extractTokenValue(raw) {
      const value = String(raw || '').trim();
      if (!value.includes('token=')) return value;
      try {
        const url = new URL(/^(https?:|[/?#])/i.test(value) ? value : '?' + value, window.location.origin);
        return (new URLSearchParams(url.hash.slice(1)).get('token') || url.searchParams.get('token') || '').trim();
      } catch { return ''; }
    }

    function saveMemberTokenLocal(memberName, tokenVal) {
      const mObj = (state.trainerOverview || []).find(x => x.name === memberName);
      if (mObj) mObj.token = tokenVal;
      try {
        const map = JSON.parse(localStorage.getItem('fit_member_tokens_v2') || '{}');
        map[memberName] = tokenVal;
        localStorage.setItem('fit_member_tokens_v2', JSON.stringify(map));
        const prevAdded = JSON.parse(localStorage.getItem('fit_added_members_v2') || '[]');
        const idx = prevAdded.findIndex(x => x.name === memberName);
        if (idx >= 0) prevAdded[idx].token = tokenVal;
        else prevAdded.unshift({ name: memberName, lastDate: state.selectedDate, activeToday: false, pendingWorkout: false, pendingDiet: false, weeklyWorkoutDays: 0, token: tokenVal });
        localStorage.setItem('fit_added_members_v2', JSON.stringify(prevAdded));
      } catch {}
    }

    async function verifyMemberLink(memberName, token) {
      try {
        const access = await requestRecords({
          action: 'memberSession', member: memberName, date: state.selectedDate, token
        });
        return access?.status === 'success' && Boolean(access.session);
      } catch (error) {
        if (error?.status === 403) return false;
        throw error;
      }
    }

    async function resolveMemberToken(memberName) {
      const mObj = (state.trainerOverview || []).find(x => x.name === memberName);
      const cached = extractTokenValue(mObj?.token || (memberName === state.memberName ? state.token : ''));
      if (!state.isLive) return cached;
      if (!state.trainerPassword) return '';
      if (cached && await verifyMemberLink(memberName, cached)) return cached;
      const response = await postAppsScript({
        action: 'getMemberLink', name: memberName, password: state.trainerPassword
      });
      if (response?.code === 'link_expired') {
        const error = new Error('회원 링크가 만료됐어요. 회원 상세에서 링크를 재발급해 주세요.');
        error.code = 'link_expired';
        throw error;
      }
      const token = extractTokenValue(response?.token || response?.url || response?.link || '');
      if (response?.status !== 'success' || !token || token === cached ||
          !await verifyMemberLink(memberName, token)) return '';
      saveMemberTokenLocal(memberName, token);
      return token;
    }

    function startMemberLinkCopy(linkPromise) {
      if (!navigator.clipboard?.write || typeof ClipboardItem !== 'function') return null;
      // Start the write during the tap so Safari can accept the link after verification.
      const text = linkPromise.then(link => {
        if (!link) throw new Error('Member link unavailable');
        return new Blob([link], { type: 'text/plain' });
      });
      text.catch(() => {});
      try {
        return navigator.clipboard.write([new ClipboardItem({ 'text/plain': text })]).then(() => true, () => false);
      } catch {
        return null;
      }
    }

    function showMemberLinkForCopy(link) {
      openModal('회원 전용 링크', `

          <input id="member-link-copy-value" type="text" readonly autocomplete="off" spellcheck="false" class="w-full text-base px-3.5 py-2.5 rounded-2xl bg-[#F4F6F9]" />
          <button type="button" id="member-link-copy-retry" class="tap-scale w-full py-3.5 rounded-2xl hero-navy text-white text-[13px] font-extrabold">링크 복사</button>
        </div>
      `);
      const input = document.getElementById('member-link-copy-value');
      input.value = link;
      document.getElementById('member-link-copy-retry').addEventListener('click', async () => {
        if (await copyTextSafe(input.value)) {
          closeModal();
          showToast('회원 전용 링크를 복사했어요.');
        } else {
          input.focus();
          input.select();
          showToast('선택된 링크를 길게 눌러 복사해 주세요.');
        }
      });
    }

    async function copyOrShowMemberLink(link, clipboardWrite = null) {
      const copied = clipboardWrite ? await clipboardWrite : await copyTextSafe(link);
      if (!copied && (!state.isLive || (state.appMode === 'coach' && state.trainerPassword))) {
        showMemberLinkForCopy(link);
      }
      return copied;
    }

    let coachOverviewVersion = 0;
    async function refreshCoachOverview() {
      if (!state.isLive || state.appMode !== 'coach') return;
      if (!state.trainerPassword) {
        renderAll();
        await openTrainerLoginModal();
        return;
      }
      const version = ++coachOverviewVersion;
      const login = coachLoginVersion;
      const date = state.selectedDate;
      const password = state.trainerPassword;
      const stillCurrent = () => version === coachOverviewVersion && login === coachLoginVersion &&
        state.appMode === 'coach' && state.selectedDate === date && state.trainerPassword === password;
      const dateChanged = date !== state.coachOverviewDate;
      state.coachOverviewStatus = 'loading';
      if (dateChanged) renderAll();
      const btn = document.getElementById('coach-refresh-overview');
      if (btn) { btn.disabled = true; btn.textContent = '갱신 중…'; }
      try {
        const result = await postRecords({ action: 'trainerOverview', date, password });
        if (!stillCurrent()) return;
        if (result?.status !== 'success' || !Array.isArray(result.members)) throw new Error(result?.code || '현황 조회 실패');
        const oldMembers = new Map((state.trainerOverview || []).map(m => [m.name, m]));
        state.trainerOverview = result.members.map(m => {
          const previous = oldMembers.get(m.name);
          return { ...previous, ...m, token: m.token || previous?.token || '' };
        });
        state.coachOverviewDate = date;
        state.coachOverviewStatus = '';
        state.coachFilter = state.coachFilter || 'pending';
        renderAll();
        if (!dateChanged) showToast('코치 현황을 최신 기록으로 갱신했어요 ✓');
      } catch (err) {
        if (!stillCurrent()) return;
        if ([401, 403].includes(err?.status)) {
          state.trainerPassword = '';
          state.trainerOverview = [];
          state.coachOverviewDate = '';
          state.coachOverviewStatus = 'login';
          try { localStorage.removeItem('fit_coach_auto_v1'); } catch {}
          renderAll();
          return;
        }
        state.coachOverviewStatus = 'error';
        if (dateChanged) renderAll();
        else if (btn) { btn.disabled = false; btn.textContent = '↻ 새로고침'; }
        showToast('현황 갱신 실패: ' + (err?.message || '네트워크 오류'));
      }
    }

        async function saveCoachDetailAndAdvance(goNext) {
          if (ptScheduleSaving) {
            showToast('PT 일정 저장이 끝난 뒤 일지를 저장해 주세요.');
            return;
          }
          const pendingNameEl = document.getElementById('cd-new-name');
          const pendingName = pendingNameEl ? pendingNameEl.value.trim() : '';
          if (pendingName) {
            const pSets = Math.max(1, Number(document.getElementById('cd-new-sets')?.value) || 3);
            const pWt = document.getElementById('cd-new-weight')?.value.trim() || '';
            const pRp = document.getElementById('cd-new-reps')?.value.trim() || '12';
            routines.push({
              id: Date.now(),
              routineType: document.getElementById('cd-new-type')?.value || 'pt',
              name: pendingName,
              weight: pWt,
              sets: String(pSets),
              reps: pRp,
              setDetails: Array.from({ length: pSets }, () => ({ weight: pWt, reps: pRp })),
              note: document.getElementById('cd-new-note')?.value.trim() || '',
              videoUrl: document.getElementById('cd-new-video')?.value.trim() || '',
              ...(pendingNewVideoId ? { videoId: pendingNewVideoId } : {}),
              completedSets: Array(pSets).fill(false)
            });
          }

          const finalReply = document.getElementById('cd-reply-msg').value.trim();
          const finalDiet = document.getElementById('cd-diet-msg').value.trim();
          const patch = {
            headerMessage: finalReply || daily.headerMessage || '',
            routines,
            feedback: {
              ...(daily.feedback || {}),
              ...(finalReply ? { workout: finalReply } : {}),
              ...(finalDiet ? { diet: finalDiet } : {}),
              time: nowTimeHHMM()
            }
          };

          const saveBtn = document.getElementById('cd-save-all');
          const nextBtn = document.getElementById('cd-save-next');
          if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }
          if (nextBtn) { nextBtn.disabled = true; nextBtn.textContent = '저장 중...'; }
          const ok = await savePatchLive(patch, memberName, detailDate, baselineRoutineIds);
          if (!ok) {
            if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '이 회원만 저장하기'; }
            if (nextBtn) { nextBtn.disabled = false; nextBtn.textContent = '저장하고 다음 대기 회원 보기 →'; }
            return;
          }
          try {
            const savedFeedback = await postRecords({
              action: 'coachFeedbackSave',
              member: memberName, date: detailDate,
              password: state.trainerPassword,
              headerMessage: patch.headerMessage,
              workoutFeedback: patch.feedback.workout || '',
              dietFeedback: patch.feedback.diet || ''
            });
            if (savedFeedback?.status !== 'success')
              throw new Error(savedFeedback?.code || '피드백 서버 저장 실패');
          } catch (err) {
            // The Apps Script write may already have succeeded. Keep the
            // editor open for retry instead of displaying false success.
            if (saveBtn) {
              saveBtn.disabled = false;
              saveBtn.textContent = '다시 저장하기';

      renderDetailBody();

    // Device-local unread hint, not a server-side read receipt.
    function trainerMemoSignature() {
      const messages = (state.record?.memos || []).filter(m => m.from === 'trainer');
      const last = messages[messages.length - 1];
      if (!last) return '';
      // Persist only a compact fingerprint, never the member's message text.
      const source = String(last.id || '') + '|' + String(last.time || '') + '|' + String(last.text || '');
      let hash = 2166136261;
      for (let i = 0; i < source.length; i++) hash = Math.imul(hash ^ source.charCodeAt(i), 16777619);
      return (hash >>> 0).toString(36);
    }

    function getMemberVideoDate(createdAt) {
      const timestamp = Date.parse(createdAt);
      return Number.isFinite(timestamp) ? new Date(timestamp + 9 * 3600000).toISOString().slice(0, 10) : '';
    }

    function getMemberVideoCategory(exercise) {
      const name = String(exercise || '').toLowerCase().replace(/[\s_-]/g, '');
      const matches = MEMBER_VIDEO_BODY_PARTS.filter(([, pattern]) => pattern.test(name));
      return matches.length === 1 ? matches[0][0] : '미분류';
    }

    function renderMemberVideoLibrary() {
      if (!state.directVideos.length) return '';
      const { part, videoLimit } = state.memberVideoView;
      const exercises = new Map();
      for (const entry of [...Object.values(state.exerciseLibrary || {}), ...(state.record?.routines || [])]) {
        const id = entry.videoId || entry.demoKey;
        if (id && entry.name) exercises.set(id, entry.name);
      }
      const videos = state.directVideos.map(video => ({
        ...video,
        uploadDay: getMemberVideoDate(video.createdAt),
        exerciseName: exercises.get(video.id) || video.name,
        bodyPart: getMemberVideoCategory(exercises.get(video.id) || video.question)
      })).sort((a, b) => (Date.parse(b.createdAt) || 0) - (Date.parse(a.createdAt) || 0));
      const byPart = new Map();
      for (const video of videos) {
        if (!byPart.has(video.bodyPart)) byPart.set(video.bodyPart, []);

      }
      const renderRows = list => `
        <div class="space-y-2">
          ${list.slice(0, videoLimit).map(v => `

              ${login ? '다시 로그인' : '다시 불러오기'}</button>`}
          </section>
        `;
      }
      const list = state.trainerOverview || [];
      const isPending = m => Boolean(m.pendingWorkout || m.pendingDiet || Number(m.directPendingVideos || 0) > 0);
      const isDormant = m => daysBetween(m.lastDate, state.selectedDate) >= 4;

      const pendingList = list.filter(isPending);
      const pendingDietList = list.filter(m => Boolean(m.pendingDiet));
      const pendingWorkoutList = list.filter(m => Boolean(m.pendingWorkout));
      const todayList = list.filter(m => m.activeToday);
      const dormantList = list.filter(isDormant);
      const videoWaiting = list.reduce((n, m) => n + (Number(m.directPendingVideos) || 0), 0);
      const pendingVideoMembers = list.filter(m => Number(m.directPendingVideos || 0) > 0);
      const weeklyActiveMembers = list.filter(m => Number(m.weeklyActiveDays || 0) > 0).length;

      if (state.coachTab === 'coaching') {
        let filtered = list;
        if (state.coachFilter === 'pending') filtered = pendingList;
        else if (state.coachFilter === 'diet') filtered = pendingDietList;
        else if (state.coachFilter === 'workout') filtered = pendingWorkoutList;
        else if (state.coachFilter === 'today') filtered = todayList;
        else if (state.coachFilter === 'dormant') filtered = dormantList;
        else if (state.coachFilter === 'videos') filtered = pendingVideoMembers;

        // Sort so pending feedback members always come first
        const sorted = [...filtered].sort((a, b) => {
          const ap = isPending(a) ? 1 : 0;
          const bp = isPending(b) ? 1 : 0;
          if (ap !== bp) return bp - ap;
          const av = Number(a.directPendingVideos) || 0, bv = Number(b.directPendingVideos) || 0;
          if (av !== bv) return bv - av;
          return (b.activeToday ? 1 : 0) - (a.activeToday ? 1 : 0);
        });

        return `

                        ${badges.map(bg => `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${bg.includes('미접속') ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-700'}">${bg}</span>`).join('')}

              <button type="button" id="btn-add-member" class="tap-scale shrink-0 px-3.5 py-3 rounded-2xl hero-navy text-white text-[12px] font-extrabold shadow-sm">+ 회원 추가</button>

                  <div class="flex items-center gap-2">
                    <span class="text-[15px] font-bold text-[#111827]">${escapeHtml(m.name)}</span>

                  <p class="text-[12px] text-[#6B7280] mt-0.5">최근 기록: ${escapeHtml(m.lastDate || '없음')}</p>

                </div>
                <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${isPending(m) ? 'bg-amber-50 text-amber-700' : 'bg-[#F0FDFA] text-[#0F766E]'}">${isPending(m) ? '피드백 대기 ›' : '상세 보기 ›'}</span>

              <button type="button" data-archive-member="${escapeHtml(m.name)}" class="c-archive-btn tap-scale shrink-0 rounded-xl px-2.5 py-2.5 bg-red-50 text-red-700 text-[11px] font-bold">삭제</button>
              </div>
            `).join('')}
            ${(state.archivedMemberNames || []).length ? `
              <details class="rounded-2xl bg-white p-3">
                <summary class="cursor-pointer text-[12px] font-bold text-[#64748B]">보관된 회원 (${state.archivedMemberNames.length}명) · 펼쳐서 복원</summary>
                <div class="space-y-2 mt-3">${state.archivedMemberNames.map(name => `
                  <div class="flex items-center justify-between gap-2 p-2 bg-[#F4F6F9] rounded-xl">
                    <span class="text-[12px] font-semibold text-[#475569]">${escapeHtml(name)}</span>
                    <button type="button" data-restore-member="${escapeHtml(name)}" class="c-restore-btn px-3 py-2 rounded-lg text-[11px] font-bold bg-[#EFF6FF] text-[#1D4ED8]">복원</button>
                  </div>`).join('')}</div>
              </details>` : ''}
          </section>
        </div>
      `;
    }

    function updateFabUI() {
      const menu = document.getElementById('fab-menu');
      const icon = document.getElementById('fab-icon');
      if (state.fabOpen) { menu.classList.remove('hidden'); menu.classList.add('flex'); icon.style.transform = 'rotate(45deg)'; }
      else { menu.classList.add('hidden'); menu.classList.remove('flex'); icon.style.transform = 'rotate(0deg)'; }
    }

    function renderAll() {
      try {
        renderHeader();
        renderBottomNav();
        const main = document.getElementById('main-content');
        if (!main) throw new Error('main-content missing');
        if (state.appMode === 'member' && !state.loading && state.dayReadError) {
          const { denied, cached, linkExpired } = state.dayReadError;
          main.innerHTML = `
            <section role="status" class="rounded-2xl bg-white p-5 space-y-3">
              <h2 class="text-base font-extrabold text-[#0F172A]">${linkExpired ? '회원 링크가 만료됐어요' : denied ? '회원 링크를 확인해 주세요' : '최신 기록을 불러오지 못했어요'}</h2>
              <p class="text-sm text-[#475569]">${denied ? '코치가 보내준 최신 회원 전용 링크로 다시 열어 주세요.'
                : cached ? '아래는 이 기기에 마지막으로 저장된 기록이에요. 최신 기록이 열리면 수정할 수 있어요.'
                : '선택한 날짜의 기록을 다시 불러올 수 있어요.'}</p>
              ${denied ? '' : '<button type="button" id="btn-member-day-retry" class="w-full py-2.5 rounded-xl hero-navy text-white font-bold">다시 불러오기</button>'}
            </section>
            ${cached ? `<div inert>${renderMemberView()}</div>` : ''}
          `;
        } else {
          main.innerHTML = state.appMode === 'member' ? renderMemberView() : renderCoachView();
        }
        updateFabUI();
        updateFloatingTimerUI();
        bindEvents();
        hydrateDirectImages();
        updateWorkoutSaveLabel();
      } catch (error) {
        console.error('[FIT-CONNECT] 화면 렌더링 오류', error);
        // Always show a recovery action instead of the white screen + FAB.
        const main = document.getElementById('main-content');
        if (main) {
          main.innerHTML = '<section class="bg-white rounded-2xl p-6 space-y-4 m-4">' +
            '<h2 class="text-lg font-extrabold text-[#0F172A]">화면을 불러오지 못했어요</h2>' +
            '<p class="text-sm leading-relaxed text-[#475569]">저장된 운동·식단 기록이 삭제된 것은 아니에요. 다시 불러오기를 눌러 주세요.</p>' +
            '<button type="button" id="fit-retry-render" class="w-full py-3 rounded-xl hero-navy text-white font-bold">다시 불러오기</button>' +
            '<p class="text-[11px] text-[#64748B]">문제가 계속된다면 코치에게 알려 주세요.</p></section>';
          document.getElementById('fit-retry-render')?.addEventListener('click', () => window.location.reload());
        }
      }
    }

    function bindEvents() {
      document.getElementById('btn-member-day-retry')?.addEventListener('click', () => {

        void loadMemberDateData(state.selectedDate);

      document.getElementById('fit-open-report')?.addEventListener('click',()=>fitAssessmentReport(state.memberName,false));

            state.record.dailyCheckin.workout = 'rest';

      const bvFat = document.getElementById('bv-fat-inp');

        if (subEl) subEl.textContent = `체지방 -${fk}kg (${fv.toLocaleString()}만원) · 골격근 +${mk}kg (${mv.toLocaleString()}만원)`;

      document.querySelectorAll('.fb-react-btn').forEach(b => {

            localStorage.setItem(`fit_react_${state.memberName}_${state.selectedDate}`, state.feedbackReaction);
          } catch {}
          const reactId = 'react-' + state.selectedDate;
          const memos = Array.isArray(state.record.memos) ? state.record.memos.filter(m => m.id !== reactId) : [];
          if (state.feedbackReaction) {
            memos.push({ id: reactId, from: 'member', text: `[한마디 확인] ${state.feedbackReaction}`, time: nowTimeHHMM() });
            showToast(`코치님께 '${state.feedbackReaction}' 반응을 보냈어요`);
          } else {
            showToast('반응을 취소했어요');
          }
          state.record.memos = memos;
          renderAll();
          savePatchLive({ memos: state.record.memos });
        });
      });

      const prBtn = document.getElementById('btn-open-pr');
      if (prBtn && state.insights?.weekly?.improvements?.[0]) {
        prBtn.addEventListener('click', () => openPRShareModal(state.insights.weekly.improvements[0]));
      }
      document.querySelectorAll('.pr-item-btn').forEach(b => {
        b.addEventListener('click', () => {
          const it = state.insights?.weekly?.improvements?.[Number(b.dataset.pridx)];
          if (it) openPRShareModal(it);
        });
      });

      for (const id of ['home-pt-diary', 'btn-home-mission']) {
        document.getElementById(id)?.addEventListener('click', () => {
          state.memberTab = 'lesson';
          state.lessonView = 'today';
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      const hgBtn = document.getElementById('btn-home-guide');
      if (hgBtn) hgBtn.addEventListener('click', () => openFormGuideModal(hgBtn.dataset.gtitle, hgBtn.dataset.gnote));

      document.querySelectorAll('.w-add-btn').forEach(b => {
        b.addEventListener('click', () => addWaterCup(Number(b.dataset.wml)));
      });
      const wMinus = document.getElementById('btn-water-minus');
      if (wMinus) wMinus.addEventListener('click', () => addWaterCup(-250));

      document.querySelectorAll('.chk-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.record.dailyCheckin[b.dataset.grp] = b.dataset.val;
          showToast('오늘 상태가 저장되었어요');
          renderAll();
          saveDailyCheckinLive({ ...state.record.dailyCheckin });
        });
      });

      document.querySelectorAll('.meal-btn').forEach(b => b.addEventListener('click', () => openMealModal(b.dataset.mkey, b.dataset.mlabel)));
      // Always expose photo deletion on the member diet card, not only
      // inside the meal editor. Only the photographed meal can be deleted.
      document.querySelectorAll('.member-photo-delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const mealKey = btn.dataset.mealPhotoKey;
          const mealLabel = btn.dataset.mealPhotoLabel;
          if (!['breakfast','lunch','dinner','snack'].includes(mealKey) || !extractPhotoSrc(state.record.diet?.[mealKey])) return;
          if (!window.confirm(`${mealLabel} 사진만 삭제할까요? 식단 글과 칼로리는 남습니다.`)) return;
          btn.disabled = true;
          btn.textContent = '사진 삭제 중...';
          const targetMember = state.memberName;
          const targetDate = state.selectedDate;
          try {
            const auth = (state.appMode === 'coach' && state.trainerPassword)
              ? { password: state.trainerPassword }
              : (state.session ? { session: state.session } : { token: state.token });
            const res = await deleteMealPhoto(targetMember, targetDate, mealKey, auth);
            if (res?.status !== 'success') throw new Error(res?.code || '삭제 실패');
            if (targetMember === state.memberName && targetDate === state.selectedDate) {
              state.record.diet[mealKey] = { ...state.record.diet[mealKey], photos: [], photo: '' };
              saveCachedMemberData(targetDate);
              renderAll();
            }
            showToast(`${mealLabel} 사진을 삭제했어요 ✓`);
          } catch (err) {
            btn.disabled = false;
            btn.textContent = '🗑 사진만 삭제하기';
            showToast('사진 삭제 실패: ' + (err?.message || '네트워크 오류'));
          }
        });
      });

      document.querySelectorAll('.meal-yesterday-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          openMealModal(btn.dataset.prevmealKey,btn.dataset.prevmealLabel);
          document.getElementById('meal-copy-yesterday')?.click();
        });
      });
      document.getElementById('workout-save-retry')?.addEventListener('click',retryWorkoutSave);
      document.querySelectorAll('.routine-set-toggle').forEach(b => {
        b.addEventListener('click', () => {
          const ri=Number(b.dataset.setRidx),si=Number(b.dataset.setIdx);
          const routine=state.record.routines?.[ri];
          if (routine?.routineType !== 'homework') return;
          const count=Math.max(1,Number(routine.sets)||routine.completedSets?.length||3);
          const sets=Array.from({length:count},(_,i)=>Boolean(routine.completedSets?.[i]));
          sets[si]=!sets[si];routine.completedSets=sets;
          const completed=sets[si];enqueueWorkoutSave(routine, [si]);renderAll();
          if(completed){
            state.timer.setsDone+=1;
            if(state.timer.autoStartOnCheck)startTimerCountdown(getConfiguredTimerSeconds());
          }
        });
      });
      document.querySelectorAll('.routine-toggle').forEach(b => {
        b.addEventListener('click', () => {
          const idx = Number(b.dataset.ridx);
          const r = state.record.routines[idx];
          if (r?.routineType !== 'homework') return;
          const setsCount = Math.max(1, Number(r.sets) || (Array.isArray(r.completedSets) ? r.completedSets.length : 3));
          const currentlyDone = Array.isArray(r.completedSets) && r.completedSets.length >= setsCount && r.completedSets.slice(0,setsCount).every(Boolean);
          r.completedSets = Array(setsCount).fill(!currentlyDone);
          if (!currentlyDone) {
            state.timer.setsDone += 1;
            triggerConfetti();
            if (state.timer.autoStartOnCheck) startTimerCountdown(getConfiguredTimerSeconds());
          }
          enqueueWorkoutSave(r, r.completedSets.map((_, index) => index));
          renderAll();
        });
      });

      document.querySelectorAll('.routine-guide-btn').forEach(b => {
        b.addEventListener('click', () => openFormGuideModal(b.dataset.gtitle, b.dataset.gnote, b.dataset.gvid, b.dataset.gvidid));
      });

      document.querySelectorAll('[data-video-part], [data-video-more]').forEach(button => {
        button.addEventListener('click', () => {
          const view = state.memberVideoView;
          if (button.dataset.videoPart) {
            view.part = button.dataset.videoPart;
            view.videoLimit = 10;
          } else {
            view.videoLimit += 10;
          }
          renderAll();
        });
      });

      document.querySelectorAll('.dv-play-btn').forEach(b => {
        b.addEventListener('click', () => openFormGuideModal(b.dataset.dvname, b.dataset.dvfb, '', b.dataset.dvid, b.dataset.dvexercise));
      });

      document.querySelectorAll('.dv-del-btn').forEach(b => {
        b.addEventListener('click', async () => {
          const dvid = b.dataset.dvdelid;
          if (!dvid || !state.trainerPassword) return;
          showToast('영상을 삭제 중입니다...');
          try {
            const delRes = await postRecords({ action: 'directVideoDelete', id: dvid, member: state.memberName, date: state.selectedDate, password: state.trainerPassword });
            if (delRes?.status !== 'success') throw new Error(delRes?.code || '삭제 실패');
            videoPlayUrlCache.delete(dvid);
            memberVideoVersion++;
            state.directVideos = state.directVideos.filter(x => x.id !== dvid);
            renderAll();
            showToast('영상이 삭제되었습니다 ✓');
          } catch (err) {
            showToast('삭제 실패: ' + (err?.message || '오류'));
          }
        });
      });

      document.querySelectorAll('.lview-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.lessonView = b.dataset.lview;
          renderAll();
        });
      });

      document.querySelectorAll('[data-exercise-record]').forEach(button => {
        button.addEventListener('click', () => openExerciseRecord(button.dataset.exerciseRecord));
      });
      document.getElementById('lesson-library-more')?.addEventListener('click', () => {
        state.lessonLibraryLimit += 15;
        renderAll();
      });

      document.querySelectorAll('.lib-del-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const exName = btn.dataset.libdel || '';
          const vidId = btn.dataset.libvidid || '';
          const lastDate = btn.dataset.libdate || '';
          const normKey = String(exName).trim().toLowerCase().replace(/\s+/g, '');
          if (!normKey) return;
          addHiddenExerciseKey(state.memberName, normKey);
          if (state.exerciseLibrary && state.exerciseLibrary[normKey]) {
            delete state.exerciseLibrary[normKey];
            try { localStorage.setItem(`fit_ex_lib_v2_${state.memberName}`, JSON.stringify(state.exerciseLibrary)); } catch {}
          }
          if (vidId && vidId.startsWith('direct:') && state.trainerPassword) {
            postRecords({ action: 'directVideoDelete', id: vidId, member: state.memberName, date: state.selectedDate, password: state.trainerPassword }).catch(() => {});
            videoPlayUrlCache.delete(vidId);
            memberVideoVersion++;
            state.directVideos = state.directVideos.filter(v => v.id !== vidId);
          }
          if (lastDate && state.trainerPassword && state.isLive) {
            try {
              const asDay = await postAppsScript({ action: 'read', member: state.memberName, date: lastDate, password: state.trainerPassword });
              const dayObj = unwrapDailyRecord(asDay);
              if (dayObj && Array.isArray(dayObj.routines)) {
                const nextRoutines = dayObj.routines.filter(r => String(r?.name || '').trim().toLowerCase().replace(/\s+/g, '') !== normKey);
                if (nextRoutines.length !== dayObj.routines.length) {
                  await postAppsScript({ member: state.memberName, date: lastDate, data: { routines: nextRoutines }, password: state.trainerPassword });
                }
              }
            } catch {}
          }
          renderAll();
          showToast(`'${exName}' 항목을 서버(${lastDate || '목록'})에서도 삭제했어요 ✓`);
        });
      });

      const libSearch = document.getElementById('lesson-lib-search');
      if (libSearch) {
        libSearch.addEventListener('input', e => {
          state.lessonSearch = e.target.value;
          state.lessonLibraryLimit = 15;
          renderAll();
          const n = document.getElementById('lesson-lib-search');
          if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
        });
      }

      const addR = document.getElementById('btn-add-routine');
      if (addR) addR.addEventListener('click', openAddRoutineModal);

      const timerLessonBtn = document.getElementById('btn-open-timer-lesson');
      if (timerLessonBtn) timerLessonBtn.addEventListener('click', openTimerModal);
      const plateLessonBtn = document.getElementById('btn-open-plate-lesson');
      if (plateLessonBtn) plateLessonBtn.addEventListener('click', openPlateCalcModal);

      const magBtn = document.getElementById('btn-open-magazine');
      if (magBtn) magBtn.addEventListener('click', () => openMagazineModal(getDailyMagazinePicks(state.selectedDate)[0]?.index || 0));
      document.querySelectorAll('.mag-item-btn').forEach(b => {
        b.addEventListener('click', () => openMagazineModal(Number(b.dataset.colidx)));
      });

      const handleMemberVideoFile = async (f, upload = {}) => {
          if (videoUploadInFlight) return;
          if (!f) return;
          if (!state.isLive || !state.token) {
            showToast('라이브 회원 링크에서만 영상 업로드가 가능해요');
            return;
          }
          videoUploadInFlight = true;
          failedVideoUpload = null;
          clearTimeout(videoUploadStatusTimer);
          const member = state.memberName;
          upload.date ||= state.selectedDate;
          document.getElementById('video-upload-retry')?.classList.add('hidden');
          showToast('자세 영상을 업로드 중입니다... ⏳');
          setVideoUploadStatus('운동 영상 준비 중',0);
          try {
            upload.onStage = (label, percent) => setVideoUploadStatus(label, percent);
            const directId = await uploadDirectVideoFile(f, member, state.token, '회원 자세 체크 영상', (pct, loaded, total) => {
              setVideoUploadStatus('전송 중 · ' + videoSizeLabel(loaded) + ' / ' + videoSizeLabel(total), pct);
            }, upload);
            memberVideoVersion++;
            const seconds = ms => (ms / 1000).toFixed(1) + '초';
            const size = upload.file.size < f.size
              ? videoSizeLabel(f.size) + ' → ' + videoSizeLabel(upload.file.size)
              : videoSizeLabel(f.size);
            const phases = [
              upload.timing.prepare >= 200 ? '준비 ' + seconds(upload.timing.prepare) : '',
              Number.isFinite(upload.timing.transfer) ? '전송 ' + seconds(upload.timing.transfer) : '',
              Number.isFinite(upload.timing.finish) ? '등록 ' + seconds(upload.timing.finish) : ''
            ].filter(Boolean).join(' · ');
            const originalReason = {
              hdr: 'HDR 유지', browser: '이 브라우저에서 압축 미지원', codec: '이 영상의 압축 미지원',
              format: '영상 형식 확인 불가', savings: '압축 효율이 낮음', timeout: '압축 시간이 길어짐',
              verification: '압축 영상 검증 실패', error: '압축을 완료하지 못함'
            }[upload.timing.optimization];
            const detail = [phases, originalReason && '원본 전송 · ' + originalReason].filter(Boolean).join(' / ');
            setVideoUploadStatus('업로드 완료 · ' + size, 100, true, detail || '피드백 탭에서 확인할 수 있어요.');
            videoUploadStatusTimer = setTimeout(() => setVideoUploadStatus('', 0, false), 15_000);
            if (state.appMode !== 'member' || state.memberName !== member) return;
            state.directVideos.unshift({ id: directId, name: f.name || '자세 영상', question: '회원 자세 체크 영상', feedback: '', createdAt: new Date().toISOString() });
            if (state.selectedDate !== upload.date) {
              renderAll();
              showToast('영상 업로드 완료! 피드백 탭에서 확인할 수 있어요 ✓');
              return;
            }
            state.record.memos.push({
              id: Date.now() + '-vid',
              from: 'member',
              text: `📹 자세 영상을 올렸어요 (${f.name || '영상'})`,
              time: nowTimeHHMM(),
              videoId: directId
            });
            renderAll();
            showToast('영상 업로드 완료! 피드백 탭에서 확인할 수 있어요 ✓');
            await savePatchLive({ memos: state.record.memos }, member, upload.date);
          } catch (err) {
            failedVideoUpload = { file: f, upload, member };
            setVideoUploadStatus('업로드 실패 · 다시 시도할 수 있어요',0,true);
            document.getElementById('video-upload-retry')?.classList.remove('hidden');
            showToast('영상 업로드 실패: ' + (err?.message || '다시 시도해 주세요'), 5000);
          } finally {
            videoUploadInFlight = false;
          }
      };
      ['member-vid-upload', 'member-vid-file'].forEach(id => {
        document.getElementById(id)?.addEventListener('change', e => {
          const file = e.target.files?.[0];
          if (file && normalizeVideoMime(file).startsWith('video/')) handleMemberVideoFile(file);
          else if (file) showToast('MP4, MOV 또는 WebM 영상을 선택해 주세요.');
          e.target.value = '';
        });
      });
      document.getElementById('video-upload-retry').onclick = () => {
        if (failedVideoUpload?.member === state.memberName) {
          handleMemberVideoFile(failedVideoUpload.file, failedVideoUpload.upload);
        }
      };



      const memoForm = document.getElementById('memo-form');
      if (memoForm) {
        memoForm.addEventListener('submit', e => {
          e.preventDefault();
          const inp = document.getElementById('memo-inp');
          const txt = inp.value.trim();
          if (!txt) return;
          state.record.memos.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), from: 'member', text: txt, time: nowTimeHHMM() });
          inp.value = '';
          showToast('코치님께 메모를 전송했어요');
          renderAll();
          savePatchLive({ memos: state.record.memos });
        });
      }

      document.getElementById('home-quick-workout')?.addEventListener('click', () => {state.memberTab='lesson';state.lessonView='today';renderAll();});
      document.getElementById('home-quick-diet')?.addEventListener('click', () => {state.memberTab='diet';renderAll();});
      const goL = document.getElementById('go-lesson');
      if (goL) goL.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goL2 = document.getElementById('go-lesson-2');
      if (goL2) goL2.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goD = document.getElementById('go-diet');
      if (goD) goD.addEventListener('click', () => { state.memberTab = 'diet'; renderAll(); });

      // Coach events
      document.getElementById('coach-refresh-overview')?.addEventListener('click', refreshCoachOverview);
      document.getElementById('coach-quick-registration')?.addEventListener('click', async (event) => {
        const button = event.currentTarget;
        const login = coachLoginVersion;
        const requireCoach = () => {
          if (state.appMode !== 'coach' || !state.isLive || !state.trainerPassword || coachLoginVersion !== login) {
            throw Object.assign(new Error('코치 로그인이 필요해요.'), { status: 403 });
          }
        };
        button.disabled = true;
        try {
          requireCoach();
          const { openCoachQuickRegistration } = await import('/fit-coach-quick-register.mjs?v=20261125-3');
          requireCoach();
          openCoachQuickRegistration({
            open: openModal,
            async members(date) {
              requireCoach();
              return postRecords({ action: 'listMembersFast', date, password: state.trainerPassword });
            },
            async read(member, date) {
              requireCoach();
              return readAppsDailyRecord({ member, date, password: state.trainerPassword });
            },
            async write(member, date, routines) {
              requireCoach();
              return writeAppsRecord({ data: { routines }, baselineRoutineIds: [] }, member, date, { password: state.trainerPassword });
            },
            validVideo: normalizeVideoMime,
            async prepare(file, signal, report) {
              requireCoach();
              const timing = {};
              if (file.size > 6 * 1024 * 1024) void import('/fit-video-transfer.mjs?v=3').catch(() => {});
              const prepared = await prepareDirectVideo(file, report, timing, signal);
              return { file: prepared, optimization: timing.optimization };
            },
            async upload(file, member, exercise, upload) {
              requireCoach();
              if (videoUploadInFlight) throw new Error('다른 영상 전송이 끝난 뒤 다시 시도해 주세요.');
              videoUploadInFlight = true;
              try {
                return await uploadDirectVideoFile(file, member, '', exercise, (percentage, loaded, total) => {
                  const stage = total > 0 ? '영상 전송 중 · ' + videoSizeLabel(loaded) + ' / ' + videoSizeLabel(total) : '영상 전송 중';
                  upload.onStage(stage, percentage);
                }, upload);
              } finally {
                videoUploadInFlight = false;
              }
            },
            onSaved(date) {
              if (date === state.selectedDate && state.appMode === 'coach' && coachLoginVersion === login) {
                void refreshCoachOverview();
              }
            }
          });
        } catch (error) {
          showToast(error?.status === 403 ? '코치 로그인이 필요해요.' : '빠른 등록 화면을 열지 못했어요. 다시 시도해 주세요.');
        } finally {
          button.disabled = false;
        }
      });
      document.querySelectorAll('.c-filter-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.coachFilter = b.dataset.cfilter;
          renderAll();
        });
      });

      document.querySelectorAll('.c-detail-btn').forEach(b => {
        b.addEventListener('click', () => openCoachDetailSheet(b.dataset.cname));
      });

      document.querySelectorAll('.c-archive-btn').forEach(btn => {
        btn.addEventListener('click', () => archiveCoachMember(btn.dataset.archiveMember, btn));
      });
      document.querySelectorAll('.c-restore-btn').forEach(btn => {
        btn.addEventListener('click', () => restoreCoachMember(btn.dataset.restoreMember, btn));
      });

      const addMemberBtn = document.getElementById('btn-add-member');
      if (addMemberBtn) addMemberBtn.addEventListener('click', openAddMemberModal);

      const coachColBtn = document.getElementById('btn-coach-tab-col');
      if (coachColBtn) coachColBtn.addEventListener('click', openColumnWriteModal);

      const csInp = document.getElementById('coach-search-inp');
      if (csInp) {
        csInp.addEventListener('input', e => {
          state.coachSearch = e.target.value.trim();
          renderAll();
          const n = document.getElementById('coach-search-inp');
          if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
        });
      }
    }

    // Floating Timer Bar Listeners
    document.getElementById('ft-minus').addEventListener('click', () => {
      state.timer.remaining = Math.max(5, state.timer.remaining - 10);
      updateFloatingTimerUI();
    });
    document.getElementById('ft-plus').addEventListener('click', () => {
      state.timer.remaining += 10;
      updateFloatingTimerUI();
    });
    document.getElementById('ft-toggle').addEventListener('click', () => {
      state.timer.running = !state.timer.running;
      if (state.timer.running) runTimerTick();
      updateFloatingTimerUI();
    });
    document.getElementById('ft-open').addEventListener('click', openTimerModal);
    document.getElementById('ft-stop').addEventListener('click', stopTimer);

    // FAB Listeners
    document.getElementById('fab-toggle').addEventListener('click', () => { state.fabOpen = !state.fabOpen; updateFabUI(); });
    document.getElementById('fab-timer').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openTimerModal(); });
    document.getElementById('fab-plate').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openPlateCalcModal(); });
    document.getElementById('fab-ounwan').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openOunwanCardModal(); });
    document.getElementById('fab-diet').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openMealModal('lunch', '점심'); });
    document.getElementById('fab-water').addEventListener('click', () => { state.fabOpen = false; addWaterCup(250); });
    document.getElementById('fab-memo').addEventListener('click', () => { state.fabOpen = false; state.memberTab = 'feedback'; renderAll(); });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });

    initLiveMemberData();
  </script>
</body>
</html>
