  <script>
    (() => {
      const url = new URL(location.href);
      const fragment = new URLSearchParams(url.hash.slice(1));
      const fromFragment = fragment.has('token');
      const credentials = fromFragment ? fragment : url.searchParams;
      const name = (credentials.get('name') || credentials.get('member') ||
        fragment.get('name') || fragment.get('member') || '').trim();
      const token = (credentials.get('token') || '').trim();
      window.fitMemberLink = { name, token };

      if (fromFragment || url.searchParams.has('token')) {
        // Allow an immediate refresh in this tab while the server verifies the link.
        if (name && name.length <= 100 && token && token.length <= 200) {
          try { sessionStorage.setItem('fit_tab_member_access_v1', JSON.stringify({ name, token })); } catch {}
        }
        for (const key of ['name', 'member', 'token']) {
          url.searchParams.delete(key);
          fragment.delete(key);
        }
        if (name) fragment.set('name', name);
        url.hash = fragment.toString();
        try { history.replaceState(history.state, '', url); } catch {}
      }
      window.addEventListener('hashchange', () => {
        if (new URLSearchParams(location.hash.slice(1)).has('token')) location.reload();
      });

      // Keep the optional font download off the first paint path.
      document.addEventListener('load', event => {
        if (event.target?.id === 'fit-font') event.target.media = 'all';
      }, true);
    })();
  </script>

    body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #E2E6EE;

    .card-teal { background: linear-gradient(145deg, #0F766E 0%, #14B8A6 100%); }
    .tap-scale { transition: transform 0.13s ease, background-color 0.16s ease, box-shadow 0.16s ease; }
    .tap-scale:active { transform: scale(0.975); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .confetti-dot {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      animation: confettiFall 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4); }
    }
    .skeleton {
      background: linear-gradient(90deg, #E5E7EB 25%, #F3F4F6 50%, #E5E7EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>

    }
    // --- Date & Clipboard Helpers ---
    function getTodayKST() {
      const now = new Date();
      return new Date(now.getTime() + 9 * 3600000).toISOString().slice(0, 10);
    }
    function shiftDateStr(dateStr, offset) {
      const d = new Date(dateStr + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + offset);
      return d.toISOString().slice(0, 10);
    }
    function daysBetween(olderStr, newerStr) {
      if (!olderStr) return 99;
      const a = new Date(olderStr + 'T00:00:00Z').getTime();
      const b = new Date(newerStr + 'T00:00:00Z').getTime();
      return Math.floor((b - a) / 86400000);
    }
    function nowTimeHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function formatMMSS(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }
    function buildWeekDays(anchorDate) {
      const d = new Date(anchorDate + 'T00:00:00Z');
      const sun = shiftDateStr(anchorDate, -d.getUTCDay());
      const labels = ['일', '월', '화', '수', '목', '금', '토'];
      return labels.map((day, i) => {
        const full = shiftDateStr(sun, i);
        return { day, date: Number(full.slice(8, 10)), fullDate: full };
      });
    }
    async function copyTextSafe(text) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch {}
      return fallbackCopy(text);
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.readOnly = true;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      try {
        ta.select();
        ta.setSelectionRange(0, text.length);
        return document.execCommand('copy') === true;
      } catch {
        return false;
      } finally {
        ta.remove();
      }
    }
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;');

    function getDailyCoachReplies(date = getTodayKST()) {
      const elapsedDays = Math.max(0, daysBetween('2026-11-24', date));
      const mixReplies = (workoutReplies, habitReplies, offset) => {
        const workoutStart = elapsedDays * 5 + offset;
        const habitStart = elapsedDays * 7 + offset;
        return [
          habitReplies[habitStart % habitReplies.length],
          workoutReplies[workoutStart % workoutReplies.length],
          habitReplies[(habitStart + 1) % habitReplies.length],
          workoutReplies[(workoutStart + 1) % workoutReplies.length]
        ];
      };
      return [
        ...mixReplies(COACH_QUICK_REPLIES, COACH_DAILY_HABIT_REPLIES, 0),
        ...mixReplies(COACH_FEEDBACK_EXAMPLES, COACH_DAILY_HABIT_FEEDBACK, 4)
      ];
    }

    function getDailyWorkoutPoint(dateStr) {
      const selected = Date.parse(String(dateStr || getTodayKST()) + 'T00:00:00Z');
      const date = Number.isFinite(selected) ? selected : Date.parse(getTodayKST() + 'T00:00:00Z');
      const elapsedDays = Math.floor((date - WORKOUT_POINT_START) / 86400000);
      const note = DAILY_WORKOUT_POINTS[elapsedDays] || '';
      const habitNote = note && elapsedDays % 2 === 0
        ? MEMBER_HOME_HABIT_TIPS[(elapsedDays / 2) % MEMBER_HOME_HABIT_TIPS.length]
        : '';
      return {
        day: WORKOUT_POINT_WEEKDAYS[new Date(date).getUTCDay()],
        note,
        homeNote: habitNote || note,
        homeTopic: habitNote ? '생활 다이어트 팁' : '운동 포인트'
      };
    }

    // Client-side Image Compression (fits Google Sheets 50k cell limit safely)
    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const source = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const encodeAt = (maxW, quality) => {
            const scale = Math.min(1, maxW / img.width);
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/jpeg', quality);
          };
          try {
            let out = encodeAt(400, 0.5);
            if (out.length > 18000) out = encodeAt(320, 0.42);
            if (out.length > 22000) out = encodeAt(260, 0.35);
            resolve(out);
          } catch (error) {
            reject(error);
          } finally {
            URL.revokeObjectURL(source);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(source);
          reject(new Error('사진을 읽지 못했어요'));
        };
        img.src = source;
      });
    }

    function compressAndWatermarkPhoto(file, memberName) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxW = 900;
            const scale = img.width > maxW ? maxW / img.width : 1;
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            // Timestamp watermark bar at bottom
            const barH = Math.max(44, Math.round(h * 0.085));
            ctx.fillStyle = 'rgba(11, 19, 43, 0.72)';
            ctx.fillRect(0, h - barH, w, barH);
            ctx.fillStyle = '#5EEAD4';
            ctx.font = `800 ${Math.max(13, Math.round(barH * 0.36))}px "Pretendard Variable", Pretendard, sans-serif`;
            ctx.fillText('FIT-CONNECT VERIFIED', 16, h - Math.round(barH * 0.34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `700 ${Math.max(13, Math.round(barH * 0.34))}px "Pretendard Variable", Pretendard, sans-serif`;
            const stamp = `${memberName} · ${getTodayKST()} ${nowTimeHHMM()}`;
            const tw = ctx.measureText(stamp).width;
            ctx.fillText(stamp, Math.max(16, w - tw - 16), h - Math.round(barH * 0.34));

            resolve(canvas.toDataURL('image/jpeg', 0.74));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Web Audio API Beep for Timer End

      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        [0, 0.22, 0.44].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.16, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + 0.17);
        });
      } catch {}
    }

    function playTempoTone(freq, dur) {

        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);

    // --- API Helpers ---
    const MEMBER_SESSION_STORAGE_KEY = 'fit_member_session_v1';
    let sessionExchange;
    async function memberAccess(member, date, { rejectedSession = '', includeDaily = false } = {}) {
      const token = state.token;
      if (!token || state.appMode !== 'member' || member !== state.memberName) throw Error('회원 전용 링크가 필요해요');
      if (state.session && state.session !== rejectedSession) return { session: state.session };
      if (sessionExchange?.member === member && sessionExchange.token === token) return sessionExchange.promise;
      const exchange = { member, token };
      exchange.promise = (async () => {
        let tokenHash;
        let cached;
        try {
          const digest = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(token));
          tokenHash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
          cached = JSON.parse(sessionStorage.getItem(MEMBER_SESSION_STORAGE_KEY) || 'null');
        } catch {}
        const canRestore = tokenHash && cached?.member === member && cached.tokenHash === tokenHash &&
          typeof cached.session === 'string' && cached.session !== rejectedSession && cached.exp > Date.now();
        const res = canRestore ? cached : await requestRecords({
          action: 'memberSession', member, date, token, ...(includeDaily ? { includeDaily: true } : {})
        });
        if ((!canRestore && res?.status !== 'success') || !res.session) throw Error('회원 인증을 확인하지 못했어요');
        if (state.appMode === 'member' && state.memberName === member && state.token === token) {
          state.session = res.session;
          if (!canRestore && tokenHash && Number.isFinite(res.exp) && res.exp > Date.now()) {
            try {
              sessionStorage.setItem(MEMBER_SESSION_STORAGE_KEY, JSON.stringify({
                member, tokenHash, session: res.session, exp: res.exp
              }));
            } catch {}
          }
        }
        return {
          session: res.session,
          ...(Object.hasOwn(res, 'daily') && !canRestore ? { daily: res.daily, legacyDaily: res.legacyDaily, date } : {})
        };
      })().finally(() => { if (sessionExchange === exchange) sessionExchange = null; });
      sessionExchange = exchange;
      return exchange.promise;
    }

    async function memberSession(member, date, rejectedSession = '') {
      const access = await memberAccess(member, date, { rejectedSession });
      return access.session;

    async function postRecords(payload) {
      const session = payload?.session;
      try {
        return await requestRecords(payload);
      } catch (err) {
        if (err?.status !== 403 || err.code !== 'session_invalid' || !session ||
            payload.password !== undefined || payload.member !== state.memberName ||
            state.appMode !== 'member' || !state.token) throw err;
        const renewed = await memberSession(payload.member, payload.date, session);
        return requestRecords({ ...payload, session: renewed });
      }
    }

    async function requestRecords(payload) {
      if (payload?.password === 'coach-cookie') {
        payload = { ...payload };
        delete payload.password;
        // Coach requests use only the server-issued cookie. A stale member
        // token/session must not accidentally downgrade them to member access.
        delete payload.token;
        delete payload.session;
      }
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timeoutMs = (payload?.action === 'directVideoBegin' || payload?.action === 'directVideoFinish' || payload?.action === 'memberSession') ? 25000 : 12000;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
      try {
        const res = await fetch('/api/records', {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          ...(ctrl ? { signal: ctrl.signal } : {})
        });
        if (!res.ok) {
          let errCode = '';
          try {
            const rawTxt = await res.text();
            try {
              const j = JSON.parse(rawTxt);
              errCode = j?.code || j?.error || j?.message || rawTxt.slice(0, 80);
            } catch {
              errCode = rawTxt.slice(0, 80);
            }
          } catch {}
          const e = new Error('records_' + res.status + (errCode ? ' (' + errCode + ')' : ''));
          e.status = res.status;
          e.code = errCode;
          throw e;
        }
        const result = await res.json();
        if (result?.status === 'error' || result?.status === 'denied') {
          const err = new Error(result.message || result.code || '서버 요청을 완료하지 못했어요');
          err.status = result.status === 'denied' ? 403 : res.status;
          err.code = result.code;
          throw err;
        }
        return result;
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    async function postAppsScript(payload) {
      if (payload?.password === 'coach-cookie') {
        payload = { ...payload };
        delete payload.password;
        // Coach requests use only the server-issued cookie. A stale member
        // token/session must not accidentally downgrade them to member access.
        delete payload.token;
        delete payload.session;
      }
      const res = await fetch('/api/apps-script', {
        method: 'POST',
        cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('apps_script_' + res.status);
      return res.json();

    function extractPhotoSrc(meal) {
      if (!meal || typeof meal !== 'object') return '';
      const raw = (Array.isArray(meal.photos) && meal.photos[0]) || meal.photo || '';
      if (typeof raw === 'string') return raw;
      if (raw && typeof raw === 'object') return raw.url || raw.src || raw.data || '';
      return '';

    function mergeDietRecords(primaryDiet, secondaryDiet, deletedPhotoMeals = []) {
      const p = (primaryDiet && typeof primaryDiet === 'object') ? primaryDiet : {};
      const s = (secondaryDiet && typeof secondaryDiet === 'object') ? secondaryDiet : {};
      const out = { ...s, ...p };
      ['breakfast', 'lunch', 'dinner', 'snack'].forEach(k => {
        const pm = p[k] || {};
        const sm = s[k] || {};
        const pPhoto = extractPhotoSrc(pm);
        const sPhoto = extractPhotoSrc(sm);
        // Supabase is the canonical store for meal edits. Apps Script may
        // still contain the previous revision, so merge it only as a fallback.
        // This also covers manual descriptions and calories (not just foods).
        const mergedMeal = { ...pm, ...sm };
        if (Array.isArray(sm.foods)) mergedMeal.foods = sm.foods;
        if (sPhoto || pPhoto) mergedMeal.photos = [sPhoto || pPhoto];
        if (deletedPhotoMeals.includes(k)) {
          mergedMeal.photos = [];
          mergedMeal.photo = '';
        }
        if (Object.keys(mergedMeal).length) out[k] = mergedMeal;
      });
      out.water = Number(p.water ?? s.water) || 0;
      return out;
    }

      if (!res || typeof res !== 'object') return {};
      if (res.data && typeof res.data === 'object' && !Array.isArray(res.data)) return res.data;

      const payload = { member, date, ...auth };

    function makeUuidV4() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    function normalizeVideoMime(file) {
      const t = String(file?.type || '').toLowerCase();
      if (t === 'video/x-m4v') return 'video/mp4';
      if (t === 'video/mp4' || t === 'video/webm' || t === 'video/quicktime' || t === 'image/jpeg' || t === 'image/png' || t === 'image/webp') return t;
      const n = String(file?.name || '').toLowerCase();
      if (n.endsWith('.jpg') || n.endsWith('.jpeg')) return 'image/jpeg';
      if (n.endsWith('.png')) return 'image/png';
      if (n.endsWith('.webp')) return 'image/webp';
      if (n.endsWith('.mov')) return 'video/quicktime';
      if (n.endsWith('.webm')) return 'video/webm';
      if (/\.(mp4|m4v)$/.test(n)) return 'video/mp4';
      return '';
    }

    function dataUrlToFile(dataUrl, filename) {
      const parts = String(dataUrl || '').split(',');
      const mimeMatch = (parts[0] || '').match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
      const bin = atob(parts[1] || '');
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new File([arr], filename || 'diet-photo.jpg', { type: mime });
    }

    function renderDirectOrImg(src, alt, memberName, cls) {
      const s = String(src || '').trim();
      if (!s) return '';
      if (s.startsWith('direct:')) {
        return `<img loading="lazy" decoding="async" data-directimg="${escapeHtml(s)}" data-directmember="${escapeHtml(memberName || state.memberName)}" alt="${escapeHtml(alt || '사진')}" class="${cls} bg-[#F4F6F9]" />`;
      }
      return `<img loading="lazy" decoding="async" src="${escapeHtml(s)}" alt="${escapeHtml(alt || '사진')}" class="${cls}" />`;
    }

    function hydrateDirectImages(memberOverride) {

    function xhrVideoTransfer(url, body, headers, onProgress, method = 'PUT') {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        Object.entries(headers || {}).forEach(([k, v]) => xhr.setRequestHeader(k, v));
        if (xhr.upload && typeof onProgress === 'function') {
          xhr.upload.onprogress = e => {
            if (e.lengthComputable && e.total > 0) {
              onProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)), e.loaded, e.total);
            }
          };
        }
        xhr.onload = () => resolve({
          ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status,
          location: method === 'POST' ? xhr.getResponseHeader('Location') : null,
          offset: method !== 'PUT' ? xhr.getResponseHeader('Upload-Offset') : null,
          text: xhr.responseText
        });
        xhr.onerror = () => reject(new Error('네트워크 연결이 불안정합니다'));
        xhr.ontimeout = () => reject(new Error('업로드 시간이 초과되었습니다'));
        xhr.timeout = method === 'HEAD' ? 10000 : 180000;
        xhr.send(body);
      });
    }

    function videoSizeLabel(bytes) {
      return (bytes / 1_000_000).toFixed(1) + 'MB';
    }

    const VIDEO_COMPRESSION_TARGET_BYTES = 50_000_000;
    const MAX_VIDEO_UPLOAD_BYTES = 100_000_000;
    let recentUploadRate;
    function lastUploadRate() {
      return recentUploadRate && performance.now() - recentUploadRate.at < 180_000 ? recentUploadRate.rate : 0;
    }

    async function prepareDirectVideo(file, report, timing, signal) {
      if (file.size < 12_000_000 || !normalizeVideoMime(file).startsWith('video/')) return file;
      const original = reason => {
        timing.optimization = reason;
        return file;
      };
      if (typeof VideoEncoder === 'undefined' || typeof VideoDecoder === 'undefined') return original('browser');

      if (signal?.aborted) return original('cancelled');
      const rate = lastUploadRate();
      const started = performance.now();
      const controller = new AbortController();
      // Use at most 75% of the estimated transfer savings for compression.
      const budgetFor = estimatedBytes => rate && file.size <= VIDEO_COMPRESSION_TARGET_BYTES
        ? Math.min(9000, (file.size - estimatedBytes) * 750 / rate) : 9000;
      const initialBudget = budgetFor(0);
      if (initialBudget < 1500) return original('savings');
      let timer;
      let stop;
      const deadline = new Promise(resolve => {
        stop = reason => {
          resolve(original(reason));
          controller.abort();
        };
        timer = setTimeout(() => stop('timeout'), initialBudget);
      });
      const cancel = () => stop('cancelled');
      signal?.addEventListener('abort', cancel, { once: true });
      const onEstimate = estimatedBytes => {
        if (controller.signal.aborted) return;
        clearTimeout(timer);
        const remaining = budgetFor(estimatedBytes) - (performance.now() - started);
        if (remaining < 1500) stop('savings');
        else timer = setTimeout(() => stop('timeout'), remaining);
      };
      try {
        const preparation = import('/fit-video-encode.mjs?v=3').then(({ compressIfWorthwhile }) => {
          controller.signal.throwIfAborted();
          return compressIfWorthwhile(file, controller.signal, percent => {
            if (!controller.signal.aborted) report('고화질 압축 중', Math.min(99, percent));
          }, rate, { onEstimate, onFallback: reason => {
            if (!controller.signal.aborted) timing.optimization = reason;
          } });
        });
        return await Promise.race([preparation, deadline]);
      } catch {
        return original('error');
      } finally {
        clearTimeout(timer);
        signal?.removeEventListener('abort', cancel);
      }
    }

    async function uploadDirectVideoFile(file, memberName, memberToken, questionText, onProgress, upload = {}) {
      if (!file?.size) throw new Error('비어 있지 않은 영상 파일을 선택해 주세요');
      upload.date ||= state.selectedDate;
      const attemptStarted = performance.now();
      if (!normalizeVideoMime(file)) throw new Error('MP4, MOV 또는 WebM 영상을 선택해 주세요');
      const password = state.trainerPassword;
      if (!password && !memberToken) throw new Error('회원 전용 토큰이 필요해요');
      const authPromise = password ? Promise.resolve({ password })
        : memberName === state.memberName && memberToken === state.token
          ? memberSession(memberName, upload.date).then(session => ({ session }))
          : Promise.resolve({ token: memberToken });
      const timing = upload.timing ||= {};
      const report = upload.onStage || (() => {});
      if (file.size > 6 * 1024 * 1024) void import('/fit-video-transfer.mjs?v=3').catch(() => {});
      const preparation = upload.file || (upload.prepared ? upload.prepared.then(result => {
        timing.optimization = result.optimization;
        return result.file;
      }) : prepareDirectVideo(file, report, timing));
      const [auth, prepared] = await Promise.all([authPromise, preparation]);
      if (prepared.size > MAX_VIDEO_UPLOAD_BYTES) {
        throw new Error('영상은 100MB까지 올릴 수 있어요. 영상을 짧게 잘라 다시 선택해 주세요.');
      }
      upload.file = prepared;
      const sendFile = upload.file;
      timing.originalBytes = file.size;
      timing.sentBytes = sendFile.size;
      const mime = normalizeVideoMime(sendFile);
      upload.id ||= makeUuidV4();
      const payload = {
        member: memberName, date: upload.date, id: upload.id, ...auth
      };
      if (!upload.transferred) {
        report('전송 준비 중', 0);
        let begin;
        try {
          begin = await postRecords({
            ...payload, action: 'directVideoBegin',
            name: (file.name || 'workout-video.mp4').slice(0, 150),
            question: String(questionText || '').slice(0, 1000), mime, size: sendFile.size
          });
        } catch (err) {
          if (err?.code === 'video_size_limit') {
            throw new Error('현재 저장소는 영상 50MB까지 지원해요. 영상을 짧게 잘라 다시 선택해 주세요.');
          }
          throw err;
        }
        if (begin?.status !== 'success') throw new Error('업로드 시작 실패');
        if (begin.alreadyReady) return 'direct:' + upload.id;
        if (!begin.url) throw new Error('업로드 주소를 받지 못했어요');
        const transferStart = performance.now();
        timing.prepare = transferStart - attemptStarted;
        report('영상 전송 중 · ' + videoSizeLabel(sendFile.size), 0);
        let sent = false;
        const canResume = sendFile.size > 6 * 1024 * 1024 && begin.uploadToken && begin.tusEndpoint && begin.objectName;
        if (begin.storage === 'r2' && sendFile.size > begin.partBytes) {
          const { sendR2Video } = await import('/fit-video-transfer.mjs?v=3');
          await sendR2Video(sendFile, begin, upload, xhrVideoTransfer, onProgress, report);
          sent = true;
        } else if (!upload.usePut && canResume) {
          try {
            const { sendResumableVideo } = await import('/fit-video-transfer.mjs?v=3');
            sent = await sendResumableVideo(sendFile, mime, begin, upload, xhrVideoTransfer, onProgress, report);
          } catch (error) {
            // Once Storage has given us a resumable URL, retain it on failure.
            if (upload.tusUrl) throw error;
          }
        }
        if (!sent) {
          upload.usePut = true;
          const headers = { 'Content-Type': mime };
          if (begin.storage !== 'r2') headers['x-upsert'] = 'true';
          let result = await xhrVideoTransfer(begin.url, sendFile, headers, onProgress);
          if (begin.storage !== 'r2' && !result.ok && [400, 415].includes(result.status)) {
            const form = new FormData();
            form.append('cacheControl', '3600');
            form.append('', sendFile);
            result = await xhrVideoTransfer(begin.url, form, {}, onProgress);
          }
          if (!result.ok) throw new Error('영상 전송 실패 (' + result.status + ')');
        }
        timing.transfer = performance.now() - transferStart;
        if (sendFile.size >= 1_000_000 && timing.transfer >= 300) {
          recentUploadRate = { rate: sendFile.size * 1000 / timing.transfer, at: performance.now() };
        }
        upload.transferred = true;
      }
      report('전송 완료 · 영상 등록 중', 99);
      const finishStart = performance.now();
      const finish = await postRecords({ ...payload, action: 'directVideoFinish' });
      if (finish?.status !== 'success') throw new Error('업로드 마무리 실패');
      timing.finish = performance.now() - finishStart;
      return 'direct:' + upload.id;
    }

    function syncExerciseLibrary(dateStr) {
      const lib = { ...(state.exerciseLibrary || {}) };
      const hidden = getHiddenExerciseKeys(state.memberName);
      const norm = n => String(n || '').trim().toLowerCase().replace(/\s+/g, '');
      (state.record?.routines || []).forEach(r => {
        const name = String(r.name || '').trim();
        const key = norm(name);
        if (!key || hidden.has(key)) return;
        const prev = lib[key] || { name };
        const w = Number(r.weight) || 0;
        const maxSetW = Array.isArray(r.setDetails) && r.setDetails.length
          ? Math.max(...r.setDetails.map(sd => Number(sd.weight) || 0))
          : w;
        const bestW = Math.max(Number(prev.bestWeight) || 0, maxSetW);
        const latest = dateStr >= (prev.lastDate || '');
        lib[key] = {
          name,
          lastWeight: latest ? (maxSetW > 0 ? String(maxSetW) : '') : prev.lastWeight,
          lastReps: latest ? String(r.reps || '') : prev.lastReps,
          lastDate: dateStr >= (prev.lastDate || '') ? dateStr : prev.lastDate,
          bestWeight: bestW > 0 ? String(bestW) : '',
          note: String(r.note || '').trim() || prev.note || '',
          videoUrl: String(r.videoUrl || '').trim() || prev.videoUrl || '',
          videoId: String(r.videoId || r.demoKey || '').trim() || prev.videoId || ''
        };
      });
      const savedExercises = state.insights?.exerciseLibrary;
      if (Array.isArray(savedExercises)) {
        savedExercises.forEach(item => {
          const key = norm(item.name);
          if (!key || hidden.has(key)) return;
          const prev = lib[key] || {};
          const latest = item.lastDate >= (prev.lastDate || '') ? item : prev;
          lib[key] = {
            ...prev,
            ...latest,
            bestWeight: Math.max(Number(prev.bestWeight) || 0, Number(item.bestWeight) || 0) || '',
            note: latest.note || item.note || prev.note || '',
            videoId: latest.videoId || item.videoId || prev.videoId || '',
            videoUrl: latest.videoUrl || item.videoUrl || prev.videoUrl || ''
          };
        });
      } else (state.insights?.progress || []).forEach(p => {
        const name = String(p.name || '').trim();
        const key = norm(name);
        if (!key || hidden.has(key) || !Array.isArray(p.points) || !p.points.length) return;
        const latestPt = p.points[p.points.length - 1];
        const maxPtW = Math.max(...p.points.map(pt => Number(pt.weight) || 0));
        const prev = lib[key] || { name };
        lib[key] = {
          ...prev,
          name,
          lastWeight: latestPt.weight ? String(latestPt.weight) : (prev.lastWeight || ''),
          lastReps: latestPt.reps ? String(latestPt.reps) : (prev.lastReps || ''),
          lastDate: latestPt.date >= (prev.lastDate || '') ? latestPt.date : prev.lastDate,
          bestWeight: Math.max(Number(prev.bestWeight) || 0, maxPtW) > 0 ? String(Math.max(Number(prev.bestWeight) || 0, maxPtW)) : ''
        };
      });
      const currentNames = new Set((state.record?.routines || []).map(r => norm(r.name)).filter(Boolean));
      const progressNames = new Set((savedExercises || state.insights?.progress || []).map(p => norm(p.name)).filter(Boolean));
      Object.keys(lib).forEach(k => {
        if (lib[k]?.lastDate === dateStr && !currentNames.has(k) && !progressNames.has(k)) {
          delete lib[k];
        }
      });
      state.exerciseLibrary = lib;
      try { localStorage.setItem(`fit_ex_lib_v2_${state.memberName}`, JSON.stringify(lib)); } catch {}
    }

    let memberReadVersion = 0;
    let memberColumnsRequest;
    let memberVideoVersion = 0;
    let memberVideoRequest;
    function loadMemberVideos(auth, token) {
      const version = memberVideoVersion;
      const cached = memberVideoRequest;
      if (cached?.member === auth.member && cached.token === token && cached.version === version &&
          Date.now() < cached.expires) return cached.promise;
      const request = { member: auth.member, token, version, expires: Date.now() + 15000 };
      request.promise = postRecords({ ...auth, action: 'directVideoList' }).then(result => {
        if (!Array.isArray(result?.videos)) throw Error('영상 목록 조회 실패');
        return result.videos;
      }).catch(error => {
        if (memberVideoRequest === request) memberVideoRequest = null;
        throw error;
      });
      memberVideoRequest = request;
      return request.promise;
    }

    async function loadMemberDateData(dateStr) {
      if (!state.isLive) return;
      const version = ++memberReadVersion;
      const member = state.memberName;
      const token = state.token;
      const stillCurrent = () => version === memberReadVersion && state.isLive &&
        state.appMode === 'member' && state.memberName === member && state.token === token && state.selectedDate === dateStr;
      const payload = { member, date: dateStr };
      async function readDay() {
        const access = await memberAccess(member, dateStr, { includeDaily: true });
        const daily = access.date === dateStr ? access.daily
          : await postRecords({ ...payload, action: 'read', session: access.session });
        if (!daily || typeof daily !== 'object' || Array.isArray(daily)) throw Error('잘못된 기록 응답');
        return { daily, legacyDaily: access.date === dateStr ? access.legacyDaily : undefined };
      }
      const readLegacy = () => postAppsScript({ ...payload, action: 'read', token });
      const reuseAccess = Boolean(state.session) && state.nativeDaily === false;
      const day = readDay().catch(async error => {
        const retryable = error?.name === 'AbortError' || error instanceof TypeError ||
          error?.status === 408 || error?.status === 429 || error?.status >= 500;
        if (!retryable || !stillCurrent()) throw error;
        await new Promise(resolve => setTimeout(resolve, 250));
        if (!stillCurrent()) throw error;
        return readDay();
      });
      const dbRead = day.then(result => result.daily);
      // Settle both paths together so a failed native read is handled once.
      const appRead = reuseAccess ? readLegacy() : day.then(result =>
        result.daily.nativeDaily ? result.daily : result.legacyDaily ?? readLegacy()
      );
      const [dailyRec, dailyAs] = await Promise.allSettled([dbRead, appRead]);
      if (!stillCurrent()) return;

      const recObj = dailyRec.status === 'fulfilled' ? unwrapDailyRecord(dailyRec.value) : null;
      const asObj = dailyAs.status === 'fulfilled' && !['error', 'denied'].includes(dailyAs.value?.status)
        ? unwrapDailyRecord(dailyAs.value) : null;
      if (recObj) state.nativeDaily = recObj.nativeDaily === true;
      state.mealReadVerified = Boolean(recObj);
      state.workoutReadVerified = Boolean(recObj && asObj);
      state.loading = false;
      if (!recObj) {
        const denied = [401, 403].includes(dailyRec.reason?.status);
        if (denied) {
          try {
            const tab = JSON.parse(sessionStorage.getItem('fit_tab_member_access_v1') || 'null');
            if (tab?.name === member && tab.token === token) sessionStorage.removeItem('fit_tab_member_access_v1');
          } catch {}
        }
        const cached = !denied && Boolean(state.session) && applyCachedMemberData(dateStr);
        if (!cached) {
          state.record = emptyDailyRecord();
          state.workoutDays = [];
          state.insights = null;
        }
        state.dayReadError = { denied, cached, linkExpired: dailyRec.reason?.code === 'link_expired' };
        renderAll();
        return;
      }
      state.dayReadError = null;
      try {
        localStorage.setItem('fit_last_member_access_v1', JSON.stringify({ name: member, token }));
      } catch {}
      const baseDaily = asObj && (asObj.routines || asObj.headerMessage || asObj.diet || asObj.memos) ? asObj : recObj;
      const chosenDaily = {
        ...baseDaily,
        ...(getPtSchedule(asObj) ?? getPtSchedule(recObj)),
        dailyCheckin: { ...baseDaily.dailyCheckin, ...recObj.dailyCheckin },

      if (asObj) restoreWorkoutSave();

      // Let the daily screen paint before optional dashboard requests start.
      const afterPaint = typeof requestAnimationFrame === 'function'
        ? callback => requestAnimationFrame(() => requestAnimationFrame(callback))
        : callback => setTimeout(callback, 0);
      afterPaint(async () => {
        if (!stillCurrent()) return;

        if (!memberColumnsRequest || memberColumnsRequest.member !== member) {

          columns.promise = postRecords({ ...auth, action: 'columnList', date: dateStr }).catch(error => {
            if (memberColumnsRequest === columns) memberColumnsRequest = null;
            throw error;
          });

        const insights = postRecords({ ...auth, action: 'memberInsights' });

        });
        const [ins, cols, days, videos] = await Promise.allSettled([
          insights,

    function emptyDailyRecord() {

    const videoPlayUrlCache = new Map();
    function resolvePlayableVideoUrl(videoId, authOverride, memberOverride, date = state.selectedDate) {
      if (!videoId) return Promise.resolve('');
      const member = memberOverride || state.memberName;
      const auth = authOverride || (state.appMode === 'coach' ? { password: state.trainerPassword }
        : state.session ? { session: state.session } : { token: state.token });
      const scope = auth.password ? 'coach' : 'member';
      const cached = videoPlayUrlCache.get(videoId);
      if (cached?.member === member && cached.scope === scope && Date.now() - cached.ts < 240000) return cached.promise;
      const action = String(videoId).startsWith('direct:') ? { action: 'directVideoPlay', id: videoId }
        : { action: 'videoPlaybackUrl', fileId: videoId, videoId };
      const entry = { member, scope, ts: Date.now() };
      const legacyAuth = auth.password ? auth : { token: state.token };
      entry.promise = postRecords({ ...action, member, date, ...auth }).then(async result => {
        if (result?.status === 'not_migrated') {
          const legacy = await postAppsScript({ action: 'videoDownload', member, date, fileId: videoId, ...legacyAuth });
          if (legacy?.status === 'success' && legacy.base64) {
            const bytes = Uint8Array.from(atob(legacy.base64), byte => byte.charCodeAt(0));
            entry.objectUrl = URL.createObjectURL(new Blob([bytes], { type: legacy.mime || 'video/mp4' }));
            return entry.objectUrl;
          }
        }
        const url = result?.url || result?.playbackUrl || result?.data?.url;
        if (!url) throw Error('영상 주소를 받지 못했어요');
        return url;
      }).catch(error => {
        if (videoPlayUrlCache.get(videoId) === entry) videoPlayUrlCache.delete(videoId);
        throw error;
      });
      const previous = videoPlayUrlCache.get(videoId);
      if (previous?.objectUrl) URL.revokeObjectURL(previous.objectUrl);
      videoPlayUrlCache.set(videoId, entry);
      return entry.promise;
    }

    // --- Live Save Wrappers ---
    async function saveDailyCheckinLive(checkinObj) {
      if (!state.isLive) return;
      try {
        await postRecords({ action: 'dailyCheckin', member: state.memberName, date: state.selectedDate, session: state.session, checkin: checkinObj });
      } catch {

      }

    async function writeAppsRecord(fields, member, date, auth) {
      const result = await postAppsScript({ member, date, ...auth, ...fields });
      if (result?.status !== 'success') throw Error(result?.message || result?.error || '기록 저장 실패');
    }

    function appsWriteAuth() {
      return state.appMode === 'coach' ? { password: state.trainerPassword } : { token: state.token };
    }

    async function savePatchLive(patch, member = state.memberName, date = state.selectedDate, baselineRoutineIds) {
      if (!state.isLive) {
        showToast('미리보기 모드라 저장되지 않았어요. 전용 링크로 접속해 주세요!');
        return false;
      }
      try {
        // Apps Script accepts routines in the data envelope and merges
        // submitted fields with the live record. patchData excludes routines.
        const fields = Object.hasOwn(patch, 'routines')
          ? { data: patch, ...(baselineRoutineIds ? { baselineRoutineIds } : {}) }
          : { action: 'patchData', patch };
        await writeAppsRecord(fields, member, date, appsWriteAuth());
        return true;
      } catch {
        showToast('저장을 확인하지 못했어요. 연결 확인 후 다시 시도해 주세요.');
        return false;
      }
    }

    // Serialized workout saves: capture the member/date at edit time. Rapid
    // taps are coalesced and no older request can finish AFTER the latest one.
    const workoutSaveJobs = new Map();
    function workoutSaveKey(member, date) { return JSON.stringify([member, date]); }
    function workoutDraftKey(key) { return 'fit_workout_draft_v1_' + key; }
    function combineWorkoutDrafts(earlier, later) {
      if (!earlier || !later) return later || earlier;
      if (earlier.routines || later.routines) {
        if (later.routines) return later;
        const routines = structuredClone(earlier.routines);
        applyWorkoutChanges(routines, later.changes);
        return { routines };
      }
      const changes = new Map();
      for (const change of [...earlier.changes, ...later.changes]) {
        changes.set(JSON.stringify([String(change.id), change.index]), change);
      }
      return { changes: [...changes.values()] };
    }

    function applyWorkoutChanges(routines, changes) {
      for (const { id, index, checked } of changes) {
        const routine = routines.find(item => String(item.id) === String(id));
        if (!routine || index >= Number(routine.sets)) continue;
        if (!Array.isArray(routine.completedSets)) routine.completedSets = [];
        routine.completedSets[index] = checked;
      }
    }

    function persistWorkoutDraft(job) {
      const key = workoutDraftKey(job.key);
      const draft = combineWorkoutDrafts(job.sending, job.pending);
      try {
        if (draft) sessionStorage.setItem(key, JSON.stringify(draft));
        else sessionStorage.removeItem(key);
      } catch {}
    }

    function restoreWorkoutSave() {
      const member = state.memberName, date = state.selectedDate, key = workoutSaveKey(member, date);
      let job = workoutSaveJobs.get(key);
      if (!job) {
        let pending;
        try { pending = JSON.parse(sessionStorage.getItem(workoutDraftKey(key))); } catch {}
        if (!Array.isArray(pending?.changes) && !Array.isArray(pending?.routines)) return;
        if (Array.isArray(pending.changes)) {
          const personalIds = new Set(state.record.routines
            .filter(routine => routine.routineType === 'homework')
            .map(routine => String(routine.id)));
          pending.changes = pending.changes.filter(change => personalIds.has(String(change.id)));
          if (!pending.changes.length && !pending.routines) {
            try { sessionStorage.removeItem(workoutDraftKey(key)); } catch {}
            return;
          }
        }
        job = { member, date, key, auth: appsWriteAuth(), pending, status: 'queued' };
        workoutSaveJobs.set(key, job);
      }
      const draft = combineWorkoutDrafts(job.sending, job.pending);
      if (draft?.routines) state.record.routines = structuredClone(draft.routines);
      if (draft?.changes) applyWorkoutChanges(state.record.routines, draft.changes);
      if (job.pending && !job.processing) flushWorkoutSave(job);
    }
    function workoutStatus() {
      return workoutSaveJobs.get(workoutSaveKey(state.memberName,state.selectedDate))?.status || '';
    }
    function updateWorkoutSaveLabel() {
      const el=document.getElementById('workout-save-status');
      if(!el)return;
      const status=workoutStatus();
      el.textContent=status==='failed'?'저장 실패 · 다시 시도':status==='saving'?'저장 중…':status==='queued'?'변경사항 저장 준비 중…':status==='saved'?'저장 완료 ✓':'세트를 누르면 자동 저장돼요';
      el.classList.toggle('text-red-700',status==='failed');
      el.classList.toggle('text-[#475569]',status!=='failed');
      const retry=document.getElementById('workout-save-retry');
      if(retry)retry.classList.toggle('hidden',status!=='failed');
    }
    function enqueueWorkoutSave(routine, indexes) {
      if (routine && routine.routineType !== 'homework') return;
      if (!state.isLive || !state.workoutReadVerified) {
        showToast('운동을 저장하려면 최신 기록을 먼저 불러와 주세요.');
        return;
      }
      const member = state.memberName, date = state.selectedDate, key = workoutSaveKey(member, date);
      let job = workoutSaveJobs.get(key);
      if (!job) {
        job = { member, date, key, auth: appsWriteAuth(), status: '' };
        workoutSaveJobs.set(key, job);
      }
      // A routine addition (or a legacy routine with no usable ID/count)
      // needs the routines-only write. Identified sets use atomic changes.
      const count = Number(routine?.sets);
      const draft = routine?.id != null && String(routine.id) && Number.isInteger(count) && count <= 100 &&
        indexes.every(index => index >= 0 && index < count)
        ? { changes: indexes.map(index => ({ id: routine.id, index, checked: Boolean(routine.completedSets?.[index]) })) }
        : { routines: structuredClone(state.record.routines || []) };
      job.pending = combineWorkoutDrafts(job.pending, draft);
      persistWorkoutDraft(job);
      job.status = 'queued';
      if (job.timer) clearTimeout(job.timer);
      job.timer = setTimeout(() => { job.timer = null; flushWorkoutSave(job); }, 420);
      updateWorkoutSaveLabel();
    }

    async function flushWorkoutSave(job) {
      if (job.processing || !job.pending) return;
      job.processing = true;
      try {
        while (job.pending) {
          const draft = job.pending;
          job.pending = null;
          job.sending = draft;
          job.status = 'saving';
          updateWorkoutSaveLabel();
          try {
            if (draft.routines) {
              await writeAppsRecord({ data: { routines: draft.routines } }, job.member, job.date, job.auth);
            } else {
              for (let offset = 0; offset < draft.changes.length; offset += 100) {
                await writeAppsRecord({ action: 'setProgressBatch', changes: draft.changes.slice(offset, offset + 100) },
                  job.member, job.date, job.auth);
              }
            }
            job.sending = null;
            persistWorkoutDraft(job);
            if (!job.pending) job.status = 'saved';
          } catch {
            job.pending = combineWorkoutDrafts(draft, job.pending);
            job.sending = null;
            persistWorkoutDraft(job);
            job.status = 'failed';
            showToast('운동 저장 실패 · 다시 시도 버튼을 눌러주세요');
            return;
          }
        }
      } finally {
        job.processing = false;
        updateWorkoutSaveLabel();
      }
    }
    function retryWorkoutSave() {
      const job=workoutSaveJobs.get(workoutSaveKey(state.memberName,state.selectedDate));
      if(job){if(job.timer)clearTimeout(job.timer);job.timer=null;flushWorkoutSave(job);}
    }
    // Flush a pending set edit when switching tabs/apps; avoid leaving a
    // debounce timer idle during an iPhone background transition.
    document.addEventListener('visibilitychange',()=>{

        workoutSaveJobs.forEach(job=>{
          if(job.timer){clearTimeout(job.timer);job.timer=null;}
          if(job.pending)flushWorkoutSave(job);
        });
      }
    });

    function getConfiguredTimerSeconds() {

    function startTimerCountdown(sec) {
      if (state.timer.interval) {
        clearInterval(state.timer.interval);
        state.timer.interval = null;
      }
      const targetSec = typeof sec === 'number' ? Math.max(5, sec) : getConfiguredTimerSeconds();
      state.timer.total = targetSec;
      state.timer.remaining = targetSec;
      state.timer.running = true;
      runTimerTick();
      updateFloatingTimerUI();
      const badge = document.getElementById('rest-timer-badge');
      if (badge) badge.textContent = `⏱ ${formatMMSS(state.timer.remaining)}`;
    }

    function runTimerTick() {
      if (state.timer.interval) clearInterval(state.timer.interval);
      state.timer.interval = setInterval(() => {
        if (!state.timer.running) return;
        state.timer.remaining -= 1;
        if (state.timer.remaining <= 0) {
          clearInterval(state.timer.interval);
          state.timer.interval = null;
          state.timer.remaining = 0;
          state.timer.running = false;
          if (state.timer.soundOn) playTimerBeep();
          if (state.timer.vibrateOn && navigator.vibrate) {
            try { navigator.vibrate([180, 90, 180]); } catch {}
          }
          showToast('휴식 완료! 다음 세트 시작해볼까요? 💪');
          triggerConfetti();

            renderTimerModalBody();
          });
        });

        if (timerTab === 'rest') {
          document.querySelectorAll('.tm-preset-btn').forEach(b => {
            b.addEventListener('click', () => {
              const s = Number(b.dataset.tsec);
              state.timer.customMin = Math.floor(s / 60);
              state.timer.customSec = s % 60;
              saveTimerPrefsLocal();
              startTimerCountdown(s);
              renderTimerModalBody();
            });
          });
          document.getElementById('tm-minus-10').addEventListener('click', () => {
            if (state.timer.remaining > 0) state.timer.remaining = Math.max(5, state.timer.remaining - 10);
            else {
              const next = Math.max(5, getConfiguredTimerSeconds() - 10);
              state.timer.customMin = Math.floor(next / 60);
              state.timer.customSec = next % 60;
              saveTimerPrefsLocal();
            }
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-plus-10').addEventListener('click', () => {
            if (state.timer.remaining > 0) state.timer.remaining += 10;
            else {
              const next = getConfiguredTimerSeconds() + 10;
              state.timer.customMin = Math.floor(next / 60);
              state.timer.customSec = next % 60;
              saveTimerPrefsLocal();
            }
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-start-btn').addEventListener('click', () => {
            if (state.timer.running) {
              state.timer.running = false;
              updateFloatingTimerUI();
            } else if (state.timer.remaining > 0) {
              state.timer.running = true;
              runTimerTick();
              updateFloatingTimerUI();
            } else {
              startTimerCountdown(getConfiguredTimerSeconds());
            }
            renderTimerModalBody();
          });
          const applyCustomInputs = () => {
            const m = Math.max(0, Math.min(30, Number(document.getElementById('tm-min-inp').value) || 0));
            const s = Math.max(0, Math.min(59, Number(document.getElementById('tm-sec-inp').value) || 0));
            state.timer.customMin = m;
            state.timer.customSec = s;
            saveTimerPrefsLocal();
            const disp = document.getElementById('tm-live-display');
            if (disp && state.timer.remaining <= 0) disp.textContent = formatMMSS(getConfiguredTimerSeconds());
          };
          document.getElementById('tm-min-inp').addEventListener('input', applyCustomInputs);
          document.getElementById('tm-sec-inp').addEventListener('input', applyCustomInputs);
          document.getElementById('tm-set-dec').addEventListener('click', () => {
            state.timer.setsDone = Math.max(0, state.timer.setsDone - 1);
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-set-inc').addEventListener('click', () => {
            state.timer.setsDone += 1;
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-auto-chk').addEventListener('change', e => {
            state.timer.autoStartOnCheck = e.target.checked;
            saveTimerPrefsLocal();
          });
          document.getElementById('tm-sound-chk').addEventListener('change', e => {
            state.timer.soundOn = e.target.checked;
            saveTimerPrefsLocal();
          });
          document.getElementById('tm-vib-chk').addEventListener('change', e => {
            state.timer.vibrateOn = e.target.checked;
            saveTimerPrefsLocal();
          });
        } else {
          document.getElementById('tp-toggle-btn').addEventListener('click', () => {
            if (tempoRunning) {
              stopTempoPacer();
              tempoRunning = false;
              renderTimerModalBody();
            } else {
              tempoRunning = true;
              const tickTempo = () => {
                const ph = document.getElementById('tp-phase-text');
                const rp = document.getElementById('tp-reps-text');
                if (!ph) { stopTempoPacer(); return; }
                ph.textContent = tempoLabels[tempoStep];
                for (let i = 0; i < 5; i++) {
                  const dot = document.getElementById('tp-dot-' + i);
                  if (dot) dot.className = `py-2 rounded-xl text-[11px] font-extrabold transition ${tempoStep === i ? 'bg-[#5EEAD4] text-[#0F172A]' : 'bg-white/10 text-white/60'}`;
                }
                if (state.timer.soundOn) {
                  playTempoTone(tempoStep === 4 ? 880 : (tempoStep === 3 ? 620 : 440), 0.11);
                }
                if (tempoStep === 4) {
                  tempoReps += 1;
                  if (rp) rp.textContent = `완료 횟수: ${tempoReps}회`;
                }
                tempoStep = (tempoStep + 1) % 5;
              };
              renderTimerModalBody();
              tickTempo();
              __tempoInterval = setInterval(tickTempo, 1000);
            }
          });
          document.getElementById('tp-reset-btn').addEventListener('click', () => {
            stopTempoPacer();
            tempoRunning = false;
            tempoStep = 0;
            tempoReps = 0;
            renderTimerModalBody();
          });
        }
      }
      renderTimerModalBody();
    }

    // --- Barbell Plate Calculator Modal ---
    function computePlatesPerSide(targetWeight, barWeight) {
      const plates = [20, 15, 10, 5, 2.5, 1.25];
      let perSide = Math.max(0, (targetWeight - barWeight) / 2);
      const result = [];
      plates.forEach(p => {
        while (perSide >= p - 0.001) {
          result.push(p);
          perSide -= p;
        }
      });
      return { plates: result, remainder: Math.round(perSide * 100) / 100 };
    }

        const { plates, remainder } = computePlatesPerSide(targetWeight, barWeight);

        const plateHeight = p => p >= 20 ? 58 : p >= 15 ? 50 : p >= 10 ? 42 : p >= 5 ? 34 : 26;

        openModal('바벨 원판(플레이트) 계산기', `

                  ${[20, 15].map(bw => `
                    <button type="button" data-bw="${bw}" class="pc-bar-btn px-2.5 py-1 rounded-full text-[11px] font-bold ${barWeight === bw ? 'hero-navy text-white' : 'bg-white text-[#4B5563]'}">바벨 ${bw}kg</button>

                  <input id="pc-target-inp" type="number" step="2.5" min="15" max="300" value="${targetWeight}" class="w-28 text-center text-[30px] font-extrabold text-[#1E3A8A] tabular-nums bg-transparent focus:outline-none" />

                <span class="text-[11px] font-bold text-[#5EEAD4]">한쪽당 꽂을 원판</span>

              </div>

                  <div class="w-24 h-2.5 bg-white/80 rounded-full mx-1"></div>

                ${plates.length ? Object.entries(grouped).map(([p, c]) => `${p}kg × ${c}장`).join(' + ') : '빈 바만 사용 (추가 원판 없음)'}
              </p>
              ${remainder > 0 ? `<p class="text-center text-[11px] text-[#FDE68A]">남는 무게: 양쪽 합 ${(remainder * 2).toFixed(1)}kg (최소 원판 1.25kg)</p>` : ''}

    // --- Ounwan (오늘 운동 완료) Quest Card Image Generator ---
    function openOunwanCardModal() {
      const wr = getWorkoutRate();
      const ds = getDietStats();
      const chk = state.record.dailyCheckin || {};
      const streak = state.insights?.careSummary?.workoutDays || state.workoutDays.length || 1;
      const coachMsg = (state.record.headerMessage || state.record.feedback?.workout || getDailyWorkoutPoint(state.selectedDate).note || "운동 기록을 확인해 보세요.").slice(0, 62);

      const q1Done = (wr.total > 0 && wr.done >= wr.total) || chk.workout === 'done';
      const q2Done = ds.water >= 2000;
      const q3Done = ds.loggedCount > 0 || chk.diet === 'done';
      const clearedCount = [q1Done, q2Done, q3Done].filter(Boolean).length;

      // 운동을 완료하면 100% 달성 처리 (수분/식단 미달 시에도 100% 클리어 성취감 제공)
      const questPct = q1Done ? 100 : (wr.total > 0 ? wr.pct : 0);
      const isAllClear = questPct >= 100;

      // 아쉬운 점 / 보완 포인트 자동 생성
      const improvements = [];
      if (!q1Done) improvements.push(`남은 운동 ${Math.max(1, wr.total - wr.done)}종목 마무리하기`);
      if (!q2Done) improvements.push(`수분 ${((2000 - ds.water) / 1000).toFixed(1)}L 추가 보충 (부종·피로 완화)`);
      if (!q3Done) improvements.push('식단 1끼 이상 기록해 영양 밸런스 체크하기');
      const focusText = improvements.length
        ? improvements.slice(0, 2).join(' · ')
        : '운동·수분·식단 밸런스 완벽! 충분한 수면으로 근회복을 마무리하세요.';

      const shareText = `[FIT-CONNECT 퀘스트] ${state.memberName}님 · ${state.selectedDate}\n${isAllClear ? 'QUEST CLEAR 100%!' : `퀘스트 ${questPct}% 진행 중`} (루틴 ${wr.done}/${wr.total} · 수분 ${(ds.water / 1000).toFixed(1)}L · 연속 ${streak}일)`;

      openModal('오늘의 퀘스트 카드 저장', `
        <div class="space-y-4">
          <div class="rounded-[22px] overflow-hidden shadow-xl bg-[#060B19]">
            <canvas id="ounwan-canvas" width="720" height="880" class="hidden"></canvas>
            <img id="ounwan-img-preview" alt="오운완 퀘스트 카드" class="w-full h-auto block" />

          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="btn-download-ounwan" class="tap-scale py-3.5 rounded-2xl hero-navy text-white text-[13px] font-extrabold">이미지 저장 · 공유</button>

      const grad = ctx.createLinearGradient(0, 0, 720, 880);
      grad.addColorStop(0, '#060B19');
      grad.addColorStop(0.52, '#0F1E42');
      grad.addColorStop(1, '#092B34');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 720, 880);

      // Subtle HUD Grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let gx = 40; gx < 720; gx += 40) {
        ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 880); ctx.stroke();
      }
      for (let gy = 40; gy < 880; gy += 40) {
        ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(720, gy); ctx.stroke();
      }

      // Ambient Glows
      const g1 = ctx.createRadialGradient(600, 120, 10, 600, 120, 260);
      g1.addColorStop(0, 'rgba(59, 130, 246, 0.28)');
      g1.addColorStop(1, 'rgba(59, 130, 246, 0)');
      ctx.fillStyle = g1;
      ctx.fillRect(0, 0, 720, 880);

      const g2 = ctx.createRadialGradient(120, 760, 10, 120, 760, 260);
      g2.addColorStop(0, 'rgba(20, 184, 166, 0.24)');
      g2.addColorStop(1, 'rgba(20, 184, 166, 0)');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, 720, 880);

      // Outer Frame

      ctx.roundRect(24, 24, 672, 832, 32);

    // --- Metrics & Visual SVGs ---
    function isRoutineDone(r) {
      if (!r) return false;
      if (r.routineType !== 'homework') return true; // PT 수업은 코치와 이미 수행한 수업 기록
      return Array.isArray(r.completedSets) && r.completedSets.some(Boolean);
    }

    function getWorkoutRate() {
      const rs = state.record.routines || [];
      if (!rs.length) return { done: 0, total: 0, pct: 0 };
      const done = rs.filter(isRoutineDone).length;
      return { done, total: rs.length, pct: Math.round((done / rs.length) * 100) };
    }

    function getDietStats() {
      const d = state.record.diet || {};
      const keys = ['breakfast', 'lunch', 'dinner', 'snack'];
      let kcal = 0, carb = 0, prot = 0, fat = 0, loggedCount = 0;
      keys.forEach(k => {
        const m = d[k] || {};
        const c = Number(m.cal) || 0;
        const hasPhotos = Array.isArray(m.photos) && m.photos.length > 0;
        if (c > 0 || String(m.desc || '').trim() || hasPhotos) loggedCount++;
        kcal += c;
        carb += Number(m.carb) || 0;
        prot += Number(m.prot) || 0;
        fat += Number(m.fat) || 0;
      });
      const macroSum = carb + prot + fat;
      return {
        kcal,
        pct: Math.min(100, Math.round((kcal / state.targetKcal) * 100)),
        loggedCount,
        carbPct: macroSum ? Math.round((carb / macroSum) * 100) : 45,
        protPct: macroSum ? Math.round((prot / macroSum) * 100) : 35,
        fatPct: macroSum ? Math.round((fat / macroSum) * 100) : 20,
        water: Number(d.water) || 0
      };
    }

    function computeCareScore() {
      const wr = getWorkoutRate();
      const ds = getDietStats();
      const chk = state.record.dailyCheckin || {};
      const weekDays = state.insights?.careSummary?.workoutDays || 0;
      let score = 55 + Math.min(20, weekDays * 6) + Math.round(wr.pct * 0.15);
      if (chk.workout === 'done') score += 5;
      if (chk.diet === 'done') score += 4;
      if (ds.loggedCount > 0) score += 3;
      return Math.min(100, score);
    }

    function heroRingsSvg(scorePct, kcalPct, routinePct) {
      const rings = [
        { r: 44, pct: scorePct, color: '#60A5FA', track: 'rgba(255,255,255,0.16)' },
        { r: 33, pct: Math.max(8, kcalPct), color: '#5EEAD4', track: 'rgba(255,255,255,0.14)' },
        { r: 22, pct: Math.max(8, routinePct), color: '#FFFFFF', track: 'rgba(255,255,255,0.12)' }
      ];
      return `
        <svg width="106" height="106" class="-rotate-90" viewBox="0 0 106 106">
          ${rings.map(ring => {
            const circ = 2 * Math.PI * ring.r;
            const offset = circ - (Math.min(100, ring.pct) / 100) * circ;
            return `
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.track}" stroke-width="7.5"/>
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="7.5" stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
            `;
          }).join('')}
        </svg>
      `;
    }

    function miniRing(pct) {
      const r = 16;
      const c = 2 * Math.PI * r;

      return `
        <svg width="42" height="42" class="-rotate-90" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4.5"/>

    function weeklyCurveSvg() {
      const wr = getWorkoutRate();
      const pts = state.weekDays.map((d, i) => {
        const isSel = d.fullDate === state.selectedDate;
        const worked = state.workoutDays.includes(d.fullDate);
        let val = worked ? 82 : 24;
        if (isSel) val = Math.max(val, wr.pct > 0 ? wr.pct : (state.record.dailyCheckin.workout === 'done' ? 85 : 35));
        const x = 16 + i * 52;
        const y = 74 - (val / 100) * 56;
        return { x, y, day: d.day, isSel, worked };
      });
      let pathD = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const cpX = (pts[i].x + pts[i + 1].x) / 2;
        pathD += ` C ${cpX} ${pts[i].y}, ${cpX} ${pts[i + 1].y}, ${pts[i + 1].x} ${pts[i + 1].y}`;
      }
      const areaD = `${pathD} L ${pts[pts.length - 1].x} 82 L ${pts[0].x} 82 Z`;

        <svg viewBox="0 0 344 96" class="w-full h-24 overflow-visible">
          <defs>
            <linearGradient id="liveCurve" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient>

          ${pts.map(pt => `

      const auth = appsWriteAuth();
      const { photos, photo, ...meal } = updated;
      // Native member records use the same database for text and photos.
      if (state.appMode !== 'member' || state.memberName !== member || !state.nativeDaily) {
        await writeAppsRecord({ action: 'patchData', patch: { diet: { [mealKey]: meal } } }, member, date, auth);
      }

      const result = await postRecords({
        action: 'dietSave', member, date, ...recordsAuth,
        diet: { [mealKey]: { ...meal, ...(newPhoto ? { photos: [newPhoto] } : {}) } }
      });
      if (result?.status !== 'success') throw Error('식단 서버 저장 실패');
      const saved = result.data?.diet?.[mealKey];
      if (!saved || saved.desc !== meal.desc || String(saved.cal ?? '') !== String(meal.cal ?? '')) {
        throw Error('식단 서버 반영 확인 실패');
      }
      if (Array.isArray(meal.foods)) {
        const signature = foods => JSON.stringify(foods.map(v => [
          String(v.name || ''), Number(v.grams) || 0, String(v.display || ''),
          Number(v.kcal) || 0, Number(v.carb) || 0, Number(v.prot) || 0, Number(v.fat) || 0
        ]));
        if (!Array.isArray(saved.foods) || signature(saved.foods) !== signature(meal.foods)) {
          throw Error('음식별 기록 서버 반영 확인 실패');
        }
      }
    }

    function foodWeightBasis(food) {
      const name = food[0];
      if (/생것·조리 전/.test(name)) return '조리 전 생것(가식부)';
      if (/구운 후|조리 후|삶은|찐 |데친|구이|계란 프라이|스크램블|감자튀김|구운김|훈제/.test(name)) return '조리 후 중량';
      if (/밥|찌개|국$|계란찜|제육볶음|불고기|닭볶음탕|비빔밥|김밥|볶음밥|떡볶이|잡채|카레라이스|돈가스|치킨|피자|햄버거|라면|우동|쌀국수|짜장면|짬뽕|칼국수|삼계탕|샌드위치/.test(name)) return '완성 음식 중량';
      if (/파우더|건조|오트밀|시리얼|그래놀라|에너지바|식빵|통밀빵|베이글|크루아상|가래떡|찹쌀떡|치즈|요거트|우유|두유|통조림|버터|주스|콜라|탄산수|아메리카노|라떼|참기름|오일/.test(name)) return '제품·먹는 상태 중량';
      return '먹는 부분(가식부) 중량';
    }

    // Practical household portions (approximate edible/cooked weights).
    // They are convenience conversions to grams, not independently verified label servings.
    function foodPortionOptions(food) {
      const n=food[0];
      if (/계란 흰자/.test(n)) return [{label:'개',grams:33}];
      if (/스크램블/.test(n)) return [{label:'인분',grams:food[6]}];
      if (/계란|달걀/.test(n)) return [{label:'개',grams:50}];
      if (/흰쌀밥|현미밥|잡곡밥|보리밥|흑미밥/.test(n)) return [{label:'공기',grams:210},{label:'반 공기',grams:105}];
      if (/바나나/.test(n)) return [{label:'개',grams:100}];
      if (/사과|배|오렌지|복숭아/.test(n)) return [{label:'개',grams:150}];
      if (/귤|키위/.test(n)) return [{label:'개',grams:100}];
      if (/식빵|통밀빵|체다치즈/.test(n)) return [{label:'장',grams:/치즈/.test(n)?20:35}];
      if (/베이글/.test(n)) return [{label:'개',grams:100}];
      if (/크루아상/.test(n)) return [{label:'개',grams:60}];
      if (/우유|두유|주스|콜라|아메리카노|라떼|탄산수/.test(n)) return [{label:'컵',grams:200}];
      if (/김밥/.test(n)) return [{label:'줄',grams:250}];
      if (/피자/.test(n)) return [{label:'조각',grams:120}];
      if (/에너지바/.test(n)) return [{label:'개',grams:45}];
      if (/구운김/.test(n)) return [{label:'장',grams:2}];
      if (/아몬드|호두|땅콩|캐슈넛|오트밀|그래놀라|시리얼/.test(n)) return [{label:'회분',grams:food[6]}];
      if (/고구마|감자 삶은|옥수수 삶은/.test(n)) return [{label:'개',grams:food[6]}];
      if (/찹쌀떡|가래떡/.test(n)) return [{label:'개',grams:food[6]}];
      if (/계란찜|스크램블 에그/.test(n)) return [{label:'인분',grams:food[6]}];
      if (/찌개|국$|국물포함|제육볶음|소불고기|닭볶음탕|비빔밥|볶음밥|떡볶이|잡채|카레라이스|돈가스|치킨|햄버거|짜장면|짬뽕|칼국수|삼계탕|샌드위치|라면|우동|쌀국수/.test(n)) return [{label:'인분',grams:food[6]}];
      if (/요거트|두부|훈제오리|통조림|김치|버터|치즈|프로틴|파우더|콩 삶은|검은콩|병아리콩|브로콜리|버섯|양상추|시금치|파프리카/.test(n)) return [{label:'회분',grams:food[6]}];
      // For meat, fish, vegetables and other foods with no natural "piece",
      // present clearly measured 100g and 200g choices in the search list.
      return [];
    }

            <input id="mf-desc" value="${escapeHtml(m.desc || '')}" placeholder="먹은 메뉴를 입력하세요" class="w-full text-sm px-3.5 py-2.5 rounded-2xl bg-[#F4F6F9]" />
            <input id="mf-cal" type="number" min="0" value="${escapeHtml(m.cal || '')}" placeholder="예상 칼로리 (kcal)" class="w-full text-sm px-3.5 py-2.5 rounded-2xl bg-[#F4F6F9]" />

          <div class="flex justify-end pt-1">
            <button type="button" id="meal-copy-yesterday" class="tap-scale inline-flex items-center gap-1 rounded-lg px-2.5 py-2 text-[11px] font-semibold text-[#475569] hover:bg-[#F1F5F9] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#2563EB]" title="어제 같은 끼니의 메뉴와 칼로리만 입력칸에 불러옵니다. 사진은 제외됩니다.">↺ 어제 기록 불러오기</button>

      document.getElementById('meal-delete-photo')?.addEventListener('click', async e => {

      document.getElementById('meal-photo-input').addEventListener('change', async e => {

      let savingMeal = false;
      async function commitMealSave(updated, labelText) {
        if (savingMeal) return;

        const submitBtn = document.querySelector('#meal-form button[type="submit"]');
        if (submitBtn) {

        savingMeal = true;
        document.querySelectorAll('.pr-btn').forEach(btn => { btn.disabled = true; });
        const member = state.memberName, date = state.selectedDate;
        const modalForm = document.getElementById('meal-form');
        try {
          await saveMealLive(member, date, mealKey, updated, hasNewPhoto ? compressedPhoto : '');
          const stillCurrent = state.memberName === member && state.selectedDate === date;
          if (stillCurrent) {
            state.record.diet[mealKey] = updated;
            saveCachedMemberData(date);
          }
          if (!stillCurrent || document.getElementById('meal-form') !== modalForm) {
            try { sessionStorage.removeItem(mealDraftKey); } catch {}
            showToast(labelText + ' ✓');
            return;
          }
          // Only recent generic food choices in tab-scoped storage, never member identifiers/photos.
          try {
            const previous=JSON.parse(sessionStorage.getItem(recentKey)||'[]');
            const fresh=(updated.foods||[]).filter(v=>!v.legacy && Number(v.grams)>0);
            const dedup=new Map();
            for(const v of [...fresh,...(Array.isArray(previous)?previous:[])])
              if(v && !dedup.has(v.name+'|'+v.grams))dedup.set(v.name+'|'+v.grams,v);
            sessionStorage.setItem(recentKey,JSON.stringify([...dedup.values()].slice(0,8)));
          } catch {}
          try { sessionStorage.removeItem(mealDraftKey); } catch {}
          closeModal();
          renderAll();
          showToast(labelText + ' ✓');
        } catch (err) {
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = '저장하기';
          }
          document.querySelectorAll('.pr-btn').forEach(btn => { btn.disabled = false; });
          if (document.getElementById('meal-form') === modalForm) preserveMealDraft();
          showToast('식단 저장을 완료하지 못했어요: ' + (err?.message || '네트워크를 확인해 주세요') + ' (일부 기록은 저장됐을 수 있어요)');
        } finally {
          savingMeal = false;
        }
      }

      // Food auto-complete only fills the existing form; it never auto-saves.
      let selectedFood = null;
      let automaticNutrition = null;
      const foodSearch = document.getElementById('food-search');
      const foodOptions = document.getElementById('food-options');
      const foodChoice = document.getElementById('food-choice');
      const foodGrams = document.getElementById('food-grams');
      const foodUnit = document.getElementById('food-unit');
      const foodQuantity = document.getElementById('food-quantity');
      const foodQtyLabel = document.getElementById('food-quantity-label');
      const foodUnitNote = document.getElementById('food-unit-note');
      const foodQuickPortions = document.getElementById('food-quick-portions');
      let foodPortions = [];
      const selectedAmount = () => {
        const index=Number(foodUnit.value);
        if(foodUnit.value==='g') return {grams:Number(foodGrams.value),display:''};
        const p=foodPortions[index],q=Number(foodQuantity.value);
        if(!p || !Number.isFinite(q) || q<0.5 || q>20) return {grams:NaN,display:''};
        return {grams:Math.round(p.grams*q*10)/10,display:q+p.label};
      };
      const refreshFoodUnit = () => {
        const useGrams=foodUnit.value==='g';
        foodGrams.classList.toggle('hidden',!useGrams);
        foodQuantity.classList.toggle('hidden',useGrams);
        foodQtyLabel.textContent=useGrams?'중량':'수량';
        const index=Number(foodUnit.value),p=foodPortions[index];
        foodUnitNote.textContent=useGrams?'정확한 중량을 아는 경우에만 입력해 주세요.':p?'일반적인 1'+p.label+' 기준으로 자동 계산돼요. 실제 양에 따라 달라질 수 있어요.':'';
        foodQuickPortions.replaceChildren();
        foodQuickPortions.classList.toggle('hidden',useGrams || !p);
        if (!useGrams && p) {
          for (const qty of [1,2,3]) {
            const button=document.createElement('button');
            button.type='button';
            button.className='tap-scale rounded-full border border-[#BFDBFE] bg-[#EFF6FF] px-3 py-2 text-[12px] font-bold text-[#1D4ED8]';

              foodQuantity.value=String(qty);

              button.setAttribute('aria-pressed','true');

          }
        }
        previewFood();
      };
      const foodPreview = document.getElementById('food-preview');
      const foodTotals = document.getElementById('food-totals');
      const foodValues = (food, grams) => {
        const ratio = grams / 100;
        return {kcal:Math.round(food[2]*ratio),carb:Math.round(food[3]*ratio*10)/10,
          prot:Math.round(food[4]*ratio*10)/10,fat:Math.round(food[5]*ratio*10)/10};
      };
      // New food items are stored alongside legacy desc/cal for backward compatibility.
      const savedItems=Array.isArray(m.foods)?m.foods.filter(v=>v && typeof v.name==='string' && v.name.length<=200).slice(0,24):[];
      const foodEntries=savedItems.length?savedItems.map(v=>({...v})):
        (String(m.desc||'').trim() || Number(m.cal)>0 ? [{
          name:String(m.desc||'기존 식단 기록'),legacy:true,grams:0,display:'',
          kcal:Number(m.cal)||0,carb:Number(m.carb)||0,prot:Number(m.prot)||0,fat:Number(m.fat)||0
        }]:[]);
      const recentKey='fit_food_recent_session_v1';
      const recentFoodPanel=document.getElementById('meal-recent-panel');
      const recentFoodList=document.getElementById('meal-recent-list');
      const itemsPanel=document.getElementById('meal-items-panel');
      const itemsList=document.getElementById('meal-items-list');
      const itemsCount=document.getElementById('meal-items-count');
      const itemsTotal=document.getElementById('meal-items-total');
      let foodItemsChanged=false;
      const recomputeItems=()=>{
        const total=foodEntries.reduce((a,v)=>({
          kcal:a.kcal+(Number(v.kcal)||0),carb:a.carb+(Number(v.carb)||0),
          prot:a.prot+(Number(v.prot)||0),fat:a.fat+(Number(v.fat)||0)
        }),{kcal:0,carb:0,prot:0,fat:0});
        const rounded={carb:Math.round(total.carb*10)/10,prot:Math.round(total.prot*10)/10,fat:Math.round(total.fat*10)/10};
        automaticNutrition=foodEntries.length?rounded:null;
        descField.value=foodEntries.map(v=>v.name+' '+(v.display|| (v.grams?v.grams+'g':''))).join(' + ').trim();
        calField.value=foodEntries.length?String(Math.round(total.kcal)):'';
        foodTotals.classList.toggle('hidden',!foodEntries.length);
        foodTotals.textContent='합계 약 '+Math.round(total.kcal)+'kcal · 탄 '+rounded.carb+'g / 단 '+rounded.prot+'g / 지 '+rounded.fat+'g';
        preserveMealDraft();
        return total;
      };
      const redrawItems=()=>{
        itemsPanel.classList.toggle('hidden',!foodEntries.length);
        itemsList.replaceChildren();
        itemsCount.textContent=foodEntries.length+'개';
        const totals=foodEntries.reduce((a,v)=>({
          kcal:a.kcal+(Number(v.kcal)||0),prot:a.prot+(Number(v.prot)||0)
        }),{kcal:0,prot:0});
        itemsTotal.textContent='총 '+Math.round(totals.kcal)+'kcal · 단백질 '+Math.round(totals.prot*10)/10+'g';
        foodEntries.forEach((v,i)=>{
          const row=document.createElement('div');

          const details=document.createElement('p');details.className='text-[11px] text-[#64748B]';details.textContent=(v.display|| (v.grams?v.grams+'g':''))+' · '+Math.round(Number(v.kcal)||0)+'kcal / 단 '+(Number(v.prot)||0).toFixed(1)+'g';
          body.append(name,details);row.appendChild(body);
          if(!v.legacy){
            const unit=v.unitLabel || 'g';
            const controls=document.createElement('div');
            controls.className='shrink-0 flex flex-col items-end gap-1.5';

            edit.setAttribute('aria-expanded','false');
            edit.className='rounded-lg border border-[#BFDBFE] px-2 py-1.5 text-[11px] font-bold text-[#1D4ED8]';
            const editBox=document.createElement('div');editBox.className='hidden flex items-center gap-1';
            const qtyInput=document.createElement('input');qtyInput.type='number';

            qtyInput.step=unit==='g'?'1':'0.5';

            const suffix=document.createElement('span');suffix.className='text-[11px] text-[#64748B]';suffix.textContent=unit;

            apply.className='rounded-lg bg-[#1D4ED8] px-2 py-1.5 text-[11px] font-bold text-white';
            edit.addEventListener('click',()=>{
              const expanded=editBox.classList.toggle('hidden')===false;

            apply.addEventListener('click',()=>{
              const quantity=Number(qtyInput.value);
              const grams=unit==='g'?quantity:quantity*Number(v.unitGrams);
              if(!(quantity>0 && grams>0 && grams<=2000 && Number.isFinite(grams))){showToast('올바른 수량을 입력해 주세요');return;}
              const source=FOOD_LOOKUP.find(f=>f[0]===v.name);

              const next=foodValues(source,grams);

              foodItemsChanged=true;recomputeItems();redrawItems();
            });
            editBox.append(qtyInput,suffix,apply);controls.append(edit,editBox);row.appendChild(controls);
          }
          const del=document.createElement('button');del.type='button';del.textContent='삭제';
          del.setAttribute('aria-label',v.name+' 삭제');
          del.className='shrink-0 rounded-lg px-2 py-1.5 text-[11px] font-bold text-[#B91C1C]';
          del.addEventListener('click',()=>{
            foodEntries.splice(i,1);foodItemsChanged=true;recomputeItems();redrawItems();
          });
          row.appendChild(del);itemsList.appendChild(row);
        });
      };
      const renderRecentFoods=()=>{
        recentFoodList.replaceChildren();
        let list=[];try{list=JSON.parse(sessionStorage.getItem(recentKey)||'[]')}catch{}
        if(!Array.isArray(list))list=[];
        list=list.filter(v=>v && FOOD_LOOKUP.some(f=>f[0]===v.name) && Number(v.grams)>0).slice(0,5);
        recentFoodPanel.classList.toggle('hidden',!list.length);
        for(const v of list){

          b.textContent=v.name+' '+(v.display||v.grams+'g');

            const values=foodValues(source,Number(v.grams));

              unitLabel:v.unitLabel||'g',unitGrams:Number(v.unitGrams)||1,qty:Number(v.qty)||Number(v.grams),...values});
