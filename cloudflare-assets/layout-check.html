<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIT-CONNECT 화면 크기 검사</title><style>body{margin:0;background:#e5eaf3;font:14px system-ui;color:#243953}header{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:8px}button{padding:10px 16px;border:1px solid #c9d3e6;border-radius:10px;background:white;color:#5042af;font-weight:700;cursor:pointer}button[aria-pressed=true]{background:#6258df;color:white}main{display:flex;justify-content:center;padding-bottom:12px}iframe{width:390px;height:844px;border:1px solid #d3dceb;background:white;border-radius:14px;max-width:100%}</style></head><body><header><strong>화면 크기 검사</strong><button aria-pressed="true" onclick="resizeFrame(390,this)">모바일 390</button><button aria-pressed="false" onclick="resizeFrame(1280,this)">PC 1280</button></header><main><iframe title="FIT-CONNECT 실제 앱" src="/"></iframe></main><script>function resizeFrame(width,button){document.querySelector('iframe').style.width=width+'px';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===button?'true':'false'));}</script></body></html>
