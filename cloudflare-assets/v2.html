<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIT-CONNECT</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #E2E6EE;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hero-navy {
      background:
        radial-gradient(circle at 88% 18%, rgba(56, 189, 248, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 12% 90%, rgba(20, 184, 166, 0.18) 0%, transparent 40%),
        linear-gradient(135deg, #0B132B 0%, #1E3A8A 58%, #2563EB 100%);
    }
    .card-blue { background: linear-gradient(145deg, #1D4ED8 0%, #3B82F6 100%); }
    .card-teal { background: linear-gradient(145deg, #0F766E 0%, #14B8A6 100%); }
    .tap-scale { transition: transform 0.13s ease, background-color 0.16s ease, box-shadow 0.16s ease; }
    .tap-scale:active { transform: scale(0.975); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .confetti-dot {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      animation: confettiFall 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4); }
    }
    .skeleton {
      background: linear-gradient(90deg, #E5E7EB 25%, #F3F4F6 50%, #E5E7EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#E2E6EE] text-[#111827]">

  <!-- Mobile App Frame -->
  <div class="mx-auto min-h-screen max-w-[430px] bg-[#F4F6F9] relative flex flex-col pb-28 sm:shadow-[0_12px_40px_rgba(15,23,42,0.12)]">

    <!-- Header -->
    <header id="app-header" class="sticky top-0 z-30 bg-[#F4F6F9]/94 backdrop-blur-xl px-5 pt-4 pb-3"></header>

    <!-- Main Dynamic View -->
    <main id="main-content" class="flex-1 px-4 pt-1 space-y-3.5"></main>

    <!-- Member Floating Action Button (+) -->
    <div id="member-fab-wrap" class="fixed bottom-20 left-1/2 -translate-x-1/2 w-full max-w-[430px] pointer-events-none z-40 px-4 flex flex-col items-end">
      <div id="fab-menu" class="hidden flex-col items-end gap-2 mb-2.5 pointer-events-auto animate-in">
        <button type="button" id="fab-diet" class="tap-scale px-4 py-2.5 rounded-full bg-white text-[#111827] text-[13px] font-bold shadow-[0_6px_20px_rgba(15,23,42,0.14)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#0F766E]"></span> 식단 빠른 기록
        </button>
        <button type="button" id="fab-water" class="tap-scale px-4 py-2.5 rounded-full bg-white text-[#111827] text-[13px] font-bold shadow-[0_6px_20px_rgba(15,23,42,0.14)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#3B82F6]"></span> 물 500ml 추가
        </button>
        <button type="button" id="fab-memo" class="tap-scale px-4 py-2.5 rounded-full bg-white text-[#111827] text-[13px] font-bold shadow-[0_6px_20px_rgba(15,23,42,0.14)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#1E3A8A]"></span> 코치에게 메모
        </button>
      </div>
      <button type="button" id="fab-toggle" class="pointer-events-auto tap-scale w-12 h-12 rounded-full hero-navy text-white shadow-[0_8px_24px_rgba(30,58,138,0.42)] flex items-center justify-center" aria-label="빠른 기록">
        <svg id="fab-icon" class="w-6 h-6 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- Bottom Tab Navigation -->
    <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-40 bg-white/95 backdrop-blur-xl border-t border-gray-200/70 px-2 pt-2 pb-3"></nav>
  </div>

  <!-- Bottom Sheet Modal -->

  <!-- Privacy Consent Bottom Sheet (1회 노출, localStorage 저장) -->

    <div class="w-full max-w-[430px] bg-white rounded-t-[28px] sm:rounded-[28px] p-6 shadow-2xl animate-in space-y-4">

      <div class="flex items-center gap-2.5">

          <span class="text-[11px] font-bold text-[#1D4ED8]">FIT-CONNECT 개인정보 보호</span>

  <script>
    // --- Date Helpers (KST) ---
    function getTodayKST() {
      const now = new Date();
      const kst = new Date(now.getTime() + 9 * 3600000);
      return kst.toISOString().slice(0, 10);
    }

    function shiftDateStr(dateStr, offset) {
      const d = new Date(dateStr + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + offset);
      return d.toISOString().slice(0, 10);
    }

    function daysBetween(dateA, dateB) {
      if (!dateA || !dateB) return 99;
      const a = new Date(dateA + 'T00:00:00Z').getTime();
      const b = new Date(dateB + 'T00:00:00Z').getTime();
      if (Number.isNaN(a) || Number.isNaN(b)) return 99;
      return Math.max(0, Math.round((b - a) / 86400000));
    }

    function nowTimeHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function buildWeekDays(anchorDate) {
      const d = new Date(anchorDate + 'T00:00:00Z');
      const dow = d.getUTCDay(); // 0=Sun
      const sun = shiftDateStr(anchorDate, -dow);
      const labels = ['일', '월', '화', '수', '목', '금', '토'];
      return labels.map((day, i) => {
        const full = shiftDateStr(sun, i);
        return { day, date: Number(full.slice(8, 10)), fullDate: full };
      });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // --- Parse URL Query (?name=김윤지&token=...&date=...) ---
    const urlParams = new URLSearchParams(window.location.search);
    const paramName = (urlParams.get('name') || urlParams.get('member') || '').trim();
    const paramToken = (urlParams.get('token') || '').trim();
    const paramDate = /^\d{4}-\d{2}-\d{2}$/.test(urlParams.get('date') || '') ? urlParams.get('date') : getTodayKST();
    const isLiveOrigin = window.location.protocol.startsWith('http') && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1');

      const clean = String(name || '').replace(/\(.*?\)/g, '').trim();
      for (const key of Object.keys(FORM_TIPS)) {
        if (clean.includes(key) || key.includes(clean)) return { title: key, ...FORM_TIPS[key] };
      }
      return {
        title: clean || '맞춤 자세 가이드',
        cue: '호흡과 복압을 먼저 세팅한 뒤 천천히 컨트롤하며 수행하세요',

    // --- API Helpers (100% compatible with cloudflare-worker.js) ---
    async function postRecords(payload) {
      const res = await fetch('/api/records', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('records_' + res.status);
      return res.json();
    }

    async function postAppsScript(payload) {
      const res = await fetch('/api/apps-script', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('apps_script_' + res.status);
      return res.json();
    }

    // --- Browser Canvas JPEG Compression (<=900px) ---
    function compressImageToDataUrl(file, maxDim = 900, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('file_read_error'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('img_decode_error'));
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w >= h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // --- Clipboard Helper ---
    async function copyTextToClipboard(text, toastMsg = '클립보드에 복사되었어요!') {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        showToast(toastMsg);
      } catch {
        showToast('복사에 실패했어요');
      }
    }

    // --- Normalize Meal Object ---
    function normalizeMeal(m) {
      const obj = m && typeof m === 'object' ? m : {};
      return {
        desc: obj.desc || '',
        cal: obj.cal || '',
        carb: obj.carb || '',
        prot: obj.prot || '',
        fat: obj.fat || '',
        photos: Array.isArray(obj.photos) ? obj.photos : []
      };
    }

    async function initLiveMemberData() {
      checkPrivacyConsent();
      if (!isLiveOrigin || !state.memberName || !state.token) {
        renderAll();
        return;
      }
      state.loading = true;
      renderAll();
      try {
        const sessRes = await postRecords({
          action: 'memberSession',
          member: state.memberName,
          token: state.token,
          date: state.selectedDate
        });
        if (sessRes?.status === 'success' && sessRes.session) {
          state.session = sessRes.session;
          state.isLive = true;
        }
        await loadMemberDateData(state.selectedDate);
      } catch {
        state.isLive = false;
        showToast('미리보기 데이터로 표시 중입니다');

        state.loading = false;

    async function loadMemberDateData(dateStr) {
      if (!state.isLive) return;
      const auth = state.session
        ? { session: state.session }
        : { token: state.token };
      const month = dateStr.slice(0, 7);

      const [daily, ins, cols, hist] = await Promise.allSettled([
        postRecords({ action: 'read', member: state.memberName, date: dateStr, ...auth }),
        postRecords({ action: 'memberInsights', member: state.memberName, date: dateStr, ...auth }),
        postRecords({ action: 'columnList', member: state.memberName, date: dateStr, ...auth }),
        postRecords({ action: 'workoutHistory', member: state.memberName, date: dateStr, month, ...auth })
      ]);

      if (daily.status === 'fulfilled' && daily.value && typeof daily.value === 'object') {
        const d = daily.value;
        state.record = {
          headerMessage: d.headerMessage || '',
          routines: Array.isArray(d.routines) ? d.routines : [],
          reflection: d.reflection || { good: '', bad: '' },
          diet: {
            breakfast: normalizeMeal(d.diet?.breakfast),
            lunch: normalizeMeal(d.diet?.lunch),
            dinner: normalizeMeal(d.diet?.dinner),
            snack: normalizeMeal(d.diet?.snack),
            water: Number(d.diet?.water) || 0
          },
          feedback: d.feedback || { workout: '', diet: '', time: '' },
          memos: Array.isArray(d.memos) ? d.memos : [],
          dailyCheckin: d.dailyCheckin || { workout: '', diet: '', mood: '' }
        };
      }
      if (ins.status === 'fulfilled' && ins.value?.status === 'success') {
        state.insights = ins.value;
      }
      if (cols.status === 'fulfilled' && cols.value?.status === 'success' && Array.isArray(cols.value.columns) && cols.value.columns.length) {
        state.columns = cols.value.columns;
      }
      if (hist.status === 'fulfilled' && hist.value?.status === 'success') {
        if (Array.isArray(hist.value.days)) state.workoutDays = hist.value.days;
        if (hist.value.previous && typeof hist.value.previous === 'object') state.previousWeights = hist.value.previous;
      }
    }

    // --- Metrics Computation ---
    function getWorkoutRate() {
      const rs = state.record.routines || [];
      if (!rs.length) return { done: 0, total: 0, pct: 0 };
      const done = rs.filter(r => Array.isArray(r.completedSets) && r.completedSets.some(Boolean)).length;
      return { done, total: rs.length, pct: Math.round((done / rs.length) * 100) };
    }

    function getDietStats() {
      const d = state.record.diet || {};
      const keys = ['breakfast', 'lunch', 'dinner', 'snack'];
      let kcal = 0, carb = 0, prot = 0, fat = 0, loggedCount = 0, photoCount = 0;
      keys.forEach(k => {
        const m = d[k] || {};
        const c = Number(m.cal) || 0;
        const hasPhoto = Array.isArray(m.photos) && m.photos.length > 0;
        if (hasPhoto) photoCount += m.photos.length;
        if (c > 0 || String(m.desc || '').trim() || hasPhoto) loggedCount++;
        kcal += c;
        carb += Number(m.carb) || 0;
        prot += Number(m.prot) || 0;
        fat += Number(m.fat) || 0;
      });
      const macroSum = carb + prot + fat;
      return {
        kcal,
        pct: Math.min(100, Math.round((kcal / state.targetKcal) * 100)),
        loggedCount,
        photoCount,
        carbPct: macroSum ? Math.round((carb / macroSum) * 100) : 45,
        protPct: macroSum ? Math.round((prot / macroSum) * 100) : 35,
        fatPct: macroSum ? Math.round((fat / macroSum) * 100) : 20,
        water: Number(d.water) || 0
      };
    }

    function computeCareScore() {
      const wr = getWorkoutRate();
      const ds = getDietStats();
      const chk = state.record.dailyCheckin || {};
      const weekDays = state.insights?.careSummary?.workoutDays || 0;
      let score = 55 + Math.min(20, weekDays * 6) + Math.round(wr.pct * 0.15);
      if (chk.workout === 'done') score += 5;
      if (chk.diet === 'done') score += 4;
      if (ds.loggedCount > 0) score += 3;
      return Math.min(100, score);
    }

    function heroRingsSvg(scorePct, kcalPct, routinePct) {
      const rings = [
        { r: 44, pct: scorePct, color: '#60A5FA', track: 'rgba(255,255,255,0.16)' },
        { r: 33, pct: Math.max(8, kcalPct), color: '#5EEAD4', track: 'rgba(255,255,255,0.14)' },
        { r: 22, pct: Math.max(8, routinePct), color: '#FFFFFF', track: 'rgba(255,255,255,0.12)' }
      ];
      return `
        <svg width="106" height="106" class="-rotate-90" viewBox="0 0 106 106">
          ${rings.map(ring => {
            const circ = 2 * Math.PI * ring.r;
            const offset = circ - (Math.min(100, ring.pct) / 100) * circ;
            return `
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.track}" stroke-width="7.5"/>
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="7.5" stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
            `;
          }).join('')}
        </svg>
      `;
    }

    function miniRing(pct) {
      const r = 16;
      const c = 2 * Math.PI * r;
      const offset = c - (Math.min(100, pct) / 100) * c;
      return `
        <svg width="42" height="42" class="-rotate-90" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4.5"/>
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"
            stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
        </svg>
      `;
    }

    // --- Weekly Workout Rhythm SVG Curve (linked to workoutDays) ---
    function renderWeeklyRhythmSvg() {
      const wr = getWorkoutRate();
      const chk = state.record.dailyCheckin || {};
      const pts = state.weekDays.map((d, idx) => {
        const isSelected = d.fullDate === state.selectedDate;
        const inHistory = state.workoutDays.includes(d.fullDate);
        const activeToday = isSelected && (wr.done > 0 || chk.workout === 'done');
        const active = inHistory || activeToday;
        const x = 22 + idx * 46;
        // Compute rhythm height: active days rise smoothly, selected day reflects completion
        const y = active ? (isSelected ? Math.max(16, 44 - Math.round(wr.pct * 0.26)) : 20) : 56;
        return { ...d, x, y, active, isSelected };
      });

      let dPath = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const cx = ((pts[i].x + pts[i + 1].x) / 2).toFixed(1);
        dPath += ` C ${cx} ${pts[i].y}, ${cx} ${pts[i + 1].y}, ${pts[i + 1].x} ${pts[i + 1].y}`;
      }
      const areaPath = `${dPath} L ${pts[pts.length - 1].x} 72 L ${pts[0].x} 72 Z`;
      const activeCount = pts.filter(p => p.active).length;

      return `
        <section class="bg-white rounded-[24px] p-5 shadow-[0_4px_20px_rgba(15,23,42,0.04)]">
          <div class="flex items-center justify-between mb-2">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-[#1D4ED8]">WEEKLY RHYTHM</span>
              <h2 class="text-[16px] font-bold text-[#111827]">주간 운동 리듬</h2>
            </div>
            <span class="text-[12px] font-extrabold px-2.5 py-1 rounded-full bg-[#EFF6FF] text-[#1D4ED8]">이번 주 ${activeCount}일 활성화</span>
          </div>
          <svg viewBox="0 0 320 92" class="w-full h-24 overflow-visible">
            <defs>
              <linearGradient id="rhythmGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
              </linearGradient>
            </defs>
            <line x1="16" y1="22" x2="304" y2="22" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
            <line x1="16" y1="56" x2="304" y2="56" stroke="#F1F5F9" stroke-width="1"/>
            <path d="${areaPath}" fill="url(#rhythmGrad)"/>
            <path d="${dPath}" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round"/>
            ${pts.map(p => `
              <g>
                <circle cx="${p.x}" cy="${p.y}" r="${p.isSelected ? 5.5 : (p.active ? 4.2 : 3)}"
                  fill="${p.active ? '#1D4ED8' : '#CBD5E1'}" stroke="#FFFFFF" stroke-width="2"/>
                <text x="${p.x}" y="86" text-anchor="middle" font-size="10" font-weight="${p.isSelected ? '800' : '600'}"
                  fill="${p.isSelected ? '#1D4ED8' : '#64748B'}">${p.day}</text>
              </g>
            `).join('')}
          </svg>
        </section>
      `;
    }

    // --- Coach Features: Load Member Context for Briefing / Log / Diet Reply ---
    async function fetchMemberContextForCoach(memberName) {
      if (state.coachMemberCache[memberName]) return state.coachMemberCache[memberName];
      if (memberName === state.memberName) {
        return {
          record: JSON.parse(JSON.stringify(state.record)),
          previous: state.previousWeights
        };
      }
      if (state.isLive && state.trainerPassword) {
        try {
          const [rec, hist] = await Promise.allSettled([
            postRecords({ action: 'read', member: memberName, date: state.selectedDate, password: state.trainerPassword }),
            postRecords({ action: 'workoutHistory', member: memberName, date: state.selectedDate, month: state.selectedDate.slice(0, 7), password: state.trainerPassword })
          ]);
          const rVal = rec.status === 'fulfilled' && rec.value ? rec.value : {};
          const hVal = hist.status === 'fulfilled' && hist.value?.previous ? hist.value.previous : {};
          const ctx = {
            record: {
              headerMessage: rVal.headerMessage || '',
              routines: Array.isArray(rVal.routines) && rVal.routines.length ? rVal.routines : [
                { id: 1, name: '고블릿 스쿼트', weight: '16', sets: '4', reps: '12', note: '하체 기본 루틴', completedSets: [true, true, true, true] },
                { id: 2, name: '루마니안 데드리프트', weight: '30', sets: '4', reps: '10', note: '둔근/햄스트링', completedSets: [true, true, true, true] }
              ],
              reflection: rVal.reflection || { good: '', bad: '' },
              diet: {
                breakfast: normalizeMeal(rVal.diet?.breakfast),
                lunch: normalizeMeal(rVal.diet?.lunch),
                dinner: normalizeMeal(rVal.diet?.dinner),
                snack: normalizeMeal(rVal.diet?.snack),
                water: Number(rVal.diet?.water) || 0
              },
              feedback: rVal.feedback || { workout: '', diet: '', time: '' },
              memos: Array.isArray(rVal.memos) ? rVal.memos : [],
              dailyCheckin: rVal.dailyCheckin || { workout: '', diet: '', mood: '' }
            },
            previous: hVal
          };
          state.coachMemberCache[memberName] = ctx;
          return ctx;
        } catch {
          // fallback below
        }
      }
      const fallback = {
        record: {
          headerMessage: `${memberName} 회원님, 오늘 컨디션에 맞춰 코어와 하체 밸런스에 집중해 진행했어요.`,
          routines: [
            { id: 1, name: '고블릿 스쿼트', weight: '16', sets: '4', reps: '12', note: '발목 가동성 워밍업 후 진행', completedSets: [true, true, true, true] },
            { id: 2, name: '루마니안 데드리프트', weight: '30', sets: '4', reps: '10', note: '고관절 힌지 유지', completedSets: [true, true, true, true] },
            { id: 3, name: '데드버그 (개인숙제)', weight: '0', sets: '3', reps: '12', note: '허리 바닥 밀착', completedSets: [true, true, true] }
          ],
          reflection: { good: '', bad: '' },
          diet: {
            breakfast: { desc: '단백질 쉐이크 · 바나나 1개', cal: '320', carb: '38', prot: '25', fat: '5', photos: [] },
            lunch: { desc: '닭가슴살 샐러드 · 현미밥 반 공기', cal: '540', carb: '55', prot: '36', fat: '12', photos: [] },
            dinner: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            snack: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            water: 1500
          },
          feedback: { workout: '', diet: '', time: '' },
          memos: [
            { id: 'cm1', from: 'member', text: '코치님! 왼쪽 무릎 시큰거림은 많이 좋아졌고 오늘은 컨디션 좋습니다.', time: '11:20' }
          ],
          dailyCheckin: { workout: 'done', diet: 'done', mood: 'good' }
        },
        previous: {
          '고블릿 스쿼트': { date: shiftDateStr(state.selectedDate, -3), weight: '16', reps: '12' },
          '루마니안 데드리프트': { date: shiftDateStr(state.selectedDate, -3), weight: '30', reps: '10' }
        }
      };
      state.coachMemberCache[memberName] = fallback;
      return fallback;
    }

      `);

      document.querySelectorAll('.w-delta-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.ridx);
          const delta = Number(btn.dataset.delta);
          const next = Math.max(0, (Number(draftRoutines[idx].weight) || 0) + delta);
          draftRoutines[idx].weight = String(next);
          document.getElementById(`w-val-${idx}`).textContent = `${next}kg`;
        });
      });

      document.querySelectorAll('.p-comment-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById('qlog-comment').value = presetComments[Number(btn.dataset.pcomment)];
        });
      });

      const voiceBtn = document.getElementById('btn-voice-input');
      voiceBtn.addEventListener('click', () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          document.getElementById('qlog-comment').value = presetComments[0];
          showToast('브라우저 음성인식 미지원으로 추천 코멘트가 입력되었어요');
          return;
        }
        const rec = new SpeechRecognition();
        rec.lang = 'ko-KR';
        rec.interimResults = false;
        voiceBtn.textContent = '🎙️ 듣는 중...';
        rec.onresult = e => {
          const transcript = e.results?.[0]?.[0]?.transcript || '';
          if (transcript) {
            const ta = document.getElementById('qlog-comment');
            ta.value = (ta.value ? ta.value + ' ' : '') + transcript;
            showToast('음성 코멘트가 입력되었어요');
          }
        };
        rec.onerror = () => showToast('음성 인식에 실패했어요');
        rec.onend = () => { voiceBtn.textContent = '🎙️ 음성 입력'; };
        rec.start();
      });

      document.getElementById('btn-publish-qlog').addEventListener('click', async () => {
        const msg = document.getElementById('qlog-comment').value.trim();
        const updatedRoutines = draftRoutines.map(r => {
          const sCount = Math.max(1, Number(r.sets) || 4);
          return { ...r, completedSets: Array(sCount).fill(true) };
        });

        ctx.record.headerMessage = msg;
        ctx.record.routines = updatedRoutines;
        ctx.record.feedback = { ...(ctx.record.feedback || {}), workout: msg, time: nowTimeHHMM() };

        if (memberName === state.memberName) {
          state.record.headerMessage = msg;
          state.record.routines = updatedRoutines;
          state.record.feedback.workout = msg;
        }
        const ovItem = state.trainerOverview.find(m => m.name === memberName);
        if (ovItem) {
          ovItem.pendingWorkout = false;
          ovItem.feedbackDone = true;
          ovItem.activeToday = true;
          ovItem.lastDate = state.selectedDate;
        }

        closeModal();
        triggerConfetti();
        showToast(`${memberName} 회원님 수업일지가 발행·저장되었어요!`);
        renderAll();
        await saveFullRecordLive(memberName, state.selectedDate, ctx.record);
      });
    }

        ];
        return `
          <div class="space-y-3.5 animate-in">
            <section class="card-teal rounded-[26px] p-5 text-white">
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-white/15">식단 원터치 답장</span>
              <h1 class="text-[20px] font-extrabold mt-2">식단 피드백 대기 ${pendingDietList.length}명</h1>
              <p class="text-[12px] text-white/85 mt-1">프리셋 버튼이나 한줄 코멘트로 즉시 feedback.diet를 패치 저장합니다.</p>
            </section>

            <div class="space-y-3">
              ${targets.map((m, idx) => `
                <div class="bg-white rounded-[22px] p-4 shadow-sm space-y-3">
                  <div class="flex items-center justify-between">
                    <div>
                      <span class="text-[15px] font-extrabold text-[#111827]">${escapeHtml(m.name)} 회원님</span>
                      <span class="ml-1.5 text-[11px] font-bold text-[#0F766E]">주 ${m.weeklyDietDays || 1}일 식단 기록</span>
                    </div>
                    <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${m.pendingDiet ? 'bg-amber-50 text-amber-700' : 'bg-[#F0FDFA] text-[#0F766E]'}">${m.pendingDiet ? '답장 대기' : '답장 완료'}</span>
                  </div>
                  <div class="flex flex-wrap gap-1.5">
                    ${quickReplies.map((qr, qidx) => `
                      <button type="button" data-mname="${escapeHtml(m.name)}" data-reply="${escapeHtml(qr)}" class="btn-diet-preset tap-scale px-2.5 py-1.5 rounded-xl bg-[#F0FDFA] text-[#0F766E] text-[11px] font-bold text-left">
                        원터치 ${qidx + 1}: ${escapeHtml(qr.slice(0, 20))}…
                      </button>
                    `).join('')}
                  </div>
                  <div class="flex gap-2">
                    <input id="diet-reply-inp-${idx}" type="text" placeholder="${escapeHtml(m.name)} 회원님께 식단 피드백 입력" class="flex-1 text-[12px] px-3.5 py-2.5 rounded-xl bg-[#F4F6F9] focus:outline-none" />
                    <button type="button" data-mname="${escapeHtml(m.name)}" data-inp="diet-reply-inp-${idx}" class="btn-diet-send tap-scale px-3.5 py-2.5 rounded-xl hero-navy text-white text-[12px] font-extrabold shrink-0">저장</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      if (state.coachTab === 'dormant') {
        return `
          <div class="space-y-3.5 animate-in">
            <section class="hero-navy rounded-[26px] p-5 text-white">
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-white/15 text-[#FDE68A]">RETENTION CARE</span>
              <h1 class="text-[20px] font-extrabold mt-2">잠수 · 미출석 케어 대상 ${dormantList.length}명</h1>
              <p class="text-[12px] text-white/80 mt-1">최근 3일 이상 기록이 없거나 주간 운동이 0회인 회원에게 안부 메모를 발송하세요.</p>
            </section>

            <div class="space-y-2.5">
              ${dormantList.length ? dormantList.map(m => {
                const gap = m.lastDate ? daysBetween(m.lastDate, state.selectedDate) : 14;
                const careMsg = `${m.name} 회원님! 최근 ${gap}일 동안 기록이 비어 있어 컨디션이 괜찮으신지 안부 연락드려요. 오늘 가벼운 스트레칭이나 수분 섭취부터 함께 다시 시작해 볼까요? 😊`;
                return `
                  <div class="bg-white rounded-[22px] p-4 shadow-sm space-y-3">
                    <div class="flex items-center justify-between">
                      <div>
                        <span class="text-[15px] font-extrabold text-[#111827]">${escapeHtml(m.name)}</span>
                        <span class="ml-2 text-[11px] font-extrabold px-2 py-0.5 rounded-full bg-rose-50 text-rose-700">${gap}일 미기록</span>
                      </div>
                      <span class="text-[11px] text-[#6B7280]">최근: ${escapeHtml(m.lastDate || '없음')}</span>
                    </div>
                    <p class="text-[12px] text-[#4B5563] p-3 rounded-xl bg-[#F4F6F9] leading-relaxed">"${escapeHtml(careMsg)}"</p>
                    <div class="grid grid-cols-2 gap-2">
                      <button type="button" data-msg="${escapeHtml(careMsg)}" class="btn-copy-dormant tap-scale py-2.5 rounded-xl bg-[#F4F6F9] text-[#111827] text-[12px] font-bold">
                        📋 카톡 안부 복사
                      </button>
                      <button type="button" data-mname="${escapeHtml(m.name)}" data-msg="${escapeHtml(careMsg)}" class="btn-send-dormant tap-scale py-2.5 rounded-xl hero-navy text-white text-[12px] font-extrabold">
                        💬 앱 메모 즉시 발송
                      </button>
                    </div>
                  </div>
                `;
              }).join('') : '<div class="bg-white rounded-[22px] p-6 text-center text-[13px] text-[#6B7280]">현재 3일 이상 잠수 중인 회원이 없습니다 🎉</div>'}
            </div>
          </div>
        `;
      }

      const shown = state.coachTab === 'today' ? list.filter(m => m.activeToday || m.pendingWorkout || m.pendingDiet) : list;
      const finalShown = shown.length ? shown : list;

      return `
        <div class="space-y-3.5 animate-in">
          <section class="hero-navy rounded-[26px] p-5 text-white">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-white/15 text-[#5EEAD4]">${state.selectedDate} 코치 대시보드</span>
              <span class="text-[11px] font-bold text-white/80">칼럼 ${state.columns.length}편</span>
            </div>
            <h1 class="text-[21px] font-extrabold mt-2">전체 ${list.length}명 중<br/>피드백 대기 ${pendingTotal}건 · 잠수케어 ${dormantList.length}명</h1>
          </section>

          <div class="space-y-2.5">
            ${finalShown.length ? finalShown.map(renderCoachMemberCard).join('') : '<div class="bg-white rounded-[22px] p-6 text-center text-[13px] text-[#6B7280]">표시할 회원이 없습니다.</div>'}
          </div>
        </div>
      `;
    }

    function updateFabUI() {
      const menu = document.getElementById('fab-menu');
      const icon = document.getElementById('fab-icon');
      if (state.fabOpen) {
        menu.classList.remove('hidden');
        menu.classList.add('flex');
        icon.style.transform = 'rotate(45deg)';
      } else {
        menu.classList.add('hidden');
        menu.classList.remove('flex');
        icon.style.transform = 'rotate(0deg)';
      }
    }

    function renderAll() {
      renderHeader();
      renderBottomNav();
      document.getElementById('main-content').innerHTML = state.appMode === 'member' ? renderMemberView() : renderCoachView();
      updateFabUI();
      bindEvents();
    }

    async function sendCoachDietFeedback(memberName, replyText) {
      if (!replyText) return;
      const fb = { workout: state.record.feedback?.workout || '', diet: replyText, time: nowTimeHHMM() };
      if (memberName === state.memberName) {
        state.record.feedback = fb;
      }
      if (state.coachMemberCache[memberName]) {
        state.coachMemberCache[memberName].record.feedback = fb;
      }
      const ov = state.trainerOverview.find(m => m.name === memberName);
      if (ov) {
        ov.pendingDiet = false;
        ov.feedbackDone = true;
      }
      triggerConfetti();
      showToast(`${memberName} 회원님 식단 답장이 저장되었어요!`);
      renderAll();
      await savePatchLive({ feedback: fb }, memberName, state.selectedDate);
    }

    function bindEvents() {
      const vBtn = document.getElementById('btn-verify');
      if (vBtn) {
        vBtn.addEventListener('click', () => {
          const nextVal = state.record.dailyCheckin.workout === 'done' ? 'rest' : 'done';
          state.record.dailyCheckin.workout = nextVal;
          if (nextVal === 'done') {
            if (!state.workoutDays.includes(state.selectedDate)) state.workoutDays.push(state.selectedDate);
            triggerConfetti();
          }
          showToast(nextVal === 'done' ? '오늘 운동 인증 완료!' : '회복 상태로 변경했어요');
          renderAll();
          saveDailyCheckinLive({ ...state.record.dailyCheckin, workout: nextVal });
        });
      }

      const heroPrBtn = document.getElementById('btn-hero-pr');
      if (heroPrBtn) heroPrBtn.addEventListener('click', () => openPrShareModal(0));

      document.querySelectorAll('.pr-card-btn').forEach(b => {
        b.addEventListener('click', () => openPrShareModal(Number(b.dataset.prIdx) || 0));
      });

      document.querySelectorAll('.btn-form-tip').forEach(b => {
        b.addEventListener('click', () => openFormTipModal(b.dataset.tipEx));
      });

      const missionBtn = document.getElementById('btn-mission-toggle');
      if (missionBtn) {
        missionBtn.addEventListener('click', () => {
          const rs = state.record.routines || [];
          const target = rs.find(r => /숙제|개인|데드버그/.test(String(r.name || ''))) || rs[0];
          if (target) {
            const sCount = Math.max(1, Number(target.sets) || 3);
            const done = Array.isArray(target.completedSets) && target.completedSets.some(Boolean);
            target.completedSets = Array(sCount).fill(!done);
            if (!done) {
              if (!state.workoutDays.includes(state.selectedDate)) state.workoutDays.push(state.selectedDate);
              triggerConfetti();
              showToast('오늘 개인 미션 완료!');
            } else {
              showToast('개인 미션 체크를 해제했어요');
            }
            renderAll();
            saveFullRecordLive();
          }
        });
      }

      document.querySelectorAll('.chk-btn').forEach(b => {
        b.addEventListener('click', () => {
          const grp = b.dataset.grp;
          const val = b.dataset.val;
          state.record.dailyCheckin[grp] = val;
          if (grp === 'workout' && val === 'done' && !state.workoutDays.includes(state.selectedDate)) {
            state.workoutDays.push(state.selectedDate);
          }
          showToast('오늘 상태가 저장되었어요');
          renderAll();
          saveDailyCheckinLive({ ...state.record.dailyCheckin });
        });
      });

      document.querySelectorAll('.meal-btn').forEach(b => {
        b.addEventListener('click', () => openMealModal(b.dataset.mkey, b.dataset.mlabel));
      });

      document.querySelectorAll('.routine-toggle').forEach(b => {
        b.addEventListener('click', () => {
          const idx = Number(b.dataset.ridx);
          const r = state.record.routines[idx];
          if (!r) return;
          const setsCount = Math.max(1, Number(r.sets) || (Array.isArray(r.completedSets) ? r.completedSets.length : 3));
          const currentlyDone = Array.isArray(r.completedSets) && r.completedSets.some(Boolean);
          r.completedSets = Array(setsCount).fill(!currentlyDone);
          if (!currentlyDone) {
            if (!state.workoutDays.includes(state.selectedDate)) state.workoutDays.push(state.selectedDate);
            triggerConfetti();
          }
          renderAll();
          saveFullRecordLive();
        });
      });

      const rest60Btn = document.getElementById('btn-rest-60');
      if (rest60Btn) rest60Btn.addEventListener('click', () => startRestTimer(60));
      const rest90Btn = document.getElementById('btn-rest-90');
      if (rest90Btn) rest90Btn.addEventListener('click', () => startRestTimer(90));

      const addExBtn = document.getElementById('btn-add-custom-ex');
      if (addExBtn) addExBtn.addEventListener('click', openAddExerciseModal);

      const magBtn = document.getElementById('btn-open-magazine');
      if (magBtn) magBtn.addEventListener('click', () => openMagazineModal(0));

      const memoForm = document.getElementById('memo-form');
      if (memoForm) {
        memoForm.addEventListener('submit', e => {
          e.preventDefault();
          const inp = document.getElementById('memo-inp');
          const txt = inp.value.trim();
          if (!txt) return;
          const newMemo = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), from: 'member', text: txt, time: nowTimeHHMM() };
          state.record.memos.push(newMemo);
          inp.value = '';
          showToast('코치님께 메모를 전송했어요');
          renderAll();
          savePatchLive({ memos: state.record.memos });
        });
      }

      const goL = document.getElementById('go-lesson');
      if (goL) goL.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goL2 = document.getElementById('go-lesson-2');
      if (goL2) goL2.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goD = document.getElementById('go-diet');
      if (goD) goD.addEventListener('click', () => { state.memberTab = 'diet'; renderAll(); });
      const goD2 = document.getElementById('go-diet-2');
      if (goD2) goD2.addEventListener('click', () => { state.memberTab = 'diet'; renderAll(); });

      // Coach Actions
      document.querySelectorAll('.btn-coach-brief').forEach(b => {
        b.addEventListener('click', () => openCoachBriefingModal(b.dataset.mname));
      });
      document.querySelectorAll('.btn-coach-qlog').forEach(b => {
        b.addEventListener('click', () => openQuickLogPublishModal(b.dataset.mname));
      });
      document.querySelectorAll('.btn-diet-preset').forEach(b => {
        b.addEventListener('click', () => sendCoachDietFeedback(b.dataset.mname, b.dataset.reply));
      });
      document.querySelectorAll('.btn-diet-send').forEach(b => {
        b.addEventListener('click', () => {
          const inp = document.getElementById(b.dataset.inp);
          const val = inp ? inp.value.trim() : '';
          if (!val) {
            showToast('식단 답장 내용을 입력해 주세요');
            return;
          }
          sendCoachDietFeedback(b.dataset.mname, val);
        });
      });
      document.querySelectorAll('.btn-copy-dormant').forEach(b => {
        b.addEventListener('click', () => copyTextToClipboard(b.dataset.msg, '잠수케어 안부 메시지가 복사되었어요!'));
      });
      document.querySelectorAll('.btn-send-dormant').forEach(b => {
        b.addEventListener('click', async () => {
          const mname = b.dataset.mname;
          const msg = b.dataset.msg;
          const ctx = await fetchMemberContextForCoach(mname);
          const memoItem = { id: Date.now() + '-care', from: 'trainer', text: msg, time: nowTimeHHMM() };
          ctx.record.memos.push(memoItem);
          if (mname === state.memberName) state.record.memos.push(memoItem);
          const ov = state.trainerOverview.find(m => m.name === mname);
          if (ov) ov.lastDate = state.selectedDate;
          showToast(`${mname} 회원님께 안부 메모를 발송했어요!`);
          renderAll();
          await savePatchLive({ memos: ctx.record.memos }, mname, state.selectedDate);
        });
      });
    }

    // FAB listeners
    document.getElementById('fab-toggle').addEventListener('click', () => { state.fabOpen = !state.fabOpen; updateFabUI(); });
    document.getElementById('fab-diet').addEventListener('click', () => {
      state.fabOpen = false;
      updateFabUI();
      openMealModal('lunch', '점심');
    });
    document.getElementById('fab-water').addEventListener('click', () => {
      state.fabOpen = false;
      state.record.diet.water = (Number(state.record.diet.water) || 0) + 500;
      showToast(`물 500ml 추가됨 (총 ${(state.record.diet.water / 1000).toFixed(1)}L)`);
      renderAll();
      savePatchLive({ diet: { water: state.record.diet.water } });
    });
    document.getElementById('fab-memo').addEventListener('click', () => {
      state.fabOpen = false;
      state.memberTab = 'feedback';
      renderAll();
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    // Privacy Consent listener
    document.getElementById('btn-consent-agree').addEventListener('click', () => {
      try {
        localStorage.setItem('fit_connect_privacy_consent_v2', 'agreed');
      } catch {}
      const el = document.getElementById('consent-backdrop');
      el.classList.add('hidden');
      el.classList.remove('flex');
      showToast('개인정보 수집 및 활용에 동의하셨습니다');
    });

    initLiveMemberData();
  </script>
</body>
</html>
