<!DOCTYPE html>

  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #E2E6EE;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hero-navy {
      background:
        radial-gradient(circle at 88% 18%, rgba(56, 189, 248, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 12% 90%, rgba(20, 184, 166, 0.18) 0%, transparent 40%),
        linear-gradient(135deg, #0B132B 0%, #1E3A8A 58%, #2563EB 100%);
    }
    .card-blue { background: linear-gradient(145deg, #1D4ED8 0%, #3B82F6 100%); }
    .card-teal { background: linear-gradient(145deg, #0F766E 0%, #14B8A6 100%); }
    .tap-scale { transition: transform 0.13s ease, background-color 0.16s ease, box-shadow 0.16s ease; }
    .tap-scale:active { transform: scale(0.975); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .confetti-dot {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      animation: confettiFall 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4); }
    }
    .skeleton {
      background: linear-gradient(90deg, #E5E7EB 25%, #F3F4F6 50%, #E5E7EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>

  <script>
    // --- Date & Clipboard Helpers ---
    function getTodayKST() {
      const now = new Date();
      return new Date(now.getTime() + 9 * 3600000).toISOString().slice(0, 10);
    }
    function shiftDateStr(dateStr, offset) {
      const d = new Date(dateStr + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + offset);
      return d.toISOString().slice(0, 10);
    }
    function daysBetween(olderStr, newerStr) {
      if (!olderStr) return 99;
      const a = new Date(olderStr + 'T00:00:00Z').getTime();
      const b = new Date(newerStr + 'T00:00:00Z').getTime();
      return Math.floor((b - a) / 86400000);
    }
    function nowTimeHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function formatMMSS(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }
    function buildWeekDays(anchorDate) {
      const d = new Date(anchorDate + 'T00:00:00Z');
      const sun = shiftDateStr(anchorDate, -d.getUTCDay());
      const labels = ['일', '월', '화', '수', '목', '금', '토'];
      return labels.map((day, i) => {
        const full = shiftDateStr(sun, i);
        return { day, date: Number(full.slice(8, 10)), fullDate: full };
      });
    }
    function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const DAILY_COACH_TIPS = [
      '[운동] 중량을 올리는 것보다 내려놓는(신장성) 3초를 통제할 때 근섬유 자극이 가장 선명하게 들어갑니다.',
      '[운동] 코어 복압을 먼저 채우고 움직이면 허리 개입은 줄고 목표 부위 가동범위가 훨씬 안정적으로 나옵니다.',
      '[운동] 하체 루틴 시 엄지·새끼발가락·뒤꿈치 3점 지지를 유지하면 무릎 흔들림 없이 고관절에 정확히 실립니다.',
      '[운동] 마지막 2회가 살짝 버겁지만 폼이 무너지지 않는 강도(RIR 2)가 오늘 가장 이상적인 자극입니다.',
      '[다이어트] 식사 전 물 한 컵과 채소부터 먼저 드시면 혈당 스파이크가 완만해져 포만감이 오래 유지됩니다.',
      '[다이어트] 전날 짠 음식을 드셨다면 끼니를 굶지 말고 수분 2L와 채소 섭취로 나트륨 배출을 도와주세요.',
      '[다이어트] 단백질은 한 끼에 몰아먹기보다 3~4끼에 나누어 섭취해야 근합성과 포만감을 하루 종일 유지할 수 있습니다.',
      '[일상] 식후 10~15분 가벼운 산책만으로도 혈당이 근육으로 빠르게 쓰여 체지방 축적을 크게 줄여줍니다.',
      '[일상] 수면이 6시간 미만이면 식욕 호르몬(그렐린)이 올라가 가짜 허기가 생깁니다. 오늘은 30분 일찍 주무셔보세요.',
      '[일상] 오래 앉아 있는 날엔 1시간마다 기지개와 흉추 스트레칭으로 굳은 어깨를 풀어줘야 운동 시 부상 위험이 줄어듭니다.'
    ];

    // Date-based weekday messaging: the same selected date always shows
    // the same coaching focus, including when browsing past/future dates.
    const WEEKDAY_WORKOUT_NOTES = [
      { day: '일요일', theme: '회복과 준비', note: '오늘은 충분히 회복하고 다음 주 운동을 준비해요. 가벼운 산책과 수면 리듬부터 챙겨주세요.' },
      { day: '월요일', theme: '한 주의 시작', note: '이번 주 목표를 하나 정해보세요. 무게보다 정확한 자세와 일정한 운동 습관이 우선이에요.' },
      { day: '화요일', theme: '움직임의 기본', note: '운동 전 호흡과 코어 안정성을 점검해요. 발의 지지와 고관절 움직임까지 연결해 보세요.' },
      { day: '수요일', theme: '꾸준함 점검', note: '벌써 주중이에요! 운동 기록을 살펴보고, 무리한 증량보다 정확한 반복에 집중해 보세요.' },
      { day: '목요일', theme: '균형 있는 운동', note: '좌우 움직임의 차이를 확인해요. 천천히 움직이며 목표 근육에 힘이 전달되는지 느껴보세요.' },
      { day: '금요일', theme: '한 주 돌아보기', note: '이번 주 잘된 운동 한 가지를 기록해요. 작은 개선도 다음 주 변화를 만드는 중요한 기준이에요.' },
      { day: '토요일', theme: '활동과 컨디션', note: '주말에는 몸 상태에 맞춰 움직여요. 피곤하면 강도를 낮추고 가볍게 활동하며 회복하세요.' }
    ];
    function getWeekdayWorkoutNote(dateStr) {
      const d = new Date(String(dateStr || getTodayKST()) + 'T00:00:00Z');
      return WEEKDAY_WORKOUT_NOTES[Number.isNaN(d.getTime()) ? 0 : d.getUTCDay()];
    }
    function getDailyCoachTip(dateStr) {
      return getWeekdayWorkoutNote(dateStr).note;
    }

    // Client-side Image Compression (fits Google Sheets 50k cell limit safely)
    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const encodeAt = (maxW, q) => {
              const scale = img.width > maxW ? maxW / img.width : 1;
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
              return canvas.toDataURL('image/jpeg', q);
            };
            let out = encodeAt(400, 0.5);
            if (out.length > 18000) out = encodeAt(320, 0.42);
            if (out.length > 22000) out = encodeAt(260, 0.35);
            resolve(out);
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function compressAndWatermarkPhoto(file, memberName) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxW = 900;
            const scale = img.width > maxW ? maxW / img.width : 1;
            const w = Math.round(img.width * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            // Timestamp watermark bar at bottom
            const barH = Math.max(44, Math.round(h * 0.085));
            ctx.fillStyle = 'rgba(11, 19, 43, 0.72)';
            ctx.fillRect(0, h - barH, w, barH);
            ctx.fillStyle = '#5EEAD4';
            ctx.font = `800 ${Math.max(13, Math.round(barH * 0.36))}px Pretendard, sans-serif`;
            ctx.fillText('FIT-CONNECT VERIFIED', 16, h - Math.round(barH * 0.34));
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `700 ${Math.max(13, Math.round(barH * 0.34))}px Pretendard, sans-serif`;
            const stamp = `${memberName} · ${getTodayKST()} ${nowTimeHHMM()}`;
            const tw = ctx.measureText(stamp).width;
            ctx.fillText(stamp, Math.max(16, w - tw - 16), h - Math.round(barH * 0.34));

            resolve(canvas.toDataURL('image/jpeg', 0.74));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Web Audio API Beep for Timer End
    function playTimerBeep() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        [0, 0.22, 0.44].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.16, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + 0.17);
        });
      } catch {}
    }

    function playTempoTone(freq, dur) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.14, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur + 0.02);
      } catch {}
    }

    function computeTodayVolumeFun() {
      const rs = state.record.routines || [];
      let totalKg = 0;
      rs.forEach(r => {
        const isPt = r.routineType !== 'homework';
        if (Array.isArray(r.setDetails) && r.setDetails.length) {
          r.setDetails.forEach((sd, idx) => {
            const isDone = isPt || (Array.isArray(r.completedSets) ? Boolean(r.completedSets[idx]) : false);
            if (isDone) totalKg += (Number(sd.weight) || 0) * (Number(sd.reps) || 10);
          });
        } else {
          const w = Number(r.weight) || 0;
          const reps = Number(r.reps) || 10;
          const totalSets = Math.max(1, Number(r.sets) || 1);
          const doneSets = isPt ? totalSets : (Array.isArray(r.completedSets) ? r.completedSets.filter(Boolean).length : 0);
          if (w > 0 && doneSets > 0) totalKg += w * reps * doneSets;
        }
      });

    // --- API Helpers ---
    async function postRecords(payload) {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timeoutMs = (payload?.action === 'directVideoBegin' || payload?.action === 'directVideoFinish' || payload?.action === 'memberSession') ? 25000 : 12000;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), timeoutMs) : null;
      try {
        const res = await fetch('/api/records', {
          method: 'POST',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          ...(ctrl ? { signal: ctrl.signal } : {})
        });
        if (!res.ok) {
          let errCode = '';
          try {
            const rawTxt = await res.text();
            try {
              const j = JSON.parse(rawTxt);
              errCode = j?.code || j?.error || j?.message || rawTxt.slice(0, 80);
            } catch {
              errCode = rawTxt.slice(0, 80);
            }
          } catch {}
          const e = new Error('records_' + res.status + (errCode ? ' (' + errCode + ')' : ''));
          e.status = res.status;
          e.code = errCode;
          throw e;
        }
        return res.json();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    function extractPhotoSrc(meal) {
      if (!meal || typeof meal !== 'object') return '';
      const raw = (Array.isArray(meal.photos) && meal.photos[0]) || meal.photo || '';
      if (typeof raw === 'string') return raw;
      if (raw && typeof raw === 'object') return raw.url || raw.src || raw.data || '';
      return '';
    }

    function mergeDietRecords(primaryDiet, secondaryDiet, deletedPhotoMeals = []) {
      const p = (primaryDiet && typeof primaryDiet === 'object') ? primaryDiet : {};
      const s = (secondaryDiet && typeof secondaryDiet === 'object') ? secondaryDiet : {};
      const out = { ...s, ...p };
      ['breakfast', 'lunch', 'dinner', 'snack'].forEach(k => {
        const pm = p[k] || {};
        const sm = s[k] || {};
        const pPhoto = extractPhotoSrc(pm);
        const sPhoto = extractPhotoSrc(sm);
        const mergedMeal = { ...sm, ...pm };
        if (!pPhoto && sPhoto) mergedMeal.photos = [sPhoto];
        else if (pPhoto) mergedMeal.photos = [pPhoto];
        if (deletedPhotoMeals.includes(k)) {
          mergedMeal.photos = [];
          mergedMeal.photo = '';
        }
        if (Object.keys(mergedMeal).length) out[k] = mergedMeal;
      });
      out.water = Math.max(Number(p.water) || 0, Number(s.water) || 0);
      return out;
    }

      if (!res || typeof res !== 'object') return {};
      if (res.data && typeof res.data === 'object' && !Array.isArray(res.data)) return res.data;

      return res;

    function makeUuidV4() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') return window.crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }

    function normalizeVideoMime(file) {
      const t = String(file?.type || '').toLowerCase();
      if (t === 'video/mp4' || t === 'video/webm' || t === 'video/quicktime' || t === 'image/jpeg' || t === 'image/png' || t === 'image/webp') return t;
      const n = String(file?.name || '').toLowerCase();
      if (n.endsWith('.jpg') || n.endsWith('.jpeg')) return 'image/jpeg';
      if (n.endsWith('.png')) return 'image/png';
      if (n.endsWith('.webp')) return 'image/webp';
      if (n.endsWith('.mov')) return 'video/quicktime';
      if (n.endsWith('.webm')) return 'video/webm';
      return 'video/mp4';
    }

    function dataUrlToFile(dataUrl, filename) {
      const parts = String(dataUrl || '').split(',');
      const mimeMatch = (parts[0] || '').match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
      const bin = atob(parts[1] || '');
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new File([arr], filename || 'diet-photo.jpg', { type: mime });
    }

    }

    function xhrPutFile(url, body, headers, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', url, true);
        Object.entries(headers || {}).forEach(([k, v]) => xhr.setRequestHeader(k, v));
        if (xhr.upload && typeof onProgress === 'function') {
          xhr.upload.onprogress = e => {
            if (e.lengthComputable && e.total > 0) {
              onProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)), e.loaded, e.total);
            }
          };
        }
        xhr.onload = () => resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, text: xhr.responseText || '' });
        xhr.onerror = () => reject(new Error('네트워크 연결이 불안정합니다'));
        xhr.ontimeout = () => reject(new Error('업로드 시간이 초과되었습니다'));
        xhr.timeout = 180000;
        xhr.send(body);
      });
    }

    async function uploadDirectVideoFile(file, memberName, memberToken, questionText, onProgress) {
      if (!file) throw new Error('no_file');
      if (file.size > 50000000) throw new Error('50MB 이하 영상만 업로드할 수 있어요');
      let activeToken = memberToken || '';
      let activeSession = (memberName === state.memberName && state.session) ? state.session : '';
      const hasTrainerPw = !!state.trainerPassword;
      if (!hasTrainerPw && !activeToken && !activeSession) throw new Error('회원 전용 토큰이 필요해요');
      const mime = normalizeVideoMime(file);
      const id = makeUuidV4();
      const baseBegin = {
        action: 'directVideoBegin',
        member: memberName,
        date: state.selectedDate,
        id,
        name: (file.name || 'workout-video.mp4').slice(0, 150),
        question: String(questionText || '').slice(0, 1000),
        mime,
        size: file.size
      };
      const authPayload = () => hasTrainerPw
        ? { password: state.trainerPassword }
        : (activeSession ? { session: activeSession } : { token: activeToken });
      let begin;
      try {
        begin = await postRecords({ ...baseBegin, ...authPayload() });
      } catch (err) {
        if (!hasTrainerPw && (err?.status === 403 || String(err?.message || '').includes('records_403'))) {
          let diag = err?.code || '403';
          if (activeToken) {
            try {
              const sr = await postRecords({ action: 'memberSession', member: memberName, date: state.selectedDate, token: activeToken });
              if (sr?.status === 'success' && sr.session) activeSession = sr.session;
            } catch (se) {
              diag += '/sess:' + (se?.code || se?.status || 'fail');
            }
          }
          try {
            begin = await postRecords({ ...baseBegin, ...authPayload() });
          } catch (retryErr) {
            if (retryErr?.status === 403 || String(retryErr?.message || '').includes('records_403')) {
              throw new Error('토큰 인증 실패(403: ' + (retryErr?.code || diag) + ')');
            }
            throw retryErr;
          }
        } else {
          throw err;
        }
      }
      if (begin?.status !== 'success') {
        throw new Error(begin?.code || begin?.message || '업로드 시작 실패');
      }
      if (!begin.alreadyReady && begin.url) {
        let putRes = await xhrPutFile(begin.url, file, { 'Content-Type': mime, 'x-upsert': 'true' }, onProgress);
        if (!putRes.ok && (putRes.status === 400 || putRes.status === 415)) {
          const fd = new FormData();
          fd.append('cacheControl', '3600');
          fd.append('', file);
          putRes = await xhrPutFile(begin.url, fd, {}, onProgress);
        }
        if (!putRes.ok) {
          const errTxt = String(putRes.text || '').slice(0, 60);
          throw new Error('영상 전송 실패 (' + putRes.status + (errTxt ? ': ' + errTxt : '') + ')');
        }
      }
      const fin = await postRecords({
        action: 'directVideoFinish',
        member: memberName,
        date: state.selectedDate,
        ...authPayload(),
        id
      });
      if (fin?.status !== 'success') throw new Error(fin?.code || '업로드 마무리 실패');
      return 'direct:' + id;
    }

    function syncExerciseLibrary(dateStr) {
      const lib = { ...(state.exerciseLibrary || {}) };
      const hidden = getHiddenExerciseKeys(state.memberName);
      const norm = n => String(n || '').trim().toLowerCase().replace(/\s+/g, '');
      (state.record?.routines || []).forEach(r => {
        const name = String(r.name || '').trim();
        const key = norm(name);
        if (!key || hidden.has(key)) return;
        const prev = lib[key] || { name };
        const w = Number(r.weight) || 0;
        const maxSetW = Array.isArray(r.setDetails) && r.setDetails.length
          ? Math.max(...r.setDetails.map(sd => Number(sd.weight) || 0))
          : w;
        const bestW = Math.max(Number(prev.bestWeight) || 0, maxSetW);
        lib[key] = {
          name,
          lastWeight: maxSetW > 0 ? String(maxSetW) : (prev.lastWeight || ''),
          lastReps: String(r.reps || prev.lastReps || ''),
          lastDate: dateStr >= (prev.lastDate || '') ? dateStr : prev.lastDate,
          bestWeight: bestW > 0 ? String(bestW) : '',
          note: String(r.note || '').trim() || prev.note || '',
          videoUrl: String(r.videoUrl || '').trim() || prev.videoUrl || '',
          videoId: String(r.videoId || r.demoKey || '').trim() || prev.videoId || ''
        };
      });
      (state.insights?.progress || []).forEach(p => {
        const name = String(p.name || '').trim();
        const key = norm(name);
        if (!key || hidden.has(key) || !Array.isArray(p.points) || !p.points.length) return;
        const latestPt = p.points[p.points.length - 1];
        const maxPtW = Math.max(...p.points.map(pt => Number(pt.weight) || 0));
        const prev = lib[key] || { name };
        lib[key] = {
          ...prev,
          name,
          lastWeight: latestPt.weight ? String(latestPt.weight) : (prev.lastWeight || ''),
          lastReps: latestPt.reps ? String(latestPt.reps) : (prev.lastReps || ''),
          lastDate: latestPt.date >= (prev.lastDate || '') ? latestPt.date : prev.lastDate,
          bestWeight: Math.max(Number(prev.bestWeight) || 0, maxPtW) > 0 ? String(Math.max(Number(prev.bestWeight) || 0, maxPtW)) : ''
        };
      });
      const currentNames = new Set((state.record?.routines || []).map(r => norm(r.name)).filter(Boolean));
      const progressNames = new Set((state.insights?.progress || []).map(p => norm(p.name)).filter(Boolean));
      Object.keys(lib).forEach(k => {
        if (lib[k]?.lastDate === dateStr && !currentNames.has(k) && !progressNames.has(k)) {
          delete lib[k];
        }
      });
      state.exerciseLibrary = lib;
      try { localStorage.setItem(`fit_ex_lib_v2_${state.memberName}`, JSON.stringify(lib)); } catch {}
    }

    function saveCachedMemberData(dateStr) {

          record: state.record,
          insights: state.insights,
          columns: state.columns,
          workoutDays: state.workoutDays

    async function initLiveMemberData() {

          const map = JSON.parse(localStorage.getItem('fit_member_tokens_v2') || '{}');
          map[state.memberName] = state.token;

        const sessRes = await postRecords({
          action: 'memberSession',

    async function loadMemberDateData(dateStr, prefetchedAppsRead) {
      if (!state.isLive) return;
      const requestedMember = state.memberName;
      const auth = state.session ? { session: state.session } : (state.token ? { token: state.token } : { password: state.trainerPassword });
      const month = dateStr.slice(0, 7);
      const stillCurrent = () => state.isLive && state.memberName === requestedMember && state.selectedDate === dateStr;

      // Start the non-essential work in parallel, but don't block the first
      // useful member screen on analytics, articles, history and video lists.
      const secondaryPromise = Promise.allSettled([
        postRecords({ action: 'memberInsights', member: requestedMember, date: dateStr, ...auth }),
        postRecords({ action: 'columnList', member: requestedMember, date: dateStr, ...auth }),
        postRecords({ action: 'workoutHistory', member: requestedMember, date: dateStr, month, ...auth }),
        postRecords({ action: 'directVideoList', member: requestedMember, date: dateStr, ...auth })
      ]);
      const [dailyRec, dailyAs] = await Promise.allSettled([
        postRecords({ action: 'read', member: requestedMember, date: dateStr, ...auth }),
        prefetchedAppsRead || postAppsScript({ action: 'read', member: requestedMember, date: dateStr, ...(state.token ? { token: state.token } : { password: state.trainerPassword }) })
      ]);
      if (!stillCurrent()) return;

      const recObj = dailyRec.status === 'fulfilled' ? unwrapDailyRecord(dailyRec.value) : null;
      const asObj = dailyAs.status === 'fulfilled' ? unwrapDailyRecord(dailyAs.value) : null;
      const asHasData = asObj && (asObj.routines || asObj.headerMessage || asObj.diet || asObj.memos);
      const baseLoadDaily = asHasData ? asObj : (recObj || asObj);
      const chosenDaily = (baseLoadDaily && typeof baseLoadDaily === 'object')
        ? {
            ...baseLoadDaily,
            diet: mergeDietRecords(asObj?.diet, recObj?.diet, recObj?.deletedPhotoMeals || []),
            ...(recObj?.coachFeedbackStored
              ? { headerMessage: recObj.headerMessage, feedback: recObj.feedback }
              : {})
          }
        : baseLoadDaily;

      if (chosenDaily && typeof chosenDaily === 'object') {
        const d = chosenDaily;
        state.record = {
          headerMessage: d.headerMessage || '',
          routines: Array.isArray(d.routines) ? d.routines : [],
          reflection: d.reflection || { good: '', bad: '' },
          diet: {
            breakfast: d.diet?.breakfast || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            lunch: d.diet?.lunch || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            dinner: d.diet?.dinner || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            snack: d.diet?.snack || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            water: Number(d.diet?.water) || 0
          },
          feedback: d.feedback || { workout: '', diet: '', time: '' },
          memos: Array.isArray(d.memos) ? d.memos : [],
          dailyCheckin: d.dailyCheckin || { workout: '', diet: '', mood: '' },
          ptScheduled: Boolean(d.ptScheduled),
          ptTime: String(d.ptTime || '')
        };
      }
      syncExerciseLibrary(dateStr);

      // Follow-up data refreshes the already visible screen only when the
      // same member/date is still selected. Never overwrite a newer day.
      secondaryPromise.then(([ins, cols, hist, dVid]) => {
        if (!stillCurrent()) return;
        if (ins.status === 'fulfilled' && ins.value?.status === 'success') state.insights = ins.value;
        if (cols.status === 'fulfilled' && cols.value?.status === 'success' && Array.isArray(cols.value.columns) && cols.value.columns.length) {
          state.columns = cols.value.columns;
        }
        if (hist.status === 'fulfilled' && hist.value?.status === 'success' && Array.isArray(hist.value.days)) {
          state.workoutDays = hist.value.days;
        }
        if (dVid.status === 'fulfilled' && dVid.value?.status === 'success' && Array.isArray(dVid.value.videos)) {
          state.directVideos = dVid.value.videos;
        }
        syncExerciseLibrary(dateStr);
        saveCachedMemberData(dateStr);
        // Keep input focus / user-initiated interactions stable where possible.
        if (!document.querySelector('input:focus, textarea:focus, select:focus') && !document.getElementById('modal-backdrop')?.classList.contains('flex')) {
          renderAll();
        }
        prefetchRoutineVideos(state.record.routines, auth);
      }).catch(() => {});
    }

    const videoPlayUrlCache = new Map();
    async function resolvePlayableVideoUrl(videoId, authOverride, memberOverride) {
      if (!videoId) return '';
      const cached = videoPlayUrlCache.get(videoId);
      if (cached && (Date.now() - cached.ts < 240000)) return cached.url;
      const targetMember = memberOverride || state.memberName;
      const auth = authOverride || (state.session ? { session: state.session } : (state.token ? { token: state.token } : { password: state.trainerPassword }));
      const isDirect = String(videoId).startsWith('direct:');
      const vRes = isDirect
        ? await postRecords({ action: 'directVideoPlay', id: videoId, member: targetMember, date: state.selectedDate, ...auth })
        : await postRecords({ action: 'videoPlaybackUrl', fileId: videoId, videoId, member: targetMember, date: state.selectedDate, ...auth });
      const playUrl = vRes?.url || vRes?.playbackUrl || vRes?.data?.url || '';
      if (playUrl) videoPlayUrlCache.set(videoId, { url: playUrl, ts: Date.now() });
      return playUrl;
    }

    function prefetchRoutineVideos(routines, auth) {
      if (!state.isLive || !Array.isArray(routines)) return;
      const ids = [...new Set(routines.map(r => r?.videoId).filter(Boolean))];
      ids.slice(0, 6).forEach(vid => {
        resolvePlayableVideoUrl(vid, auth).catch(() => {});
      });
    }

    async function saveFullRecordLive(targetMember, fullData) {
      if (!state.isLive) {
        showToast('미리보기 모드라 저장되지 않았어요. 전용 링크로 접속해 주세요!');

      }

      try {

        });

    // Serialized workout saves: capture the member/date at edit time. Rapid
    // taps are coalesced and no older request can finish AFTER the latest one.
    const workoutSaveJobs = new Map();
    function workoutSaveKey(member,date){return JSON.stringify([member,date]);}
    function workoutStatus() {
      return workoutSaveJobs.get(workoutSaveKey(state.memberName,state.selectedDate))?.status || '';
    }
    function updateWorkoutSaveLabel() {
      const el=document.getElementById('workout-save-status');
      if(!el)return;
      const status=workoutStatus();
      el.textContent=status==='failed'?'저장 실패 · 다시 시도':status==='saving'?'저장 중…':status==='queued'?'변경사항 저장 준비 중…':status==='saved'?'저장 완료 ✓':'세트를 누르면 자동 저장돼요';
      el.classList.toggle('text-red-700',status==='failed');
      el.classList.toggle('text-[#475569]',status!=='failed');
      const retry=document.getElementById('workout-save-retry');
      if(retry)retry.classList.toggle('hidden',status!=='failed');
    }
    function enqueueWorkoutSave() {
      if(!state.isLive){showToast('미리보기에서는 운동 기록이 저장되지 않아요');return;}
      const member=state.memberName,date=state.selectedDate,key=workoutSaveKey(member,date);
      let job=workoutSaveJobs.get(key);
      if(!job){job={member,date,key,token:state.token,password:state.trainerPassword,version:0,status:'',timer:null,pending:null,processing:false};workoutSaveJobs.set(key,job);}
      job.version++;
      // Keep a dated, immutable routines-only snapshot. Never replace the
      // whole day while saving a set: diet/photos and coach notes are separate.
      job.pending=JSON.parse(JSON.stringify(state.record.routines||[]));
      job.status='queued';
      if(job.timer)clearTimeout(job.timer);
      job.timer=setTimeout(()=>{job.timer=null;flushWorkoutSave(job);},420);
      updateWorkoutSaveLabel();
    }
    async function flushWorkoutSave(job) {
      if(job.processing||!job.pending)return;
      job.processing=true;
      try{
        while(job.pending){
          const snapshot=job.pending;
          job.pending=null;
          job.status='saving';updateWorkoutSaveLabel();
          const auth={member:job.member,date:job.date,token:job.token||'',...(job.password?{password:job.password}:{})};
          try{
            // Patch only routines. Never fall back to writing the whole day:
            // doing so could overwrite a meal/photo saved during workout.
            const result=await postAppsScript({...auth,action:'patchData',patch:{routines:snapshot}});
            if(result?.status!=='success')throw Error(result?.message||result?.error||'운동 세트 저장 실패');
            markJustSaved(job.member,job.date);
            if(!job.pending){job.status='saved';updateWorkoutSaveLabel();}
          } catch(err){
            // Do not roll back later taps or claim unsaved edits succeeded.
            if(!job.pending)job.pending=snapshot;
            job.status='failed';
            updateWorkoutSaveLabel();
            showToast('운동 저장 실패 · 다시 시도 버튼을 눌러주세요');
            return;
          }
        }
      } finally {job.processing=false;updateWorkoutSaveLabel();}
    }
    function retryWorkoutSave() {
      const job=workoutSaveJobs.get(workoutSaveKey(state.memberName,state.selectedDate));
      if(job){if(job.timer)clearTimeout(job.timer);job.timer=null;flushWorkoutSave(job);}
    }
    // Flush a pending set edit when switching tabs/apps; avoid leaving a
    // debounce timer idle during an iPhone background transition.
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='hidden'){
        workoutSaveJobs.forEach(job=>{
          if(job.timer){clearTimeout(job.timer);job.timer=null;}
          if(job.pending)flushWorkoutSave(job);
        });
      }
    });

    function triggerConfetti() {

    // --- Custom Timer Engine & Floating Bar ---
    function getConfiguredTimerSeconds() {
      const total = (Number(state.timer.customMin) || 0) * 60 + (Number(state.timer.customSec) || 0);
      return Math.max(5, total);
    }

    function updateFloatingTimerUI() {
      const bar = document.getElementById('floating-timer-bar');
      const fabWrap = document.getElementById('member-fab-wrap');
      if (!bar) return;
      if (state.appMode !== 'member' || state.timer.remaining <= 0) {
        bar.classList.add('hidden');
        if (fabWrap) { fabWrap.classList.remove('bottom-[138px]'); fabWrap.classList.add('bottom-20'); }
        return;
      }
      bar.classList.remove('hidden');
      if (fabWrap) { fabWrap.classList.remove('bottom-20'); fabWrap.classList.add('bottom-[138px]'); }
      document.getElementById('ft-time').textContent = formatMMSS(state.timer.remaining);
      document.getElementById('ft-sub').textContent = `휴식 타이머 · ${state.timer.setsDone}세트 완료`;
      document.getElementById('ft-toggle').textContent = state.timer.running ? '일시정지' : '재개';
    }

    function startTimerCountdown(sec) {
      if (state.timer.interval) {
        clearInterval(state.timer.interval);
        state.timer.interval = null;
      }
      const targetSec = typeof sec === 'number' ? Math.max(5, sec) : getConfiguredTimerSeconds();
      state.timer.total = targetSec;
      state.timer.remaining = targetSec;
      state.timer.running = true;
      runTimerTick();
      updateFloatingTimerUI();
      const badge = document.getElementById('rest-timer-badge');
      if (badge) badge.textContent = `⏱ ${formatMMSS(state.timer.remaining)}`;
    }

    function runTimerTick() {
      if (state.timer.interval) clearInterval(state.timer.interval);
      state.timer.interval = setInterval(() => {
        if (!state.timer.running) return;
        state.timer.remaining -= 1;
        if (state.timer.remaining <= 0) {
          clearInterval(state.timer.interval);
          state.timer.interval = null;
          state.timer.remaining = 0;
          state.timer.running = false;
          if (state.timer.soundOn) playTimerBeep();
          if (state.timer.vibrateOn && navigator.vibrate) {
            try { navigator.vibrate([180, 90, 180]); } catch {}
          }
          showToast('휴식 완료! 다음 세트 시작해볼까요? 💪');
          triggerConfetti();
        }
        updateFloatingTimerUI();
        const badge = document.getElementById('rest-timer-badge');
        if (badge) badge.textContent = state.timer.remaining > 0 ? `⏱ ${formatMMSS(state.timer.remaining)}` : '⏱ 타이머';
        const modalTime = document.getElementById('tm-live-display');
        if (modalTime) modalTime.textContent = formatMMSS(state.timer.remaining > 0 ? state.timer.remaining : getConfiguredTimerSeconds());
      }, 1000);
    }

    function stopTimer() {
      if (state.timer.interval) {
        clearInterval(state.timer.interval);
        state.timer.interval = null;
      }
      state.timer.running = false;
      state.timer.remaining = 0;
      updateFloatingTimerUI();
      const badge = document.getElementById('rest-timer-badge');
      if (badge) badge.textContent = '⏱ 타이머';
    }

            renderTimerModalBody();
          });
        });

        if (timerTab === 'rest') {
          document.querySelectorAll('.tm-preset-btn').forEach(b => {
            b.addEventListener('click', () => {
              const s = Number(b.dataset.tsec);
              state.timer.customMin = Math.floor(s / 60);
              state.timer.customSec = s % 60;
              saveTimerPrefsLocal();
              startTimerCountdown(s);
              renderTimerModalBody();
            });
          });
          document.getElementById('tm-minus-10').addEventListener('click', () => {
            if (state.timer.remaining > 0) state.timer.remaining = Math.max(5, state.timer.remaining - 10);
            else {
              const next = Math.max(5, getConfiguredTimerSeconds() - 10);
              state.timer.customMin = Math.floor(next / 60);
              state.timer.customSec = next % 60;
              saveTimerPrefsLocal();
            }
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-plus-10').addEventListener('click', () => {
            if (state.timer.remaining > 0) state.timer.remaining += 10;
            else {
              const next = getConfiguredTimerSeconds() + 10;
              state.timer.customMin = Math.floor(next / 60);
              state.timer.customSec = next % 60;
              saveTimerPrefsLocal();
            }
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-start-btn').addEventListener('click', () => {
            if (state.timer.running) {
              state.timer.running = false;
              updateFloatingTimerUI();
            } else if (state.timer.remaining > 0) {
              state.timer.running = true;
              runTimerTick();
              updateFloatingTimerUI();
            } else {
              startTimerCountdown(getConfiguredTimerSeconds());
            }
            renderTimerModalBody();
          });
          const applyCustomInputs = () => {
            const m = Math.max(0, Math.min(30, Number(document.getElementById('tm-min-inp').value) || 0));
            const s = Math.max(0, Math.min(59, Number(document.getElementById('tm-sec-inp').value) || 0));
            state.timer.customMin = m;
            state.timer.customSec = s;
            saveTimerPrefsLocal();
            const disp = document.getElementById('tm-live-display');
            if (disp && state.timer.remaining <= 0) disp.textContent = formatMMSS(getConfiguredTimerSeconds());
          };
          document.getElementById('tm-min-inp').addEventListener('input', applyCustomInputs);
          document.getElementById('tm-sec-inp').addEventListener('input', applyCustomInputs);
          document.getElementById('tm-set-dec').addEventListener('click', () => {
            state.timer.setsDone = Math.max(0, state.timer.setsDone - 1);
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-set-inc').addEventListener('click', () => {
            state.timer.setsDone += 1;
            updateFloatingTimerUI();
            renderTimerModalBody();
          });
          document.getElementById('tm-auto-chk').addEventListener('change', e => {
            state.timer.autoStartOnCheck = e.target.checked;
            saveTimerPrefsLocal();
          });
          document.getElementById('tm-sound-chk').addEventListener('change', e => {
            state.timer.soundOn = e.target.checked;
            saveTimerPrefsLocal();
          });
          document.getElementById('tm-vib-chk').addEventListener('change', e => {
            state.timer.vibrateOn = e.target.checked;
            saveTimerPrefsLocal();
          });
        } else {
          document.getElementById('tp-toggle-btn').addEventListener('click', () => {
            if (tempoRunning) {
              stopTempoPacer();
              tempoRunning = false;
              renderTimerModalBody();
            } else {
              tempoRunning = true;
              const tickTempo = () => {
                const ph = document.getElementById('tp-phase-text');
                const rp = document.getElementById('tp-reps-text');
                if (!ph) { stopTempoPacer(); return; }
                ph.textContent = tempoLabels[tempoStep];
                for (let i = 0; i < 5; i++) {
                  const dot = document.getElementById('tp-dot-' + i);
                  if (dot) dot.className = `py-2 rounded-xl text-[11px] font-extrabold transition ${tempoStep === i ? 'bg-[#5EEAD4] text-[#0F172A]' : 'bg-white/10 text-white/60'}`;
                }
                if (state.timer.soundOn) {
                  playTempoTone(tempoStep === 4 ? 880 : (tempoStep === 3 ? 620 : 440), 0.11);
                }
                if (tempoStep === 4) {
                  tempoReps += 1;
                  if (rp) rp.textContent = `완료 횟수: ${tempoReps}회`;
                }
                tempoStep = (tempoStep + 1) % 5;
              };
              renderTimerModalBody();
              tickTempo();
              __tempoInterval = setInterval(tickTempo, 1000);
            }
          });
          document.getElementById('tp-reset-btn').addEventListener('click', () => {
            stopTempoPacer();
            tempoRunning = false;
            tempoStep = 0;
            tempoReps = 0;
            renderTimerModalBody();
          });
        }
      }
      renderTimerModalBody();
    }

    // --- Barbell Plate Calculator Modal ---
    function computePlatesPerSide(targetWeight, barWeight) {
      const plates = [20, 15, 10, 5, 2.5, 1.25];
      let perSide = Math.max(0, (targetWeight - barWeight) / 2);
      const result = [];
      plates.forEach(p => {
        while (perSide >= p - 0.001) {
          result.push(p);
          perSide -= p;
        }
      });
      return { plates: result, remainder: Math.round(perSide * 100) / 100 };
    }

        const { plates, remainder } = computePlatesPerSide(targetWeight, barWeight);

        const plateHeight = p => p >= 20 ? 58 : p >= 15 ? 50 : p >= 10 ? 42 : p >= 5 ? 34 : 26;

        openModal('바벨 원판(플레이트) 계산기', `

                  ${[20, 15].map(bw => `
                    <button type="button" data-bw="${bw}" class="pc-bar-btn px-2.5 py-1 rounded-full text-[11px] font-bold ${barWeight === bw ? 'hero-navy text-white' : 'bg-white text-[#4B5563]'}">바벨 ${bw}kg</button>

                  <input id="pc-target-inp" type="number" step="2.5" min="15" max="300" value="${targetWeight}" class="w-28 text-center text-[30px] font-extrabold text-[#1E3A8A] tabular-nums bg-transparent focus:outline-none" />

            <!-- Visual Barbell -->

                <span class="text-[11px] font-bold text-[#5EEAD4]">한쪽당 꽂을 원판</span>
                <span class="text-[11px] text-white/75">빈 바 ${barWeight}kg 기준</span>
              </div>
              <div class="h-20 flex items-center justify-center overflow-hidden">

                  ${[...plates].reverse().map(p => `<div style="height:${plateHeight(p)}px;background:${plateColor(p)}" class="w-3 rounded-sm border border-white/40 mx-[1px]"></div>`).join('')}
                  <div class="w-24 h-2.5 bg-white/80 rounded-full mx-1"></div>
                  ${plates.map(p => `<div style="height:${plateHeight(p)}px;background:${plateColor(p)}" class="w-3 rounded-sm border border-white/40 mx-[1px]"></div>`).join('')}
                </div>

              <p class="text-center text-[14px] font-extrabold">
                ${plates.length ? Object.entries(grouped).map(([p, c]) => `${p}kg × ${c}장`).join(' + ') : '빈 바만 사용 (추가 원판 없음)'}
              </p>
              ${remainder > 0 ? `<p class="text-center text-[11px] text-[#FDE68A]">남는 무게: 양쪽 합 ${(remainder * 2).toFixed(1)}kg (최소 원판 1.25kg)</p>` : ''}

    // --- Ounwan (오늘 운동 완료) Quest Card Image Generator ---
    function openOunwanCardModal() {
      const wr = getWorkoutRate();
      const ds = getDietStats();
      const chk = state.record.dailyCheckin || {};
      const streak = state.insights?.careSummary?.workoutDays || state.workoutDays.length || 1;
      const coachMsg = (state.record.headerMessage || state.record.feedback?.workout || getDailyCoachTip(state.selectedDate)).slice(0, 62);

      const q1Done = (wr.total > 0 && wr.done >= wr.total) || chk.workout === 'done';
      const q2Done = ds.water >= 2000;
      const q3Done = ds.loggedCount > 0 || chk.diet === 'done';
      const clearedCount = [q1Done, q2Done, q3Done].filter(Boolean).length;

      // 운동을 완료하면 100% 달성 처리 (수분/식단 미달 시에도 100% 클리어 성취감 제공)
      const questPct = q1Done ? 100 : (wr.total > 0 ? wr.pct : 0);
      const isAllClear = questPct >= 100;

      // 아쉬운 점 / 보완 포인트 자동 생성
      const improvements = [];
      if (!q1Done) improvements.push(`남은 운동 ${Math.max(1, wr.total - wr.done)}종목 마무리하기`);
      if (!q2Done) improvements.push(`수분 ${((2000 - ds.water) / 1000).toFixed(1)}L 추가 보충 (부종·피로 완화)`);
      if (!q3Done) improvements.push('식단 1끼 이상 기록해 영양 밸런스 체크하기');
      const focusText = improvements.length
        ? improvements.slice(0, 2).join(' · ')
        : '운동·수분·식단 밸런스 완벽! 충분한 수면으로 근회복을 마무리하세요.';

      const shareText = `[FIT-CONNECT 퀘스트] ${state.memberName}님 · ${state.selectedDate}\n${isAllClear ? 'QUEST CLEAR 100%!' : `퀘스트 ${questPct}% 진행 중`} (루틴 ${wr.done}/${wr.total} · 수분 ${(ds.water / 1000).toFixed(1)}L · 연속 ${streak}일)`;

      openModal('오늘의 퀘스트 카드 저장', `

          <div class="rounded-[22px] overflow-hidden shadow-xl bg-[#060B19]">

      quests.forEach((q, idx) => {
        const y = 304 + idx * 102;

    // --- Metrics & Visual SVGs ---
    function isRoutineDone(r) {
      if (!r) return false;
      if (r.routineType !== 'homework') return true; // PT 수업은 코치와 이미 수행한 수업 기록
      return Array.isArray(r.completedSets) && r.completedSets.some(Boolean);
    }

    function getWorkoutRate() {
      const rs = state.record.routines || [];
      if (!rs.length) return { done: 0, total: 0, pct: 0 };
      const done = rs.filter(isRoutineDone).length;
      return { done, total: rs.length, pct: Math.round((done / rs.length) * 100) };
    }

    function getDietStats() {
      const d = state.record.diet || {};
      const keys = ['breakfast', 'lunch', 'dinner', 'snack'];
      let kcal = 0, carb = 0, prot = 0, fat = 0, loggedCount = 0;
      keys.forEach(k => {
        const m = d[k] || {};
        const c = Number(m.cal) || 0;
        const hasPhotos = Array.isArray(m.photos) && m.photos.length > 0;
        if (c > 0 || String(m.desc || '').trim() || hasPhotos) loggedCount++;
        kcal += c;
        carb += Number(m.carb) || 0;
        prot += Number(m.prot) || 0;
        fat += Number(m.fat) || 0;
      });
      const macroSum = carb + prot + fat;
      return {
        kcal,
        pct: Math.min(100, Math.round((kcal / state.targetKcal) * 100)),
        loggedCount,
        carbPct: macroSum ? Math.round((carb / macroSum) * 100) : 45,
        protPct: macroSum ? Math.round((prot / macroSum) * 100) : 35,
        fatPct: macroSum ? Math.round((fat / macroSum) * 100) : 20,
        water: Number(d.water) || 0
      };
    }

    function computeCareScore() {
      const wr = getWorkoutRate();
      const ds = getDietStats();
      const chk = state.record.dailyCheckin || {};
      const weekDays = state.insights?.careSummary?.workoutDays || 0;
      let score = 55 + Math.min(20, weekDays * 6) + Math.round(wr.pct * 0.15);
      if (chk.workout === 'done') score += 5;
      if (chk.diet === 'done') score += 4;
      if (ds.loggedCount > 0) score += 3;
      return Math.min(100, score);
    }

    function heroRingsSvg(scorePct, kcalPct, routinePct) {
      const rings = [
        { r: 44, pct: scorePct, color: '#60A5FA', track: 'rgba(255,255,255,0.16)' },
        { r: 33, pct: Math.max(8, kcalPct), color: '#5EEAD4', track: 'rgba(255,255,255,0.14)' },
        { r: 22, pct: Math.max(8, routinePct), color: '#FFFFFF', track: 'rgba(255,255,255,0.12)' }
      ];
      return `
        <svg width="106" height="106" class="-rotate-90" viewBox="0 0 106 106">
          ${rings.map(ring => {
            const circ = 2 * Math.PI * ring.r;
            const offset = circ - (Math.min(100, ring.pct) / 100) * circ;
            return `
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.track}" stroke-width="7.5"/>
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="7.5" stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
            `;
          }).join('')}
        </svg>
      `;
    }

    function miniRing(pct) {
      const r = 16;
      const c = 2 * Math.PI * r;
      const offset = c - (Math.min(100, pct) / 100) * c;
      return `
        <svg width="42" height="42" class="-rotate-90" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4.5"/>
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"
            stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
        </svg>
      `;
    }

    function weeklyCurveSvg() {
      const wr = getWorkoutRate();
      const pts = state.weekDays.map((d, i) => {
        const isSel = d.fullDate === state.selectedDate;
        const worked = state.workoutDays.includes(d.fullDate);
        let val = worked ? 82 : 24;
        if (isSel) val = Math.max(val, wr.pct > 0 ? wr.pct : (state.record.dailyCheckin.workout === 'done' ? 85 : 35));
        const x = 16 + i * 52;
        const y = 74 - (val / 100) * 56;
        return { x, y, day: d.day, isSel, worked };
      });
      let pathD = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const cpX = (pts[i].x + pts[i + 1].x) / 2;
        pathD += ` C ${cpX} ${pts[i].y}, ${cpX} ${pts[i + 1].y}, ${pts[i + 1].x} ${pts[i + 1].y}`;
      }
      const areaD = `${pathD} L ${pts[pts.length - 1].x} 82 L ${pts[0].x} 82 Z`;
      return `
        <svg viewBox="0 0 344 96" class="w-full h-24 overflow-visible">
          <defs>
            <linearGradient id="liveCurve" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient>
            <linearGradient id="liveFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.20"/><stop offset="100%" stop-color="#14B8A6" stop-opacity="0.0"/></linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#liveFill)"/>
          <path d="${pathD}" fill="none" stroke="url(#liveCurve)" stroke-width="2.8" stroke-linecap="round"/>
          ${pts.map(pt => `
            <circle cx="${pt.x}" cy="${pt.y}" r="${pt.isSel ? 5.5 : 3.5}" fill="${pt.isSel ? '#14B8A6' : (pt.worked ? '#1D4ED8' : '#CBD5E1')}" stroke="#FFFFFF" stroke-width="2"/>
            <text x="${pt.x}" y="95" text-anchor="middle" font-size="10" font-weight="${pt.isSel ? '800' : '600'}" fill="${pt.isSel ? '#1D4ED8' : '#9CA3AF'}">${pt.day}</text>
          `).join('')}
        </svg>
      `;
    }

        try {

          const res = await postRecords({action:'read',member:state.memberName,date,...auth});
          const previous = unwrapDailyRecord(res)?.diet?.[mealKey];
          if (!previous || (!String(previous.desc||'').trim() && !Number(previous.cal))) {
            showToast('어제 같은 끼니에 저장된 기록이 없어요');

            const cal = document.getElementById('mf-cal');

            if(cal) cal.value = previous.cal || '';

          showToast('어제 식단을 불러오지 못했어요: '+(err?.code||'네트워크 확인'));

      document.getElementById('meal-delete-photo')?.addEventListener('click', async e => {
        if (!window.confirm(`${mealLabel} 사진을 삭제할까요? 식단 글과 칼로리는 유지됩니다.`)) return;
        const btn = e.currentTarget;
        btn.disabled = true;
        btn.textContent = '사진 삭제 중...';
        try {
          const auth = (state.appMode === 'coach' && state.trainerPassword)
            ? { password: state.trainerPassword }
            : (state.session ? { session: state.session } : { token: state.token });
          const res = await deleteMealPhoto(state.memberName, state.selectedDate, mealKey, auth);
          if (res?.status !== 'success') throw new Error(res?.code || '삭제 실패');
          // Clear the local copy and cache only after the authoritative save.
          state.record.diet[mealKey] = { ...(state.record.diet[mealKey] || {}), photos: [], photo: '' };
          saveCachedMemberData(state.selectedDate);
          closeModal();
          renderAll();
          showToast(`${mealLabel} 사진이 삭제되었어요`);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '사진만 삭제하기';
          showToast('사진 삭제 실패: ' + (err?.message || '네트워크 오류'));
        }
      });
      document.getElementById('meal-photo-input').addEventListener('change', async e => {
        const f = e.target.files?.[0];
        if (!f) return;
        try {
          compressedPhoto = await compressImageFile(f);
          hasNewPhoto = true;
          const prev = document.getElementById('meal-photo-preview');
          delete prev.dataset.directimg;
          delete prev.dataset.hydrated;
          prev.src = compressedPhoto;
          prev.classList.remove('hidden');
          document.getElementById('photo-status-txt').textContent = '사진 압축 완료 ✓';
          showToast('사진이 가볍게 압축되었어요');
        } catch {
          showToast('사진을 불러오지 못했어요');
        }
      });

      let savingMeal = false;
      async function commitMealSave(updated, labelText) {
        if (savingMeal) return;
        if (!state.isLive) {
          showToast('미리보기 모드라 저장되지 않았어요. 전용 링크로 접속해 주세요!');
          return;
        }
        const submitBtn = document.querySelector('#meal-form button[type="submit"]');
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = '서버에 저장 중...';
        }
        savingMeal = true;
        document.querySelectorAll('.pr-btn').forEach(btn => { btn.disabled = true; });
        const prevMeal = state.record.diet[mealKey];
        state.record.diet[mealKey] = updated;
        const auth = (state.appMode === 'coach' && state.trainerPassword)
          ? { password: state.trainerPassword }
          : (state.session ? { session: state.session } : (state.token ? { token: state.token } : { password: state.trainerPassword }));
        try {
          // Apps Script deliberately strips photos. Finish that write BEFORE the
          // photo-bearing Supabase write, rather than racing two writers.
          // Apps Script stores only light meal metadata; image bytes belong to
          // Supabase and must never be copied to Google Sheets or a full-record sync.
          const lightDiet = {};
          for (const [key, meal] of Object.entries(state.record.diet || {})) {
            lightDiet[key] = meal && typeof meal === 'object' && key !== 'water'
              ? { ...meal, photos: [] } : meal;
          }
          const lightRecord = { ...state.record, diet: lightDiet };
          const appsSaved = await saveFullRecordLive(state.memberName, lightRecord);
          if (!appsSaved) throw new Error('Apps Script 식단 기록 저장 실패');
          const dietPayload = {
            action: 'dietSave',
            member: state.memberName,
            date: state.selectedDate,
            diet: { [mealKey]: updated }
          };
          let supaRes;
          try {
            supaRes = await postRecords({ ...dietPayload, ...auth });
          } catch (saveError) {
            // Member sessions last eight hours. If a session expired while
            // a member was filling out the meal form, validate the member link
            // and transparently retry without losing the selected photo.
            if (saveError?.status !== 403 || !state.token || state.appMode === 'coach') throw saveError;
            const fresh = await postRecords({
              action: 'memberSession', member: state.memberName,
              date: state.selectedDate, token: state.token
            });
            if (fresh?.status !== 'success' || !fresh.session) throw saveError;
            state.session = fresh.session;
            supaRes = await postRecords({ ...dietPayload, session: state.session });
          }
          if (supaRes?.status !== 'success') {
            throw new Error(supaRes?.code || supaRes?.message || '사진 저장 실패');
          }
          // Photo write returned success. Avoid a second authenticated read here:
          // an expired read session should not turn a successful upload into 403.
          saveCachedMemberData(state.selectedDate);
          closeModal();
          renderAll();
          showToast(labelText + ' ✓');
        } catch (err) {
          // Apps Script may already have saved the meal text. Do not silently
          // restore a stale local copy and imply that nothing was saved.
          state.record.diet[mealKey] = prevMeal;
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = '저장하기';
          }
          document.querySelectorAll('.pr-btn').forEach(btn => { btn.disabled = false; });
          showToast('식단 저장을 완료하지 못했어요: ' + (err?.message || '네트워크를 확인해 주세요') + ' (일부 기록은 저장됐을 수 있어요)');
        } finally {
          savingMeal = false;
        }
      }

      document.querySelectorAll('.pr-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pr = presets[Number(btn.dataset.pr)];
          const updated = { desc: `[${pr.tag}] ${pr.desc}`, cal: pr.cal, carb: pr.carb, prot: pr.prot, fat: pr.fat, ...(compressedPhoto ? { photos: [compressedPhoto] } : {}) };
          commitMealSave(updated, `${mealLabel} (${pr.tag}) 저장 완료`);
        });
      });

      document.getElementById('meal-form').addEventListener('submit', e => {
        e.preventDefault();
        const desc = document.getElementById('mf-desc').value.trim();
        const cal = document.getElementById('mf-cal').value.trim();
        if (!desc && !cal && !compressedPhoto) {
          showToast('메뉴, 칼로리 또는 사진 중 하나를 입력해 주세요');
          return;
        }
        const updated = { ...m, desc: desc || '사진 기록', cal, ...(compressedPhoto ? { photos: [compressedPhoto] } : {}) };
        commitMealSave(updated, `${mealLabel} 식단 저장 완료`);
      });
    }

    function getExerciseProfile(title) {

      if (/데드버그|플랭크|복근|크런치|코어|레그레이즈/i.test(t)) {
        return {

          secondaryLabel: '복사근 · 장요근',
          steps: [

          steps: [
            '발을 골반 너비로 두고 가슴을 펴 척추 중립 정렬을 맞춥니다.',

    function buildVideoPlayerHtml(videoUrl) {
      const u = String(videoUrl || '').trim();
      if (!u) return '';
      const ytMatch = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
      if (ytMatch) {
        return `
          <div class="rounded-[20px] overflow-hidden bg-black aspect-video shadow-sm">
            <iframe src="https://www.youtube.com/embed/${ytMatch[1]}?playsinline=1&rel=0" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        `;
      }
      return `
        <div class="rounded-[20px] overflow-hidden bg-black shadow-sm">
          <video src="${escapeHtml(u)}" controls playsinline preload="auto" class="w-full max-h-56 object-contain"></video>
        </div>
      `;
    }

    async function enterCoachWithPassword(pw, isAuto) {
      if (isLiveOrigin) {
        try {
          const v = await postRecords({ action: 'verify', password: pw, date: state.selectedDate });
          if (v?.status !== 'success') {
            if (isAuto) {
              try { localStorage.removeItem('fit_coach_pw_v2'); } catch {}
              return false;
            }
            showToast('비밀번호가 일치하지 않아요');
            return false;
          }
          state.trainerPassword = pw;
          try { localStorage.setItem('fit_coach_pw_v2', pw); } catch {}
          const [ovRes, fastRes, asListRes] = await Promise.allSettled([
            postRecords({ action: 'trainerOverview', password: pw, date: state.selectedDate }),
            postRecords({ action: 'listMembersFast', password: pw }),
            postAppsScript({ action: 'listMembers', password: pw })
          ]);
          const ov = ovRes.status === 'fulfilled' ? ovRes.value : null;
          const fast = fastRes.status === 'fulfilled' ? fastRes.value : null;
          const asList = asListRes.status === 'fulfilled' ? asListRes.value : null;
          const tokenMap = {};
          try {
            const savedMap = JSON.parse(localStorage.getItem('fit_member_tokens_v2') || '{}');
            Object.assign(tokenMap, savedMap);
          } catch {}
          [fast, asList].forEach(src => {
            const arr = Array.isArray(src) ? src : (Array.isArray(src?.members) ? src.members : (Array.isArray(src?.data) ? src.data : []));
            arr.forEach(fm => {
              if (!fm || typeof fm !== 'object') return;
              const nm = fm.name || fm.member || '';
              const tk = fm.token || fm.memberToken || extractTokenValue(fm.url || fm.link || '');
              if (nm && tk) tokenMap[nm] = tk;
            });
          });
          const archivedMembers = new Set(Array.isArray(fast?.archivedMembers) ? fast.archivedMembers : []);
          state.archivedMemberNames = [...archivedMembers];
          let serverMembers = [];
          if (ov?.status === 'success' && Array.isArray(ov.members)) {
            serverMembers = ov.members.filter(m => !archivedMembers.has(m.name)).map(m => ({ ...m, token: m.token || tokenMap[m.name] || '' }));
          }
          const extraLists = [
            ...(Array.isArray(fast?.members) ? fast.members : []),
            ...(Array.isArray(asList?.members) ? asList.members : (Array.isArray(asList?.data) ? asList.data : []))
          ];
          extraLists.forEach(fn => {
            const nm = typeof fn === 'string' ? fn.trim() : String(fn?.name || fn?.member || '').trim();
            if (nm && !archivedMembers.has(nm) && !serverMembers.some(sm => sm.name === nm)) {
              serverMembers.push({ name: nm, lastDate: '', activeToday: false, pendingWorkout: false, pendingDiet: false, weeklyWorkoutDays: 0, token: tokenMap[nm] || '' });
            }
          });
          let localAdded = [];
          try {
            localAdded = JSON.parse(localStorage.getItem('fit_added_members_v2') || '[]');
          } catch {}
          const merged = [...serverMembers];
          localAdded.forEach(lm => {
            if (lm?.name && !archivedMembers.has(lm.name) && !merged.some(sm => sm.name === lm.name)) {
              merged.unshift(lm);
            }
          });
          state.trainerOverview = merged;
          state.isLive = true;
          postAppsScript({ action: 'trainerOverview', password: pw, date: state.selectedDate }).then(asOv => {
            if (asOv?.status === 'success' && Array.isArray(asOv.members)) {
              const byName = new Map(asOv.members.map(m => [m.name, m]));
              let changed = false;
              state.trainerOverview = (state.trainerOverview || []).map(m => {
                const am = byName.get(m.name);
                if (!am) return m;
                changed = true;
                return {
                  ...m,
                  lastDate: (am.lastDate || '') > (m.lastDate || '') ? am.lastDate : m.lastDate,
                  activeToday: Boolean(m.activeToday || am.activeToday),
                  workoutToday: Boolean(m.workoutToday || am.workoutToday),
                  dietToday: Boolean(m.dietToday || am.dietToday),
                  pendingWorkout: Boolean(m.pendingWorkout || am.pendingWorkout),
                  pendingDiet: Boolean(m.pendingDiet || am.pendingDiet),
                  feedbackDone: Boolean(m.feedbackDone || am.feedbackDone),
                  weeklyWorkoutDays: Math.max(Number(m.weeklyWorkoutDays) || 0, Number(am.weeklyWorkoutDays) || 0)
                };
              });
              asOv.members.forEach(am => {
                if (am?.name && !archivedMembers.has(am.name) && !state.trainerOverview.some(x => x.name === am.name)) {
                  state.trainerOverview.push({ ...am, token: tokenMap[am.name] || '' });
                  changed = true;
                }
              });
              if (changed && state.appMode === 'coach') renderAll();
            }
          }).catch(() => {});
        } catch {
          if (!isAuto) showToast('코치 인증 중 오류가 발생했어요');
          return false;
        }
      } else {
        state.trainerPassword = pw;
        try { localStorage.setItem('fit_coach_pw_v2', pw); } catch {}
        const baseMock = [
          { name: '김윤지', lastDate: state.selectedDate, activeToday: true, pendingWorkout: true, pendingDiet: true, weeklyWorkoutDays: 2 },
          { name: '이서연', lastDate: state.selectedDate, activeToday: true, pendingWorkout: false, pendingDiet: true, weeklyWorkoutDays: 3 },
          { name: '최민수', lastDate: shiftDateStr(state.selectedDate, -5), activeToday: false, pendingWorkout: false, pendingDiet: false, weeklyWorkoutDays: 0 }
        ];
        let localAdded = [];
        try { localAdded = JSON.parse(localStorage.getItem('fit_added_members_v2') || '[]'); } catch {}
        localAdded.forEach(lm => {
          if (lm?.name && !baseMock.some(sm => sm.name === lm.name)) baseMock.unshift(lm);
        });
        state.trainerOverview = baseMock;
      }
      state.appMode = 'coach';
      state.coachTab = 'coaching';
      const hasPending = state.trainerOverview.some(m => m.pendingWorkout || m.pendingDiet);
      state.coachFilter = hasPending ? 'pending' : 'all';
      state.fabOpen = false;
      closeModal();
      showToast(isAuto ? '저장된 코치 인증으로 바로 입장했어요' : '코치 모드로 전환되었어요');
      renderAll();
      return true;
    }

    async function fetchMemberForCoach(memberName) {
      if (!state.isLive || !state.trainerPassword) {
        return { daily: state.record, history: { previous: {} } };
      }
      const weekDays = buildWeekDays(state.selectedDate);
      const [dRecRes, dAsRes, hRes, vRes, ...weekPtRes] = await Promise.allSettled([
        postRecords({ action: 'read', member: memberName, date: state.selectedDate, password: state.trainerPassword }),
        postAppsScript({ action: 'read', member: memberName, date: state.selectedDate, password: state.trainerPassword }),
        postRecords({ action: 'workoutHistory', member: memberName, date: state.selectedDate, month: state.selectedDate.slice(0, 7), password: state.trainerPassword }),
        postRecords({ action: 'directVideoList', member: memberName, date: state.selectedDate, password: state.trainerPassword }),
        ...weekDays.map(wd => wd.fullDate === state.selectedDate
          ? Promise.resolve(null)
          : postRecords({ action: 'read', member: memberName, date: wd.fullDate, password: state.trainerPassword }))
      ]);
      const recObj = dRecRes.status === 'fulfilled' ? unwrapDailyRecord(dRecRes.value) : null;
      const asObj = dAsRes.status === 'fulfilled' ? unwrapDailyRecord(dAsRes.value) : null;
      const hasDietData = obj => obj?.diet && ['breakfast', 'lunch', 'dinner', 'snack'].some(k => {
        const ml = obj.diet[k];
        return ml && (String(ml.desc || '').trim() || (Array.isArray(ml.photos) && ml.photos.length > 0) || Number(ml.cal) > 0);
      });
      const asHasRoutines = Array.isArray(asObj?.routines) && asObj.routines.length > 0;
      const recHasRoutines = Array.isArray(recObj?.routines) && recObj.routines.length > 0;
      const baseChosen = asHasRoutines ? asObj : (recHasRoutines ? recObj : ((asObj && (asObj.headerMessage || asObj.diet || asObj.memos)) ? asObj : (recObj || asObj || {})));
      const mergedCoachDiet = mergeDietRecords(asObj?.diet, recObj?.diet, recObj?.deletedPhotoMeals || []);
      const chosen = {
        ...(baseChosen || {}),
        diet: mergedCoachDiet,
        ...(asObj && hasDietData(asObj) ? { feedback: asObj.feedback || baseChosen?.feedback, memos: (Array.isArray(asObj.memos) && asObj.memos.length) ? asObj.memos : baseChosen?.memos } : {}),
        ...(recObj?.coachFeedbackStored
          ? { headerMessage: recObj.headerMessage, feedback: recObj.feedback }
          : {})
      };
      const weekPtMap = {};
      weekDays.forEach((wd, idx) => {
        if (wd.fullDate === state.selectedDate) {
          weekPtMap[wd.fullDate] = { scheduled: Boolean(chosen?.ptScheduled), time: String(chosen?.ptTime || '') };
        } else {
          const r = weekPtRes[idx]?.status === 'fulfilled' ? unwrapDailyRecord(weekPtRes[idx].value) : null;
          weekPtMap[wd.fullDate] = { scheduled: Boolean(r?.ptScheduled), time: String(r?.ptTime || '') };
        }
      });
      return {
        daily: chosen,
        history: (hRes.status === 'fulfilled' && hRes.value?.status === 'success') ? hRes.value : { previous: {} },
        directVideos: (vRes.status === 'fulfilled' && vRes.value?.status === 'success' && Array.isArray(vRes.value.videos)) ? vRes.value.videos : [],
        weekPtMap
      };
    }

    function extractTokenValue(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      try {
        if (s.includes('token=')) {
          const u = new URL(s.startsWith('http') ? s : 'https://x.com/?' + s.split('?').pop());
          return (u.searchParams.get('token') || '').trim();
        }
      } catch {}
      return s;
    }

    function saveMemberTokenLocal(memberName, tokenVal) {
      const mObj = (state.trainerOverview || []).find(x => x.name === memberName);
      if (mObj) mObj.token = tokenVal;
      try {
        const map = JSON.parse(localStorage.getItem('fit_member_tokens_v2') || '{}');
        map[memberName] = tokenVal;
        localStorage.setItem('fit_member_tokens_v2', JSON.stringify(map));
        const prevAdded = JSON.parse(localStorage.getItem('fit_added_members_v2') || '[]');
        const idx = prevAdded.findIndex(x => x.name === memberName);
        if (idx >= 0) prevAdded[idx].token = tokenVal;
        else prevAdded.unshift({ name: memberName, lastDate: state.selectedDate, activeToday: false, pendingWorkout: false, pendingDiet: false, weeklyWorkoutDays: 0, token: tokenVal });
        localStorage.setItem('fit_added_members_v2', JSON.stringify(prevAdded));
      } catch {}
    }

    async function resolveMemberToken(memberName) {
      const mObj = (state.trainerOverview || []).find(x => x.name === memberName);
      let tok = mObj?.token || (memberName === state.memberName ? state.token : '');
      if (tok) return tok;
      if (state.isLive && state.trainerPassword) {
        try {
          const r = await postAppsScript({ action: 'getMemberLink', name: memberName, password: state.trainerPassword });
          const rTok = r?.token || extractTokenValue(r?.url || r?.link || '');
          if (r?.status === 'success' && rTok) {
            saveMemberTokenLocal(memberName, rTok);
            return rTok;
          }
        } catch {}
        try {
          const addR = await postAppsScript({ action: 'addMember', name: memberName, password: state.trainerPassword });
          if (addR?.status === 'success' && addR.token) {
            saveMemberTokenLocal(memberName, addR.token);
            return addR.token;
          }
          if (addR?.message) showToast('서버 응답: ' + addR.message);
        } catch {}
      }
      return '';
    }

          const pendingName = pendingNameEl ? pendingNameEl.value.trim() : '';
          if (pendingName) {
            const pSets = Math.max(1, Number(document.getElementById('cd-new-sets')?.value) || 3);
            const pWt = document.getElementById('cd-new-weight')?.value.trim() || '';
            const pRp = document.getElementById('cd-new-reps')?.value.trim() || '12';
            routines.push({
              id: Date.now(),
              routineType: document.getElementById('cd-new-type')?.value || 'pt',
              name: pendingName,
              weight: pWt,
              sets: String(pSets),
              reps: pRp,
              setDetails: Array.from({ length: pSets }, () => ({ weight: pWt, reps: pRp })),
              note: document.getElementById('cd-new-note')?.value.trim() || '',
              videoUrl: document.getElementById('cd-new-video')?.value.trim() || '',
              ...(pendingNewVideoId ? { videoId: pendingNewVideoId } : {}),
              completedSets: Array(pSets).fill(false)
            });
          }

          const finalReply = document.getElementById('cd-reply-msg').value.trim();
          const finalDiet = document.getElementById('cd-diet-msg').value.trim();
          const fullPayload = {
            headerMessage: finalReply || daily.headerMessage || '',
            routines,
            reflection: daily.reflection || { good: '', bad: '' },
            diet: daily.diet || {
              breakfast: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
              lunch: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
              dinner: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
              snack: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
              water: 0
            },
            feedback: {
              ...(daily.feedback || {}),
              ...(finalReply ? { workout: finalReply } : {}),
              ...(finalDiet ? { diet: finalDiet } : {}),
              time: nowTimeHHMM()
            },
            memos: Array.isArray(daily.memos) ? daily.memos : [],
            dailyCheckin: daily.dailyCheckin || { workout: '', diet: '', mood: '' }
          };

          const saveBtn = document.getElementById('cd-save-all');
          const nextBtn = document.getElementById('cd-save-next');
          if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '저장 중...'; }
          if (nextBtn) { nextBtn.disabled = true; nextBtn.textContent = '저장 중...'; }
          const ok = await saveFullRecordLive(memberName, fullPayload);
          if (!ok) {
            if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '이 회원만 저장하기'; }
            if (nextBtn) { nextBtn.disabled = false; nextBtn.textContent = '저장하고 다음 대기 회원 보기 →'; }
            return;
          }
          try {
            const savedFeedback = await postRecords({
              action: 'coachFeedbackSave',
              member: memberName, date: state.selectedDate,
              password: state.trainerPassword,
              headerMessage: fullPayload.headerMessage,
              workoutFeedback: fullPayload.feedback.workout || '',
              dietFeedback: fullPayload.feedback.diet || ''
            });
            if (savedFeedback?.status !== 'success')
              throw new Error(savedFeedback?.code || '피드백 서버 저장 실패');
          } catch (err) {
            // The Apps Script write may already have succeeded. Keep the
            // editor open for retry instead of displaying false success.
            if (saveBtn) {
              saveBtn.disabled = false;
              saveBtn.textContent = '다시 저장하기';
            }
            if (nextBtn) { nextBtn.disabled = false; nextBtn.textContent = '저장하고 다음 대기 회원 보기 →'; }
            showToast('피드백 서버 저장 확인 실패: ' + (err?.message || '다시 시도해 주세요'));
            return;
          }

          const ovTarget = state.trainerOverview.find(x => x.name === memberName);
          if (ovTarget) {
            if (finalReply) ovTarget.pendingWorkout = false;
            if (finalDiet) ovTarget.pendingDiet = false;
          }
          if (memberName === state.memberName) {
            state.record = fullPayload;
            saveCachedMemberData(state.selectedDate);
          }
          const nextMember = goNext ? (state.trainerOverview || []).find(m =>
            m.name !== memberName && (m.pendingWorkout || m.pendingDiet || Number(m.directPendingVideos || 0) > 0)) : null;
          closeModal();
          triggerConfetti();
          renderAll();
          if (nextMember) {
            showToast(`${memberName} 저장 완료 · 다음 회원을 여는 중`);
            openCoachDetailSheet(nextMember.name);
          } else {
            showToast(goNext ? `${memberName} 저장 완료 · 다음 대기 회원 없음 ✓` : `${memberName} 회원님 루틴 · 피드백 저장 완료!`);
          }
        }
        document.getElementById('cd-save-all').addEventListener('click', () => saveCoachDetailAndAdvance(false));
        document.getElementById('cd-save-next').addEventListener('click', () => saveCoachDetailAndAdvance(true));
      }
      renderDetailBody();
    }

        if (btn) { btn.disabled = true; btn.textContent = '등록 중...'; }

        if (state.trainerOverview.some(x => x.name === mName)) {
          showToast('이미 등록된 회원입니다');
          if (btn) { btn.disabled = false; btn.textContent = '회원 등록 및 링크 복사'; }

        }
        let issuedTok = '';

          try {

            if (addRes?.status !== 'success' || !addRes?.token) {
              showToast('회원 등록 실패: ' + (addRes?.message || '서버 오류'));
              if (btn) { btn.disabled = false; btn.textContent = '회원 등록 및 링크 복사'; }
              return;
            }
            issuedTok = addRes.token;
            // Apps Script owns the member link. Supabase owns the coach's
            // canonical active-member list, so both must be registered.
            const dbRes = await postRecords({ action: 'memberRegister', name: mName, date: state.selectedDate, password: state.trainerPassword });

            if (btn) { btn.disabled = false; btn.textContent = '회원 등록 및 링크 복사'; }
            return;
          }
        }

        const firstMsg = document.getElementById('am-msg').value.trim();
        const newMemberObj = {
          name: mName,
          lastDate: state.selectedDate,
          activeToday: false,
          pendingWorkout: false,
          pendingDiet: false,
          weeklyWorkoutDays: 0,
          token: issuedTok
        };
        if (!state.trainerOverview.some(x => x.name === mName)) {
          state.trainerOverview.unshift(newMemberObj);
        }
        if (issuedTok) saveMemberTokenLocal(mName, issuedTok);

        if (firstMsg && state.isLive && state.trainerPassword) {
          await savePatchLive({ headerMessage: firstMsg }, mName);
        }

        closeModal();
        triggerConfetti();
        if (issuedTok) {
          const base = isLiveOrigin ? (window.location.origin + window.location.pathname) : 'https://fit-connect.sinm54388.workers.dev/';
          const u = new URL(base);
          u.searchParams.set('name', mName);

          showToast(`${mName} 회원 등록 완료! 전용 링크가 복사되었어요 ✓`);
        } else {
          showToast(`${mName} 회원님이 등록되었어요!`);
        }
