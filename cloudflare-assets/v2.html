<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <title>FIT-CONNECT</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #E2E6EE;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em;
    }
    :root { --fit-bottom: env(safe-area-inset-bottom, 0px); }
    #app-header { padding-top: calc(1rem + env(safe-area-inset-top, 0px)); }
    #app-frame { padding-bottom: calc(8.5rem + var(--fit-bottom)); }
    #bottom-nav { padding-bottom: calc(0.75rem + var(--fit-bottom)); }
    #member-fab-wrap { bottom: calc(var(--fit-nav-height, 4rem) + 0.75rem); }
    #modal-panel, #consent-panel {
      max-height: 88vh;
      max-height: min(88dvh, var(--fit-sheet-height, 88dvh));
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-bottom: calc(1.5rem + var(--fit-bottom));
    }
    #modal-backdrop { bottom: var(--fit-keyboard-offset, 0px); }
    body.sheet-open { overflow: hidden; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hero-navy {
      background:
        radial-gradient(circle at 88% 18%, rgba(56, 189, 248, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 12% 90%, rgba(20, 184, 166, 0.18) 0%, transparent 40%),
        linear-gradient(135deg, #0B132B 0%, #1E3A8A 58%, #2563EB 100%);
    }
    .card-blue { background: linear-gradient(145deg, #1D4ED8 0%, #3B82F6 100%); }
    .card-teal { background: linear-gradient(145deg, #0F766E 0%, #14B8A6 100%); }
    .tap-scale { transition: transform 0.13s ease, background-color 0.16s ease, box-shadow 0.16s ease; }
    .tap-scale:active { transform: scale(0.975); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .coach-member-row { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.95fr); gap: 0.65rem; align-items: center; }
    .coach-member-row:active { background: #EFF6FF; }
    .confetti-dot {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      animation: confettiFall 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4); }
    }
    .skeleton {
      background: linear-gradient(90deg, #E5E7EB 25%, #F3F4F6 50%, #E5E7EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#E2E6EE] text-[#111827]">

  <!-- Mobile App Frame -->
  <div id="app-frame" class="mx-auto min-h-screen max-w-[430px] bg-[#F4F6F9] relative flex flex-col pb-28 sm:shadow-[0_12px_40px_rgba(15,23,42,0.12)]">

    <!-- Header -->
    <header id="app-header" class="sticky top-0 z-30 bg-[#F4F6F9]/94 backdrop-blur-xl px-5 pt-4 pb-3"></header>

    <!-- Main Dynamic View -->
    <main id="main-content" class="flex-1 px-4 pt-1 space-y-3.5"></main>

    <!-- Member Floating Action Button (+) -->
    <div id="member-fab-wrap" class="fixed bottom-20 left-1/2 -translate-x-1/2 w-full max-w-[430px] pointer-events-none z-40 px-4 flex flex-col items-end">
      <div id="fab-menu" class="hidden flex-col items-end gap-2 mb-2.5 pointer-events-auto animate-in">
        <button type="button" id="fab-diet" class="tap-scale px-4 py-2.5 rounded-full bg-white text-[#111827] text-[13px] font-bold shadow-[0_6px_20px_rgba(15,23,42,0.14)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#0F766E]"></span> 식단 빠른 기록
        </button>
        <button type="button" id="fab-water" class="tap-scale px-4 py-2.5 rounded-full bg-white text-[#111827] text-[13px] font-bold shadow-[0_6px_20px_rgba(15,23,42,0.14)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#3B82F6]"></span> 물 500ml 추가
        </button>
        <button type="button" id="fab-memo" class="tap-scale px-4 py-2.5 rounded-full bg-white text-[#111827] text-[13px] font-bold shadow-[0_6px_20px_rgba(15,23,42,0.14)] flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-[#1E3A8A]"></span> 코치에게 메모
        </button>
      </div>
      <button type="button" id="fab-toggle" class="pointer-events-auto tap-scale w-12 h-12 rounded-full hero-navy text-white shadow-[0_8px_24px_rgba(30,58,138,0.42)] flex items-center justify-center" aria-label="빠른 기록">
        <svg id="fab-icon" class="w-6 h-6 transition-transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- Bottom Tab Navigation -->
    <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] z-40 bg-white/95 backdrop-blur-xl border-t border-gray-200/70 px-2 pt-2 pb-3"></nav>
  </div>

  <!-- Bottom Sheet Modal -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-black/45 backdrop-blur-[2px] hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title" class="w-full max-w-[430px] bg-white rounded-t-[28px] sm:rounded-[28px] p-6 shadow-2xl animate-in max-h-[88vh] overflow-y-auto">
      <div class="w-10 h-1 rounded-full bg-gray-200 mx-auto mb-4 sm:hidden"></div>
      <div class="flex items-center justify-between pb-3">
        <h3 id="modal-title" class="text-[17px] font-bold text-[#111827]"></h3>
        <button type="button" id="modal-close" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 text-sm font-bold">✕</button>
      </div>
      <div id="modal-body" class="pt-2"></div>
    </div>
  </div>

  <!-- Privacy Consent Bottom Sheet (1회 노출, localStorage 저장) -->
  <div id="consent-backdrop" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-[2px] hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="consent-panel" class="w-full max-w-[430px] bg-white rounded-t-[28px] sm:rounded-[28px] p-6 shadow-2xl animate-in space-y-4">
      <div class="w-10 h-1 rounded-full bg-gray-200 mx-auto sm:hidden"></div>
      <div class="flex items-center gap-2.5">
        <span class="w-9 h-9 rounded-2xl hero-navy text-white flex items-center justify-center text-sm font-extrabold">✓</span>
        <div>
          <span class="text-[11px] font-bold text-[#1D4ED8]">FIT-CONNECT 개인정보 보호</span>
          <h3 class="text-[16px] font-extrabold text-[#111827]">신체 · 식단 기록 수집 및 활용 동의</h3>
        </div>
      </div>
      <div class="p-3.5 rounded-2xl bg-[#F4F6F9] text-[12px] text-[#4B5563] space-y-1.5 leading-relaxed">
        <p>• <b class="text-[#111827]">수집 항목</b>: 운동 루틴 수행 기록, 식단(메뉴·사진·수분), 컨디션 체크 및 코치 소통 메모</p>
        <p>• <b class="text-[#111827]">이용 목적</b>: 담당 코치의 1:1 맞춤 트레이닝 피드백 및 주간 성장 리포트 제공</p>
        <p>• <b class="text-[#111827]">보관 및 보호</b>: 회원 전용 링크와 코치 인증으로 접근을 제어하며 언제든 삭제를 요청할 수 있습니다.</p>
      </div>
      <button type="button" id="btn-consent-agree" class="tap-scale w-full py-3.5 rounded-2xl hero-navy text-white text-[14px] font-extrabold shadow-md">
        동의하고 리포트 시작하기
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" role="status" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full hero-navy text-white text-[12px] font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 whitespace-nowrap"></div>

  <script>
    // --- Date Helpers (KST) ---
    function getTodayKST() {
      const now = new Date();
      const kst = new Date(now.getTime() + 9 * 3600000);
      return kst.toISOString().slice(0, 10);
    }

    function shiftDateStr(dateStr, offset) {
      const d = new Date(dateStr + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + offset);
      return d.toISOString().slice(0, 10);
    }

    function daysBetween(dateA, dateB) {
      if (!dateA || !dateB) return 99;
      const a = new Date(dateA + 'T00:00:00Z').getTime();
      const b = new Date(dateB + 'T00:00:00Z').getTime();
      if (Number.isNaN(a) || Number.isNaN(b)) return 99;
      return Math.max(0, Math.round((b - a) / 86400000));
    }

    function nowTimeHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }

    function buildWeekDays(anchorDate) {
      const d = new Date(anchorDate + 'T00:00:00Z');
      const dow = d.getUTCDay(); // 0=Sun
      const sun = shiftDateStr(anchorDate, -dow);
      const labels = ['일', '월', '화', '수', '목', '금', '토'];
      return labels.map((day, i) => {
        const full = shiftDateStr(sun, i);
        return { day, date: Number(full.slice(8, 10)), fullDate: full };
      });
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // --- Parse URL Query (?name=김윤지&token=...&date=...) ---
    const urlParams = new URLSearchParams(window.location.search);
    const paramName = (urlParams.get('name') || urlParams.get('member') || '').trim();
    const paramToken = (urlParams.get('token') || '').trim();
    const requestedDate = urlParams.get('date') || '';
    const parsedDate = /^\d{4}-\d{2}-\d{2}$/.test(requestedDate) ? Date.parse(requestedDate + 'T00:00:00Z') : NaN;
    const paramDate = Number.isFinite(parsedDate) && new Date(parsedDate).toISOString().slice(0, 10) === requestedDate
      ? requestedDate : getTodayKST();
    const isLiveOrigin = ['https:', 'http:'].includes(window.location.protocol) &&
      !['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);

    // --- Exercise 10-Second Form Tips Library ---
    const FORM_TIPS = {
      '고블릿 스쿼트': {
        cue: '발바닥 3점 지지 · 팔꿈치가 무릎 안쪽을 스치듯 수직 하강',
        steps: [
          '덤벨/케틀벨을 명치 앞에 밀착해 상체가 앞으로 쏟아지지 않게 고정하세요.',
          '내려갈 때 3초 동안 무릎과 발끝 방향을 일치시키고 골반을 수직으로 앉힙니다.',
          '일어설 때 발뒤꿈치와 엄지발가락 뿌리로 바닥을 강하게 밀어 둔근을 수축하세요.'
        ],
        mistake: '무릎이 안쪽으로 모이거나 허리가 말리지 않도록 복압을 유지하세요.'
      },
      '루마니안 데드리프트': {
        cue: '정강이 고정 · 엉덩이를 뒤로 멀리 보내며 햄스트링 텐션 유지',
        steps: [
          '무릎을 살짝 구부린 각도를 고정한 채 고관절만 접어 상체를 숙입니다.',
          '바벨/덤벨이 허벅지와 정강이를 스치듯 내려가야 허리 부담이 없습니다.',
          '허벅지 뒤쪽이 팽팽해지는 지점에서 발바닥으로 바닥을 밀며 일어섭니다.'
        ],
        mistake: '등이 둥글게 말리면 중량을 낮추고 가동범위를 무릎 아래까지만 제한하세요.'
      },
      '데드버그': {
        cue: '허리 바닥 완전 밀착 · 날숨에 복부를 납작하게 잠그기',
        steps: [
          '등을 바닥에 대고 누워 허리와 바닥 사이 틈이 없도록 골반을 살짝 말아줍니다.',
          '입으로 길게 숨을 내쉬며 반대쪽 팔과 다리를 천천히 뻗어줍니다.',
          '허리가 바닥에서 뜨기 직전까지만 내렸다가 코어로 끌어당기듯 돌아옵니다.'
        ],
        mistake: '목이나 어깨에 힘이 들어가면 턱을 살짝 당기고 천천히 진행하세요.'
      }
    };

    function getFormTipForExercise(name) {
      const clean = String(name || '').replace(/\(.*?\)/g, '').trim();
      for (const key of Object.keys(FORM_TIPS)) {
        if (clean.includes(key) || key.includes(clean)) return { title: key, ...FORM_TIPS[key] };
      }
      return {
        title: clean || '맞춤 자세 가이드',
        cue: '호흡과 복압을 먼저 세팅한 뒤 천천히 컨트롤하며 수행하세요',
        steps: [
          '시작 자세에서 어깨를 내리고 코어에 힘을 주어 척추 중립을 유지합니다.',
          '내리는 동작(이완)을 2~3초간 천천히 버티며 타겟 근육의 자극을 느끼세요.',
          '밀거나 당기는 순간 숨을 내쉬며 반동 없이 목표 횟수를 채웁니다.'
        ],
        mistake: '관절에 날카로운 통증이 느껴지면 즉시 중단하고 코치에게 메모를 남겨주세요.'
      };
    }

    const MEALS = ['breakfast', 'lunch', 'dinner', 'snack'];
    const CHECKIN_PREFIX = '__FIT_DAILY_CHECKIN__:';
    const isObject = value => value !== null && typeof value === 'object' && !Array.isArray(value);
    const rows = value => Array.isArray(value) ? value.filter(isObject) : [];
    const number = value => Number.isFinite(Number(value)) ? Math.max(0, Number(value)) : 0;

    // --- App State ---
    const state = {
      isLive: false,
      loading: false,
      appMode: 'member', // 'member' | 'coach'
      memberTab: 'report', // 'report' | 'lesson' | 'diet' | 'body' | 'feedback'
      coachTab: 'workspace', // 'workspace' | 'members' | 'columns'
      coachSearch: '',
      coachFilter: 'attention',
      coachSelected: '',
      coachContext: null,
      coachDraft: null,
      memberName: paramName || '회원',
      token: paramToken,
      session: '',
      sessionExpires: 0,
      recordDate: '',
      memberError: '',
      saving: false,
      trainerPassword: '',
      selectedDate: paramDate,
      weekDays: buildWeekDays(paramDate),
      fabOpen: false,
      restTimerSeconds: 0,
      restTimerDuration: 60,
      restTimerInterval: null,
      activeColumnIdx: 0,
      targetKcal: 2100,

      record: normalizeRecord({}),
      insights: {},
      workoutDays: [],
      previousWeights: {},
      columns: [],
      trainerOverview: []
    };

    let sessionRequest;
    let latestMemberLoad = 0;
    let privacyAgreed = false;
    let modalVersion = 0;
    const canonicalDates = new Set();
    const photoCache = new Map();
    let pendingMemberMemo;

    async function post(endpoint, payload) {
      const response = await fetch(endpoint, {
        method: 'POST', cache: 'no-store',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok || !isObject(result) || ['denied', 'error'].includes(result.status)) {
        const error = new Error('request_failed');
        error.code = result?.code || (result?.status === 'denied' ? 'unauthorized' : '');
        error.status = response.status;
        throw error;
      }
      return result;
    }

    const postRecords = payload => post('/api/records', payload);
    const postAppsScript = payload => post('/api/apps-script', payload);

    async function successful(request) {
      const result = await request;
      if (result.status !== 'success') throw new Error('unconfirmed_write');
      return result;
    }

    function ensureMemberSession(date, rejectedSession) {
      if (rejectedSession && state.session === rejectedSession) {
        state.session = '';
        state.sessionExpires = 0;
      }
      if (state.session && state.sessionExpires > Date.now() + 30000) return Promise.resolve(state.session);
      if (!sessionRequest) {
        sessionRequest = successful(postRecords({ action: 'memberSession', member: state.memberName, token: state.token, date }))
          .then(result => {
            if (!result.session || !Number.isFinite(result.exp)) throw new Error('invalid_session_response');
            state.session = result.session;
            state.sessionExpires = result.exp;
            return state.session;
          }).finally(() => { sessionRequest = null; });
      }
      return sessionRequest;
    }

    async function memberRecords(payload) {
      const session = await ensureMemberSession(payload.date);
      try {
        return await postRecords({ member: state.memberName, ...payload, session });
      } catch (error) {
        if (error.code !== 'session_invalid') throw error;
        const renewed = await ensureMemberSession(payload.date, session);
        return postRecords({ member: state.memberName, ...payload, session: renewed });
      }
    }

    function credentials(date = state.selectedDate, member = state.memberName) {
      return state.appMode === 'coach'
        ? { date, member, password: state.trainerPassword }
        : { date, member, token: state.token };
    }

    async function readCanonical(auth) {
      return normalizeRecord(await postAppsScript({ action: 'read', ...auth }));
    }

    function failureText(error) {
      if (error?.status === 403 || ['unauthorized', 'session_invalid'].includes(error?.code)) {
        return '접근 권한을 확인해 주세요. 회원 전용 링크나 코치 로그인을 다시 확인해 주세요.';
      }
      return '서버 연결을 확인한 뒤 다시 시도해 주세요.';
    }

    async function saveAction(work, message, onSuccess = renderAll) {
      if (state.saving) return false;
      if (!isLiveOrigin || (state.appMode === 'member' && state.recordDate !== state.selectedDate) ||
          (state.appMode === 'coach' && !state.trainerPassword)) {
        showToast('기록을 불러오거나 로그인한 뒤 저장할 수 있어요.');
        return false;
      }
      state.saving = true;
      showToast('저장 중…');
      try {
        await work();
      } catch (error) {
        showToast(error.userMessage || '저장을 확인하지 못했어요. ' + failureText(error));
        return false;
      } finally {
        state.saving = false;
      }
      onSuccess();
      showToast(message);
      return true;
    }

    const PHOTO_MAX_BYTES = 1400000;

    async function compressMealPhoto(file) {
      const url = URL.createObjectURL(file);
      try {
        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = reject;
          img.src = url;
        });
        const ratio = Math.min(1, 900 / Math.max(image.naturalWidth, image.naturalHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(image.naturalWidth * ratio));
        canvas.height = Math.max(1, Math.round(image.naturalHeight * ratio));
        canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
        let blob;
        for (const quality of [0.78, 0.65, 0.52, 0.4]) {
          blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
          if (blob && blob.size <= 450000) break;
        }
        if (!blob || blob.type !== 'image/jpeg' || blob.size > PHOTO_MAX_BYTES) throw new Error('photo_size');
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result));
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    // --- Clipboard Helper ---
    async function copyTextToClipboard(text, toastMsg = '클립보드에 복사되었어요!') {
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        showToast(toastMsg);
      } catch {
        showToast('복사에 실패했어요');
      }
    }

    function normalizeMeal(value) {
      const meal = isObject(value) ? value : {};
      return { desc: '', cal: '', carb: '', prot: '', fat: '', ...meal,
        photos: Array.isArray(meal.photos) ? meal.photos.filter(Boolean) : [] };
    }

    function isCheckinMemo(memo) {
      return typeof memo.text === 'string' && memo.text.startsWith(CHECKIN_PREFIX);
    }

    function normalizeRecord(value) {
      const record = isObject(value) ? value : {};
      const memos = rows(record.memos);
      let dailyCheckin = isObject(record.dailyCheckin) ? record.dailyCheckin : {};
      for (const memo of memos.filter(isCheckinMemo).reverse()) {
        try {
          const parsed = JSON.parse(memo.text.slice(CHECKIN_PREFIX.length));
          if (isObject(parsed) && (!dailyCheckin.updatedAt || !parsed.updatedAt || parsed.updatedAt >= dailyCheckin.updatedAt)) {
            dailyCheckin = parsed;
          }
          break;
        } catch {}
      }
      const diet = { ...record.diet, water: number(record.diet?.water) };
      for (const meal of MEALS) diet[meal] = normalizeMeal(diet[meal]);
      return { ...record, headerMessage: record.headerMessage || '', routines: rows(record.routines).map(routine => ({ ...routine,
          completedSets: Array.isArray(routine.completedSets) ? routine.completedSets : [] })),
        reflection: { good: '', bad: '', ...record.reflection }, diet,
        feedback: { workout: '', diet: '', time: '', ...record.feedback }, memos, dailyCheckin };
    }

    async function initLiveMemberData() {
      if (isLiveOrigin && paramName && state.token) {
        if (checkPrivacyConsent()) await loadMemberDateData(state.selectedDate);
        else {
          state.memberError = '개인정보 수집 및 활용 동의를 확인해 주세요.';
          renderAll();
        }
      } else {
        state.memberError = '회원 전용 링크로 접속해 주세요.';
        renderAll();
      }
    }

    async function loadMemberDateData(date) {
      const request = ++latestMemberLoad;
      state.recordDate = '';
      state.memberError = '';
      state.loading = true;
      state.isLive = false;
      state.record = normalizeRecord({});
      state.insights = {};
      state.columns = [];
      state.workoutDays = [];
      state.previousWeights = {};
      renderAll();
      const auth = credentials(date);
      const current = () => request === latestMemberLoad && date === state.selectedDate && state.appMode === 'member';
      try {
        const daily = canonicalDates.has(date) ? readCanonical(auth) :
          memberRecords({ action: 'read', date }).then(normalizeRecord).catch(error => {
            if (error.status === 403 && error.code !== 'member_not_found') throw error;
            return readCanonical(auth);
          });
        const extras = Promise.allSettled([
          memberRecords({ action: 'memberInsights', date }),
          memberRecords({ action: 'columnList', date }),
          memberRecords({ action: 'workoutHistory', date, month: date.slice(0, 7) })
        ]).then(([insights, columns, history]) => {
          if (!current()) return;
          if (insights.value?.status === 'success') state.insights = insights.value;
          if (columns.value?.status === 'success') state.columns = rows(columns.value.columns);
          if (history.value?.status === 'success') {
            state.workoutDays = Array.isArray(history.value.days) ? history.value.days : [];
            state.previousWeights = isObject(history.value.previous) ? history.value.previous : {};
          }
        });
        const [record] = await Promise.all([daily, extras]);
        if (!current()) return;
        state.record = record;
        state.recordDate = date;
        state.isLive = true;
      } catch (error) {
        if (current()) state.memberError = '기록을 불러오지 못했어요. ' + failureText(error);
      } finally {
        if (current()) {
          state.loading = false;
          renderAll();
        }
      }
    }

    function applyMemberRecord(auth, record) {
      if (state.appMode === 'member' && auth.member === state.memberName && auth.date === state.recordDate) {
        state.record = normalizeRecord(record);
      }
    }

    async function savePatchLive(patch, auth = credentials()) {
      const result = await successful(postAppsScript({ action: 'patchData', ...auth, patch }));
      if (auth.token) canonicalDates.add(auth.date);
      if (auth.token) applyMemberRecord(auth, isObject(result.data) ? result.data : await readCanonical(auth));
      return result;
    }

    async function saveDailyCheckinLive(field, value) {
      const auth = credentials();
      const latest = await readCanonical(auth);
      const checkin = { ...latest.dailyCheckin, [field]: value, updatedAt: new Date().toISOString() };
      await savePatchLive({ memos: [{ id: 'checkin-' + auth.date + '-' + crypto.randomUUID(), from: 'member',
        text: CHECKIN_PREFIX + JSON.stringify(checkin), time: nowTimeHHMM() }] }, auth);
      if (field === 'workout' && value === 'done' && !state.workoutDays.includes(auth.date)) state.workoutDays.push(auth.date);
      // Sheets is authoritative. The Worker update is a best-effort mirror.
      void memberRecords({ action: 'dailyCheckin', date: auth.date, checkin: { [field]: value } }).catch(() => {});
    }

    function setCount(routine) {
      const count = Number(routine.sets);
      return Number.isInteger(count) && count >= 1 && count <= 100 ? count : 0;
    }

    async function saveSetProgress(routine, indexes, checked) {
      if (routine.id === undefined || !indexes.length) throw new Error('invalid_routine');
      const auth = credentials();
      await successful(postAppsScript({ action: 'setProgressBatch', ...auth,
        changes: indexes.map(index => ({ id: routine.id, index, checked })) }));
      canonicalDates.add(auth.date);
      const saved = state.record.routines.find(item => item.id === routine.id);
      if (saved) {
        const completed = Array.isArray(saved.completedSets) ? [...saved.completedSets] : [];
        for (const index of indexes) completed[index] = checked;
        saved.completedSets = completed;
        if (checked && !state.workoutDays.includes(auth.date)) state.workoutDays.push(auth.date);
      }
    }

    function safePhotoSource(value) {
      return typeof value === 'string' && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(value)
        ? value : '';
    }

    function hydrateMealPhotos(root, auth) {
      root.querySelectorAll('img[data-fit-photo-id]').forEach(async img => {
        const fileId = img.dataset.fitPhotoId;
        const meal = img.dataset.fitPhotoMeal;
        const key = JSON.stringify([auth.member, auth.date, meal, fileId]);
        try {
          if (!photoCache.has(key)) {
            if (photoCache.size >= 32) photoCache.delete(photoCache.keys().next().value);
            photoCache.set(key, successful(postAppsScript({ action: 'photo', ...auth, fileId, meal }))
              .then(result => {
                const src = safePhotoSource('data:' + result.mime + ';base64,' + result.base64);
                if (!src) throw new Error('invalid_photo');
                return src;
              }));
          }
          const src = await photoCache.get(key);
          if (img.isConnected) img.src = src;
        } catch {
          photoCache.delete(key);
          if (img.isConnected) img.alt = '식단 사진을 불러오지 못했어요';
        }
      });
    }

    function mealPhotoMarkup(photo, meal, className) {
      const src = safePhotoSource(photo);
      const id = isObject(photo) && typeof photo.fileId === 'string' ? photo.fileId : '';
      if (!src && !id) return '';
      return `<img ${src ? `src="${escapeHtml(src)}"` :
        `data-fit-photo-id="${escapeHtml(id)}" data-fit-photo-meal="${escapeHtml(meal)}"`}
        class="${className}" alt="식단 사진" loading="lazy" />`;
    }

      }, 4000);

    function triggerConfetti() {
      const colors = ['#3B82F6', '#2DD4BF', '#60A5FA', '#F59E0B', '#FFFFFF'];
      for (let i = 0; i < 20; i++) {
        const dot = document.createElement('div');
        dot.className = 'confetti-dot';
        dot.style.background = colors[i % colors.length];
        dot.style.left = (45 + (Math.random() * 10 - 5)) + '%';
        dot.style.top = '18%';
        dot.style.setProperty('--tx', ((Math.random() - 0.5) * 220) + 'px');
        dot.style.setProperty('--ty', (Math.random() * 160 - 40) + 'px');
        document.body.appendChild(dot);
        setTimeout(() => dot.remove(), 950);
      }
    }

    function startRestTimer(sec) {
      if (state.restTimerInterval) {
        clearInterval(state.restTimerInterval);
        state.restTimerInterval = null;
      }
      state.restTimerDuration = sec;
      state.restTimerSeconds = sec;
      renderAll();
      state.restTimerInterval = setInterval(() => {
        state.restTimerSeconds -= 1;
        if (state.restTimerSeconds <= 0) {
          clearInterval(state.restTimerInterval);
          state.restTimerInterval = null;
          state.restTimerSeconds = 0;
          showToast(`${sec}초 휴식 끝! 다음 세트 시작해볼까요?`);
          triggerConfetti();
          renderAll();
          return;
        }
        const badge = document.getElementById('rest-timer-live');

    // --- Metrics Computation ---
    function getWorkoutRate() {
      const rs = state.record.routines || [];
      if (!rs.length) return { done: 0, total: 0, pct: 0 };
      const done = rs.filter(r => Array.isArray(r.completedSets) && r.completedSets.some(Boolean)).length;
      return { done, total: rs.length, pct: Math.round((done / rs.length) * 100) };
    }

    function getDietStats() {
      const d = state.record.diet || {};
      const keys = ['breakfast', 'lunch', 'dinner', 'snack'];
      let kcal = 0, carb = 0, prot = 0, fat = 0, loggedCount = 0, photoCount = 0;
      keys.forEach(k => {
        const m = d[k] || {};
        const c = number(m.cal);
        const hasPhoto = Array.isArray(m.photos) && m.photos.length > 0;
        if (hasPhoto) photoCount += m.photos.length;
        if (c > 0 || String(m.desc || '').trim() || hasPhoto) loggedCount++;
        kcal += c;
        carb += number(m.carb);
        prot += number(m.prot);
        fat += number(m.fat);
      });
      const macroSum = carb + prot + fat;
      return {
        kcal,
        pct: Math.min(100, Math.round((kcal / state.targetKcal) * 100)),
        loggedCount,
        photoCount,
        carbPct: macroSum ? Math.round((carb / macroSum) * 100) : 45,
        protPct: macroSum ? Math.round((prot / macroSum) * 100) : 35,
        fatPct: macroSum ? Math.round((fat / macroSum) * 100) : 20,
        water: Number(d.water) || 0
      };
    }

    function computeCareScore() {
      const wr = getWorkoutRate();
      const ds = getDietStats();
      const chk = state.record.dailyCheckin || {};
      const weekDays = state.insights?.careSummary?.workoutDays || 0;
      let score = 55 + Math.min(20, weekDays * 6) + Math.round(wr.pct * 0.15);
      if (chk.workout === 'done') score += 5;
      if (chk.diet === 'done') score += 4;
      if (ds.loggedCount > 0) score += 3;
      return Math.min(100, score);
    }

    function heroRingsSvg(scorePct, kcalPct, routinePct) {
      const rings = [
        { r: 44, pct: scorePct, color: '#60A5FA', track: 'rgba(255,255,255,0.16)' },
        { r: 33, pct: Math.max(8, kcalPct), color: '#5EEAD4', track: 'rgba(255,255,255,0.14)' },
        { r: 22, pct: Math.max(8, routinePct), color: '#FFFFFF', track: 'rgba(255,255,255,0.12)' }
      ];
      return `
        <svg width="106" height="106" class="-rotate-90" viewBox="0 0 106 106">
          ${rings.map(ring => {
            const circ = 2 * Math.PI * ring.r;
            const offset = circ - (Math.min(100, ring.pct) / 100) * circ;
            return `
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.track}" stroke-width="7.5"/>
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="7.5" stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
            `;
          }).join('')}
        </svg>
      `;
    }

    function miniRing(pct) {
      const r = 16;
      const c = 2 * Math.PI * r;
      const offset = c - (Math.min(100, pct) / 100) * c;
      return `
        <svg width="42" height="42" class="-rotate-90" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4.5"/>
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"
            stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
        </svg>
      `;
    }

    // --- Weekly Workout Rhythm SVG Curve (linked to workoutDays) ---
    function renderWeeklyRhythmSvg() {
      const wr = getWorkoutRate();
      const chk = state.record.dailyCheckin || {};
      const pts = state.weekDays.map((d, idx) => {
        const isSelected = d.fullDate === state.selectedDate;
        const inHistory = state.workoutDays.includes(d.fullDate);
        const activeToday = isSelected && (wr.done > 0 || chk.workout === 'done');
        const active = inHistory || activeToday;
        const x = 22 + idx * 46;
        // Compute rhythm height: active days rise smoothly, selected day reflects completion
        const y = active ? (isSelected ? Math.max(16, 44 - Math.round(wr.pct * 0.26)) : 20) : 56;
        return { ...d, x, y, active, isSelected };
      });

      let dPath = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const cx = ((pts[i].x + pts[i + 1].x) / 2).toFixed(1);
        dPath += ` C ${cx} ${pts[i].y}, ${cx} ${pts[i + 1].y}, ${pts[i + 1].x} ${pts[i + 1].y}`;
      }
      const areaPath = `${dPath} L ${pts[pts.length - 1].x} 72 L ${pts[0].x} 72 Z`;
      const activeCount = pts.filter(p => p.active).length;

      return `
        <section class="bg-white rounded-[24px] p-5 shadow-[0_4px_20px_rgba(15,23,42,0.04)]">
          <div class="flex items-center justify-between mb-2">
            <div>
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-[#1D4ED8]">WEEKLY RHYTHM</span>
              <h2 class="text-[16px] font-bold text-[#111827]">주간 운동 리듬</h2>
            </div>
            <span class="text-[12px] font-extrabold px-2.5 py-1 rounded-full bg-[#EFF6FF] text-[#1D4ED8]">이번 주 ${activeCount}일 활성화</span>
          </div>
          <svg viewBox="0 0 320 92" class="w-full h-24 overflow-visible">
            <defs>
              <linearGradient id="rhythmGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
                <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.0"/>
              </linearGradient>
            </defs>
            <line x1="16" y1="22" x2="304" y2="22" stroke="#F1F5F9" stroke-width="1" stroke-dasharray="3 3"/>
            <line x1="16" y1="56" x2="304" y2="56" stroke="#F1F5F9" stroke-width="1"/>
            <path d="${areaPath}" fill="url(#rhythmGrad)"/>
            <path d="${dPath}" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round"/>
            ${pts.map(p => `
              <g>
                <circle cx="${p.x}" cy="${p.y}" r="${p.isSelected ? 5.5 : (p.active ? 4.2 : 3)}"
                  fill="${p.active ? '#1D4ED8' : '#CBD5E1'}" stroke="#FFFFFF" stroke-width="2"/>
                <text x="${p.x}" y="86" text-anchor="middle" font-size="10" font-weight="${p.isSelected ? '800' : '600'}"
                  fill="${p.isSelected ? '#1D4ED8' : '#64748B'}">${p.day}</text>
              </g>
            `).join('')}
          </svg>
        </section>
      `;
    }

      hydrateMealPhotos(form, auth);
      form.querySelectorAll('[data-meal-preset]').forEach(option => {
        option.addEventListener('click', () => {
          if (state.saving) return;

          document.getElementById('mf-desc').value = preset.desc;
          document.getElementById('mf-cal').value = preset.cal;
        });
      });

      input.addEventListener('change', async () => {
        const file = input.files?.[0];
        pendingPhoto = '';
        preview.hidden = true;
        preview.removeAttribute('src');
        if (!file) return;
        compressing = true;
        input.disabled = button.disabled = true;
        try {
          pendingPhoto = await compressMealPhoto(file);
          if (!form.isConnected) return;
          preview.src = pendingPhoto;
          preview.hidden = false;
        } catch {
          if (form.isConnected) showToast('사진을 열거나 압축할 수 없어요. JPEG 또는 PNG 사진을 선택해 주세요.');
          input.value = '';
        } finally {
          compressing = false;
          input.disabled = button.disabled = false;
        }
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (compressing || state.saving) return;
        const desc = document.getElementById('mf-desc').value.trim();
        const cal = document.getElementById('mf-cal').value.trim();
        input.disabled = button.disabled = true;
        try {
          await saveAction(async () => {
            const latest = await readCanonical(auth);
            const { carb, prot, fat } = preset?.desc === desc && preset.cal === cal ? preset : latest.diet[meal];
            if (desc !== String(latest.diet[meal].desc ?? '') || cal !== String(latest.diet[meal].cal ?? '') || preset?.desc === desc) {

            if (pendingPhoto) {
              try {
                await successful(postAppsScript({ action: 'uploadPhoto', ...auth, meal,

              canonicalDates.add(auth.date);
              const refreshed = await readCanonical(auth).catch(() => null);
              if (refreshed) applyMemberRecord(auth, refreshed);
            }
          }, mealLabel + ' 기록을 저장했어요.', () => { closeModal(); renderAll(); });
        } finally {
          input.disabled = button.disabled = false;
        }
      });
    }

    // --- Coach Features: Load Member Context for Briefing / Log / Diet Reply ---
    async function fetchMemberContextForCoach(memberName) {
      const auth = credentials(state.selectedDate, memberName);
      if (!auth.password) return null;
      const version = modalVersion;
      try {
        const [record, history] = await Promise.all([
          readCanonical(auth),
          postRecords({ action: 'workoutHistory', ...auth, month: auth.date.slice(0, 7) }).catch(() => null)
        ]);
        if (state.appMode !== 'coach' || auth.password !== state.trainerPassword ||
            state.selectedDate !== auth.date || version !== modalVersion) return null;
        return { record, previous: isObject(history?.previous) ? history.previous : {}, auth };
      } catch (error) {
        showToast('회원 기록을 불러오지 못했어요. ' + failureText(error));
        return null;
      }
    }

    // The overview response is intentionally small. Hydrate only the check-in
    // indicator afterwards so the scan list can show each member's condition.
    async function hydrateCoachCheckins() {
      const date = state.selectedDate;
      const password = state.trainerPassword;
      const members = [...state.trainerOverview];
      const results = await Promise.all(members.map(async member => {
        try {
          const record = await readCanonical({ date, member: member.name, password });
          return { name: member.name, dailyCheckin: record.dailyCheckin || {} };
        } catch { return null; }
      }));
      if (state.appMode !== 'coach' || state.selectedDate !== date || state.trainerPassword !== password) return;
      results.filter(Boolean).forEach(result => {
        const member = state.trainerOverview.find(item => item.name === result.name);
        if (member) member.dailyCheckin = result.dailyCheckin;
      });
      renderAll();
    }

          }
        };
        rec.onerror = () => showToast('음성 인식에 실패했어요');
        rec.onend = () => { voiceBtn.textContent = '🎙️ 음성 입력'; };
        rec.start();
      });

      document.getElementById('btn-publish-qlog').addEventListener('click', async () => {
        const msg = document.getElementById('qlog-comment').value.trim();
        const changes = draftRoutines.filter(r => originalWeights.get(String(r.id)) !== r.weight);
        if (!msg) {
          showToast('회원에게 전달할 수업 총평을 입력해 주세요.');
          return;
        }
        await saveAction(async () => {
          const latest = await readCanonical(ctx.auth);
          const weights = new Map(changes.map(r => [String(r.id), r.weight]));
          if (changes.some(change => !latest.routines.some(r => String(r.id) === String(change.id) &&
              String(number(r.weight)) === originalWeights.get(String(r.id))))) {
            const error = new Error('routine_changed');
            error.userMessage = '루틴이 다른 화면에서 바뀌었어요. 일지를 다시 열어 최신 중량을 확인해 주세요.';
            throw error;
          }
          const feedback = { ...latest.feedback, workout: msg, time: nowTimeHHMM() };
          if (weights.size) {
            const routines = latest.routines.map(r => weights.has(String(r.id)) ? { ...r, weight: weights.get(String(r.id)) } : r);
            await successful(postAppsScript({ ...ctx.auth, data: { routines, headerMessage: msg, feedback } }));
          } else {
            await savePatchLive({ headerMessage: msg, feedback }, ctx.auth);
          }
          canonicalDates.add(ctx.auth.date);
          const item = state.trainerOverview.find(m => m.name === memberName);
          if (item) { item.pendingWorkout = false; item.feedbackDone = true; }
        }, '수업일지를 저장했어요.', () => { closeModal(); renderAll(); });
      });
    }

    // --- Coach View (4 Tabs: 오늘현황 · 전체회원 · 식단답장 · 잠수케어) ---
    function coachPriority(member) {
      const workout = Boolean(member.pendingWorkout);
      const diet = Boolean(member.pendingDiet);
      const gap = member.lastDate ? daysBetween(member.lastDate, state.selectedDate) : 99;
      const score = (workout ? 8 : 0) + (diet ? 5 : 0) + (member.activeToday ? 2 : 0) + Math.min(gap, 4);
      const actions = [workout ? '수업 피드백' : '', diet ? '식단 답장' : ''].filter(Boolean);
      return {
        score,
        gap,
        actions,
        label: actions.length ? actions.join(' · ') + ' 필요' : member.activeToday ? '오늘 기록 확인' : '확인 완료',
        tone: actions.length ? 'bg-amber-50 text-amber-700' : member.activeToday ? 'bg-[#EFF6FF] text-[#1D4ED8]' : 'bg-[#F0FDFA] text-[#0F766E]'
      };
    }

    function coachQueue(members) {
      return [...members].sort((a, b) => {
        const priority = coachPriority(b).score - coachPriority(a).score;
        return priority || String(a.name || '').localeCompare(String(b.name || ''), 'ko');
      });
    }

    function renderCoachMemberCard(m, featured = false) {
      const inactiveDays = m.lastDate ? daysBetween(m.lastDate, state.selectedDate) : 14;
      const priority = coachPriority(m);
      return `
        <article class="bg-white rounded-[22px] ${featured ? 'p-5 ring-2 ring-[#1D4ED8]/15 shadow-[0_12px_26px_rgba(30,58,138,0.12)]' : 'p-4 shadow-sm'} space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-[16px] font-extrabold text-[#111827]">${escapeHtml(m.name)}</span>
                ${featured ? '<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-[#1D4ED8] text-white">지금 확인</span>' : ''}
              </div>
              <p class="text-[12px] text-[#6B7280] mt-1">${escapeHtml(priority.label)} · 최근 ${escapeHtml(m.lastDate || '기록 없음')}${inactiveDays >= 3 ? ` (${inactiveDays}일 전)` : ''}</p>
            </div>
            <span class="shrink-0 text-[11px] font-bold px-2.5 py-1 rounded-full ${priority.tone}">
              ${priority.actions.length || m.activeToday ? '확인' : '완료'}
            </span>

    function openCoachDietReplyModal(memberName) {
      const presets = [
        '단백질과 탄수화물 비율이 좋아요. 다음 끼니에도 단백질을 챙겨주세요.',
        '식사 간격이 좋습니다. 오늘 수분 500ml만 더 챙겨볼까요?',
        '오늘 식단 잘 기록했어요. 내일도 같은 흐름으로 이어가 봅시다.'
      ];
      openModal(`${memberName} 회원님 식단 답장`, `
        <form id="coach-diet-reply-form" class="space-y-3">
          <p class="text-[12px] text-[#6B7280]">답장은 회원님의 식단 피드백에 바로 저장됩니다.</p>
          <div class="flex flex-wrap gap-2">
            ${presets.map((text, index) => `<button type="button" data-diet-preset="${index}" class="rounded-xl bg-[#ECFDF5] px-3 py-2 text-[11px] font-bold text-[#0F766E]">추천 ${index + 1}</button>`).join('')}
          </div>
          <textarea id="coach-diet-reply" required rows="4" maxlength="5000" placeholder="회원님께 전달할 식단 피드백" class="w-full rounded-2xl bg-[#F4F6F9] p-3 text-base"></textarea>
          <button type="submit" class="w-full rounded-2xl bg-[#0F766E] py-3 text-sm font-extrabold text-white">식단 답장 저장</button>
        </form>
      `);
      document.querySelectorAll('[data-diet-preset]').forEach(button => {
        button.addEventListener('click', () => {
          document.getElementById('coach-diet-reply').value = presets[Number(button.dataset.dietPreset)];
        });
      });
      document.getElementById('coach-diet-reply-form').addEventListener('submit', async event => {
        event.preventDefault();
        const message = document.getElementById('coach-diet-reply').value.trim();
        if (!message) return;
        const saved = await sendCoachDietFeedback(memberName, message);
        if (saved) closeModal();
      });
    }

    async function sendCoachDietFeedback(memberName, replyText) {
      if (!replyText) return;
      const auth = credentials(state.selectedDate, memberName);
      return saveAction(async () => {
        const latest = await readCanonical(auth);
        await savePatchLive({ feedback: { ...latest.feedback, diet: replyText, time: nowTimeHHMM() } }, auth);
        canonicalDates.add(auth.date);
        const item = state.trainerOverview.find(m => m.name === memberName);
        if (item) { item.pendingDiet = false; item.feedbackDone = true; }
      }, memberName + ' 회원님 식단 답장을 저장했어요.');
    }

    async function saveCoachWorkspaceDetail() {
      const context = state.coachContext;
      if (!context || !state.coachDraft) return;
      const workout = document.getElementById('coach-workout-feedback')?.value.trim() || '';
      const diet = document.getElementById('coach-diet-feedback')?.value.trim() || '';
      const memoText = document.getElementById('coach-memo-reply')?.value.trim() || '';
      await saveAction(async () => {
        const latest = await readCanonical(context.auth);
        const feedback = { ...latest.feedback, workout, diet, time: nowTimeHHMM() };
        const changed = state.coachDraft.routines.some((item, index) => String(item.weight) !== String(latest.routines[index]?.weight ?? ''));
        const memo = memoText ? { id: 'coach-' + crypto.randomUUID(), from: 'trainer', text: memoText, time: nowTimeHHMM() } : null;
        if (changed) {
          const data = { routines: state.coachDraft.routines, headerMessage: workout, feedback };
          if (memo) data.memos = [...latest.memos, memo];
          await successful(postAppsScript({ ...context.auth, data }));
        } else {
          const patch = { headerMessage: workout, feedback };
          if (memo) patch.memos = [memo];
          await savePatchLive(patch, context.auth);
        }
        canonicalDates.add(context.auth.date);
        const item = state.trainerOverview.find(member => member.name === state.coachSelected);
        if (item) { item.pendingWorkout = false; item.pendingDiet = false; item.feedbackDone = true; }
        state.coachContext.record = normalizeRecord({ ...latest, headerMessage: workout, feedback,
          routines: state.coachDraft.routines, memos: memo ? [...latest.memos, memo] : latest.memos });
      }, state.coachSelected + ' 회원님 피드백을 발행했어요.', renderAll);
    }

    function openCoachColumnEditor(column) {
      const editing = isObject(column);
      const current = editing ? column : { category: '트레이닝', title: '', summary: '', content: [], author: '신명진 코치', published_at: state.selectedDate };
      openModal(editing ? '매거진 칼럼 수정' : '새 매거진 칼럼 발행', `<form id="workspace-column-form" class="space-y-3">
        <select id="workspace-column-category" class="w-full rounded-xl bg-[#F4F6F9] p-3 text-sm"><option ${current.category === '트레이닝' ? 'selected' : ''}>트레이닝</option><option ${current.category === '영양/식단' ? 'selected' : ''}>영양/식단</option><option ${current.category === '회복/습관' ? 'selected' : ''}>회복/습관</option></select>
        <input id="workspace-column-title" required minlength="3" maxlength="90" value="${escapeHtml(current.title)}" placeholder="칼럼 제목" class="w-full rounded-xl bg-[#F4F6F9] p-3 text-sm" />
        <input id="workspace-column-summary" required minlength="10" maxlength="280" value="${escapeHtml(current.summary)}" placeholder="한줄 요약" class="w-full rounded-xl bg-[#F4F6F9] p-3 text-sm" />
        <textarea id="workspace-column-content" required rows="6" placeholder="본문을 줄바꿈으로 나눠 입력하세요" class="w-full rounded-xl bg-[#F4F6F9] p-3 text-sm">${escapeHtml(rows(current.content).join('\n'))}</textarea>
        <button type="submit" class="w-full rounded-xl hero-navy py-3.5 text-sm font-extrabold text-white">${editing ? '수정 저장' : '즉시 발행'}</button></form>`);
      document.getElementById('workspace-column-form').addEventListener('submit', async event => {
        event.preventDefault();
        const title = document.getElementById('workspace-column-title').value.trim();
        const summary = document.getElementById('workspace-column-summary').value.trim();
        const content = document.getElementById('workspace-column-content').value.split('\n').map(value => value.trim()).filter(Boolean).slice(0, 6);
        if (title.length < 3 || summary.length < 10 || !content.length) return showToast('제목, 요약, 본문을 확인해 주세요.');
        const saved = await saveAction(async () => {
          const result = await successful(postRecords({ action: 'columnSave', password: state.trainerPassword, date: state.selectedDate,
            column: { ...current, category: document.getElementById('workspace-column-category').value, title, summary, content,
              author: current.author || '신명진 코치', published_at: current.published_at || state.selectedDate } }));
          if (!isObject(result.column)) throw new Error('column_save_failed');
          const index = state.columns.findIndex(item => item.id === result.column.id);
          if (index >= 0) state.columns.splice(index, 1, result.column); else state.columns.unshift(result.column);
        }, editing ? '칼럼을 수정했어요.' : '새 칼럼을 발행했어요.', () => { closeModal(); renderAll(); });
        return saved;
      });
    }

        button.addEventListener('click', () => {
          const member = button.dataset.mname;
          const auth = credentials(state.selectedDate, member);
          const memo = { id: 'care-' + crypto.randomUUID(), from: 'trainer', text: button.dataset.msg, time: nowTimeHHMM() };
          void saveAction(() => savePatchLive({ memos: [memo] }, auth), member + ' 회원님께 안부 메모를 보냈어요.');
        });
      });
    }

    // FAB listeners
    document.getElementById('fab-toggle').addEventListener('click', () => { state.fabOpen = !state.fabOpen; updateFabUI(); });
    document.getElementById('fab-diet').addEventListener('click', () => {
      state.fabOpen = false;
      updateFabUI();
      openMealModal('lunch', '점심');
    });
    document.getElementById('fab-water').addEventListener('click', () => {
      state.fabOpen = false;
      updateFabUI();
      const auth = credentials();
      void saveAction(async () => {
        const latest = await readCanonical(auth);
        await savePatchLive({ diet: { water: latest.diet.water + 500 } }, auth);
      }, '물 500ml를 추가했어요.');
    });
    document.getElementById('fab-memo').addEventListener('click', () => {
      state.fabOpen = false;
      state.memberTab = 'feedback';
      renderAll();
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    // Privacy Consent listener
    document.getElementById('btn-consent-agree').addEventListener('click', () => {
      try {
        localStorage.setItem('fit_connect_privacy_consent_v2', 'agreed');
      } catch {}
      const el = document.getElementById('consent-backdrop');
      el.classList.add('hidden');
      el.classList.remove('flex');
      document.body.classList.remove('sheet-open');
      privacyAgreed = true;
      void initLiveMemberData();
    });

    window.addEventListener('pagehide', () => {
      const password = document.getElementById('coach-pw');
      if (password) password.value = '';
      state.trainerPassword = '';
      state.trainerOverview = [];
      photoCache.clear();
      if (state.appMode === 'coach') {
        state.appMode = 'member';
        document.getElementById('main-content').replaceChildren();
        document.getElementById('modal-body').replaceChildren();
      }
    });
    window.addEventListener('pageshow', event => {
      if (!event.persisted) return;
      state.saving = false;
      closeModal();
      void initLiveMemberData();
    });

    initLiveMemberData();
  </script>
</body>
</html>
