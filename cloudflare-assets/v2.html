<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIT-CONNECT</title>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #E2E6EE;
      color: #111827;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.02em;
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hero-navy {
      background:
        radial-gradient(circle at 88% 18%, rgba(56, 189, 248, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 12% 90%, rgba(20, 184, 166, 0.18) 0%, transparent 40%),
        linear-gradient(135deg, #0B132B 0%, #1E3A8A 58%, #2563EB 100%);
    }
    .card-blue { background: linear-gradient(145deg, #1D4ED8 0%, #3B82F6 100%); }
    .card-teal { background: linear-gradient(145deg, #0F766E 0%, #14B8A6 100%); }
    .tap-scale { transition: transform 0.13s ease, background-color 0.16s ease, box-shadow 0.16s ease; }
    .tap-scale:active { transform: scale(0.975); }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .confetti-dot {
      position: fixed;
      width: 7px;
      height: 7px;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 60;
      animation: confettiFall 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.4); }
    }
    .skeleton {
      background: linear-gradient(90deg, #E5E7EB 25%, #F3F4F6 50%, #E5E7EB 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#E2E6EE] text-[#111827]">

  <script>
    // --- Date & Clipboard Helpers ---
    function getTodayKST() {
      const now = new Date();
      return new Date(now.getTime() + 9 * 3600000).toISOString().slice(0, 10);
    }
    function shiftDateStr(dateStr, offset) {
      const d = new Date(dateStr + 'T00:00:00Z');
      d.setUTCDate(d.getUTCDate() + offset);
      return d.toISOString().slice(0, 10);
    }
    function daysBetween(olderStr, newerStr) {
      if (!olderStr) return 99;
      const a = new Date(olderStr + 'T00:00:00Z').getTime();
      const b = new Date(newerStr + 'T00:00:00Z').getTime();
      return Math.floor((b - a) / 86400000);
    }
    function nowTimeHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function formatMMSS(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }
    function buildWeekDays(anchorDate) {
      const d = new Date(anchorDate + 'T00:00:00Z');
      const sun = shiftDateStr(anchorDate, -d.getUTCDay());
      const labels = ['일', '월', '화', '수', '목', '금', '토'];
      return labels.map((day, i) => {
        const full = shiftDateStr(sun, i);
        return { day, date: Number(full.slice(8, 10)), fullDate: full };
      });
    }
    function copyTextSafe(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      ta.remove();
    }
    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const DAILY_COACH_TIPS = [
      '[운동] 중량을 올리는 것보다 내려놓는(신장성) 3초를 통제할 때 근섬유 자극이 가장 선명하게 들어갑니다.',
      '[운동] 코어 복압을 먼저 채우고 움직이면 허리 개입은 줄고 목표 부위 가동범위가 훨씬 안정적으로 나옵니다.',
      '[운동] 하체 루틴 시 엄지·새끼발가락·뒤꿈치 3점 지지를 유지하면 무릎 흔들림 없이 고관절에 정확히 실립니다.',
      '[운동] 마지막 2회가 살짝 버겁지만 폼이 무너지지 않는 강도(RIR 2)가 오늘 가장 이상적인 자극입니다.',
      '[다이어트] 식사 전 물 한 컵과 채소부터 먼저 드시면 혈당 스파이크가 완만해져 포만감이 오래 유지됩니다.',
      '[다이어트] 전날 짠 음식을 드셨다면 끼니를 굶지 말고 수분 2L와 채소 섭취로 나트륨 배출을 도와주세요.',
      '[다이어트] 단백질은 한 끼에 몰아먹기보다 3~4끼에 나누어 섭취해야 근합성과 포만감을 하루 종일 유지할 수 있습니다.',
      '[일상] 식후 10~15분 가벼운 산책만으로도 혈당이 근육으로 빠르게 쓰여 체지방 축적을 크게 줄여줍니다.',
      '[일상] 수면이 6시간 미만이면 식욕 호르몬(그렐린)이 올라가 가짜 허기가 생깁니다. 오늘은 30분 일찍 주무셔보세요.',

    ];

    function getDailyCoachTip(dateStr) {
      const s = String(dateStr || getTodayKST());
      let sum = 0;
      for (let i = 0; i < s.length; i++) sum += s.charCodeAt(i) * (i + 1);
      return DAILY_COACH_TIPS[sum % DAILY_COACH_TIPS.length];
    }

    // Client-side Image Compression (<= 900px JPEG for fast mobile upload)
    function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxW = 900;
            const scale = img.width > maxW ? maxW / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.72));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Web Audio API Beep for Timer End
    function playTimerBeep() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const ctx = new AC();
        [0, 0.22, 0.44].forEach(offset => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime + offset);
          gain.gain.setValueAtTime(0.16, ctx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + offset + 0.16);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + offset);
          osc.stop(ctx.currentTime + offset + 0.17);
        });
      } catch {}
    }

    const urlParams = new URLSearchParams(window.location.search);
    const paramName = (urlParams.get('name') || urlParams.get('member') || '').trim();
    const paramToken = (urlParams.get('token') || '').trim();
    const paramDate = /^\d{4}-\d{2}-\d{2}$/.test(urlParams.get('date') || '') ? urlParams.get('date') : getTodayKST();
    const isLiveOrigin = window.location.protocol.startsWith('http') && !window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1');

        autoStartOnCheck: true,
        customMin: 1,
        customSec: 0
      },

      // Plate Calculator State
      plateCalc: {
        targetWeight: 60,
        barWeight: 20
      },

      // Member feedback reaction (local persisted per member+date)
      feedbackReaction: '',

      record: {
        headerMessage: '',
        routines: [
          { id: 1, routineType: 'pt', name: '고블릿 스쿼트', weight: '16', sets: '4', reps: '12', note: '발바닥 3점 지지, 3초 천천히 하강', completedSets: [true, true, true, true] },
          { id: 2, routineType: 'pt', name: '루마니안 데드리프트', weight: '30', sets: '4', reps: '10', note: '무릎 고정하고 엉덩이 뒤로 밀기', completedSets: [true, true, true, true] },
          { id: 3, routineType: 'homework', name: '데드버그', weight: '', sets: '3', reps: '12', note: '허리 바닥 밀착 호흡', completedSets: [false, false, false] }
        ],
        reflection: { good: '', bad: '' },
        diet: {
          breakfast: { desc: '그릭요거트 · 삶은계란 2개 · 사과', cal: '480', carb: '45', prot: '28', fat: '12', photos: [] },
          lunch: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
          dinner: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
          snack: { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
          water: 1000
        },
        feedback: { workout: '', diet: '', time: '' },
        memos: [
          { id: 'm1', from: 'trainer', text: '지난 수업일지 정리해 올렸어요. 오늘 개인 루틴 체크 후 특이사항이 있으면 남겨주세요.', time: '14:10' }

      insights: {

          content: [
            '수업 외 개인 운동 시 루틴이 길어지면 집중력이 떨어져 자세가 무너지기 쉽습니다.',

    // Load local preferences (timer prefs, reaction, water fallback)
    function loadLocalMemberExtras() {
      try {
        const tp = localStorage.getItem('fit_timer_prefs_v2');
        if (tp) {
          const parsed = JSON.parse(tp);
          if (typeof parsed.customMin === 'number') state.timer.customMin = parsed.customMin;
          if (typeof parsed.customSec === 'number') state.timer.customSec = parsed.customSec;
          if (typeof parsed.soundOn === 'boolean') state.timer.soundOn = parsed.soundOn;
          if (typeof parsed.vibrateOn === 'boolean') state.timer.vibrateOn = parsed.vibrateOn;
          if (typeof parsed.autoStartOnCheck === 'boolean') state.timer.autoStartOnCheck = parsed.autoStartOnCheck;
        }
        const rk = `fit_react_${state.memberName}_${state.selectedDate}`;
        state.feedbackReaction = localStorage.getItem(rk) || '';
        const wk = `fit_water_${state.memberName}_${state.selectedDate}`;
        const wv = localStorage.getItem(wk);
        if (wv !== null && !Number(state.record.diet.water)) {
          state.record.diet.water = Number(wv) || 0;
        }
      } catch {}
    }

    function saveTimerPrefsLocal() {
      try {
        localStorage.setItem('fit_timer_prefs_v2', JSON.stringify({
          customMin: state.timer.customMin,
          customSec: state.timer.customSec,
          soundOn: state.timer.soundOn,
          vibrateOn: state.timer.vibrateOn,
          autoStartOnCheck: state.timer.autoStartOnCheck
        }));
      } catch {}
    }

    // --- API Helpers ---
    async function postRecords(payload) {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), 8000) : null;
      try {
        const res = await fetch('/api/records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          ...(ctrl ? { signal: ctrl.signal } : {})
        });
        if (!res.ok) throw new Error('records_' + res.status);
        return res.json();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    async function postAppsScript(payload) {
      const res = await fetch('/api/apps-script', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('apps_script_' + res.status);
      return res.json();
    }

    function applyCachedMemberData(dateStr) {
      try {
        const raw = localStorage.getItem(`fit_cache_v2_${state.memberName}_${dateStr}`);
        if (!raw) return false;
        const cached = JSON.parse(raw);
        if (cached.record) state.record = cached.record;
        if (cached.insights) state.insights = cached.insights;
        if (Array.isArray(cached.columns) && cached.columns.length) state.columns = cached.columns;
        if (Array.isArray(cached.workoutDays)) state.workoutDays = cached.workoutDays;
        return true;
      } catch { return false; }
    }

    function saveCachedMemberData(dateStr) {
      try {
        localStorage.setItem(`fit_cache_v2_${state.memberName}_${dateStr}`, JSON.stringify({
          record: state.record,
          insights: state.insights,
          columns: state.columns,
          workoutDays: state.workoutDays
        }));
      } catch {}
    }

    // --- Live Initialization (Parallel + Instant Cache) ---
    async function initLiveMemberData() {
      loadLocalMemberExtras();
      if (!isLiveOrigin || !state.memberName || !state.token) {
        renderAll();
        return;
      }
      const hadCache = applyCachedMemberData(state.selectedDate);
      state.isLive = true;
      state.loading = !hadCache;
      renderAll();
      try {
        const [sessRes] = await Promise.all([
          postRecords({
            action: 'memberSession',
            member: state.memberName,
            token: state.token,
            date: state.selectedDate
          }).catch(() => null),
          loadMemberDateData(state.selectedDate)
        ]);
        if (sessRes?.status === 'success' && sessRes.session) {
          state.session = sessRes.session;
        }
        saveCachedMemberData(state.selectedDate);
        loadLocalMemberExtras();
        maybeShowPrivacyConsent();
      } catch {
        state.isLive = false;
        if (!hadCache) showToast('미리보기 데이터로 표시 중입니다');
      } finally {
        state.loading = false;
        renderAll();
      }
    }

    async function loadMemberDateData(dateStr) {
      if (!state.isLive) return;
      const auth = state.session ? { session: state.session } : { token: state.token };
      const month = dateStr.slice(0, 7);

      const [daily, ins, cols, hist] = await Promise.allSettled([
        postRecords({ action: 'read', member: state.memberName, date: dateStr, ...auth }),
        postRecords({ action: 'memberInsights', member: state.memberName, date: dateStr, ...auth }),
        postRecords({ action: 'columnList', member: state.memberName, date: dateStr, ...auth }),
        postRecords({ action: 'workoutHistory', member: state.memberName, date: dateStr, month, ...auth })
      ]);

      if (daily.status === 'fulfilled' && daily.value && typeof daily.value === 'object') {
        const d = daily.value;
        state.record = {
          headerMessage: d.headerMessage || '',
          routines: Array.isArray(d.routines) ? d.routines : [],
          reflection: d.reflection || { good: '', bad: '' },
          diet: {
            breakfast: d.diet?.breakfast || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            lunch: d.diet?.lunch || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            dinner: d.diet?.dinner || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            snack: d.diet?.snack || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] },
            water: Number(d.diet?.water) || 0
          },
          feedback: d.feedback || { workout: '', diet: '', time: '' },
          memos: Array.isArray(d.memos) ? d.memos : [],
          dailyCheckin: d.dailyCheckin || { workout: '', diet: '', mood: '' }
        };
      }
      if (ins.status === 'fulfilled' && ins.value?.status === 'success') state.insights = ins.value;
      if (cols.status === 'fulfilled' && cols.value?.status === 'success' && Array.isArray(cols.value.columns) && cols.value.columns.length) {
        state.columns = cols.value.columns;
      }
      if (hist.status === 'fulfilled' && hist.value?.status === 'success' && Array.isArray(hist.value.days)) {
        state.workoutDays = hist.value.days;
      }
    }

    // --- UI Feedback ---
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('opacity-0');
      t.classList.add('opacity-100');
      clearTimeout(window.__toastTimer);

    function triggerConfetti() {
      const colors = ['#3B82F6', '#2DD4BF', '#60A5FA', '#F59E0B', '#FFFFFF'];
      for (let i = 0; i < 20; i++) {
        const dot = document.createElement('div');
        dot.className = 'confetti-dot';
        dot.style.background = colors[i % colors.length];
        dot.style.left = (45 + (Math.random() * 10 - 5)) + '%';
        dot.style.top = '18%';
        dot.style.setProperty('--tx', ((Math.random() - 0.5) * 220) + 'px');
        dot.style.setProperty('--ty', (Math.random() * 160 - 40) + 'px');

    // --- Custom Timer Engine & Floating Bar ---
    function getConfiguredTimerSeconds() {
      const total = (Number(state.timer.customMin) || 0) * 60 + (Number(state.timer.customSec) || 0);
      return Math.max(5, total);
    }

    function updateFloatingTimerUI() {
      const bar = document.getElementById('floating-timer-bar');
      if (!bar) return;
      if (state.appMode !== 'member' || state.timer.remaining <= 0) {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      document.getElementById('ft-time').textContent = formatMMSS(state.timer.remaining);
      document.getElementById('ft-sub').textContent = `휴식 타이머 · ${state.timer.setsDone}세트 완료`;
      document.getElementById('ft-toggle').textContent = state.timer.running ? '일시정지' : '재개';
    }

    function startTimerCountdown(sec) {
      if (state.timer.interval) {
        clearInterval(state.timer.interval);
        state.timer.interval = null;
      }
      const targetSec = typeof sec === 'number' ? Math.max(5, sec) : getConfiguredTimerSeconds();
      state.timer.total = targetSec;
      state.timer.remaining = targetSec;
      state.timer.running = true;
      runTimerTick();
      updateFloatingTimerUI();
      const badge = document.getElementById('rest-timer-badge');
      if (badge) badge.textContent = `⏱ ${formatMMSS(state.timer.remaining)}`;
    }

    function runTimerTick() {
      if (state.timer.interval) clearInterval(state.timer.interval);
      state.timer.interval = setInterval(() => {
        if (!state.timer.running) return;
        state.timer.remaining -= 1;
        if (state.timer.remaining <= 0) {
          clearInterval(state.timer.interval);
          state.timer.interval = null;
          state.timer.remaining = 0;
          state.timer.running = false;
          if (state.timer.soundOn) playTimerBeep();
          if (state.timer.vibrateOn && navigator.vibrate) {
            try { navigator.vibrate([180, 90, 180]); } catch {}
          }
          showToast('휴식 완료! 다음 세트 시작해볼까요? 💪');
          triggerConfetti();
        }
        updateFloatingTimerUI();
        const badge = document.getElementById('rest-timer-badge');
        if (badge) badge.textContent = state.timer.remaining > 0 ? `⏱ ${formatMMSS(state.timer.remaining)}` : '⏱ 타이머';
        const modalTime = document.getElementById('tm-live-display');
        if (modalTime) modalTime.textContent = formatMMSS(state.timer.remaining > 0 ? state.timer.remaining : getConfiguredTimerSeconds());
      }, 1000);
    }

    function stopTimer() {
      if (state.timer.interval) {
        clearInterval(state.timer.interval);
        state.timer.interval = null;
      }
      state.timer.running = false;
      state.timer.remaining = 0;
      updateFloatingTimerUI();
      const badge = document.getElementById('rest-timer-badge');
      if (badge) badge.textContent = '⏱ 타이머';
    }

    // --- Barbell Plate Calculator Modal ---
    function computePlatesPerSide(targetWeight, barWeight) {
      const plates = [20, 15, 10, 5, 2.5, 1.25];
      let perSide = Math.max(0, (targetWeight - barWeight) / 2);
      const result = [];
      plates.forEach(p => {
        while (perSide >= p - 0.001) {
          result.push(p);
          perSide -= p;
        }
      });
      return { plates: result, remainder: Math.round(perSide * 100) / 100 };
    }

    function openPlateCalcModal() {
      function renderPlateModal() {
        const { targetWeight, barWeight } = state.plateCalc;
        const { plates, remainder } = computePlatesPerSide(targetWeight, barWeight);
        const grouped = {};
        plates.forEach(p => { grouped[p] = (grouped[p] || 0) + 1; });
        const plateColor = p => p >= 20 ? '#1E3A8A' : p >= 15 ? '#0F766E' : p >= 10 ? '#2563EB' : p >= 5 ? '#14B8A6' : '#64748B';
        const plateHeight = p => p >= 20 ? 58 : p >= 15 ? 50 : p >= 10 ? 42 : p >= 5 ? 34 : 26;

    // --- Metrics & Visual SVGs ---
    function getWorkoutRate() {
      const rs = state.record.routines || [];
      if (!rs.length) return { done: 0, total: 0, pct: 0 };
      const done = rs.filter(r => Array.isArray(r.completedSets) && r.completedSets.some(Boolean)).length;
      return { done, total: rs.length, pct: Math.round((done / rs.length) * 100) };
    }

    function getDietStats() {
      const d = state.record.diet || {};
      const keys = ['breakfast', 'lunch', 'dinner', 'snack'];
      let kcal = 0, carb = 0, prot = 0, fat = 0, loggedCount = 0;
      keys.forEach(k => {
        const m = d[k] || {};
        const c = Number(m.cal) || 0;
        const hasPhotos = Array.isArray(m.photos) && m.photos.length > 0;
        if (c > 0 || String(m.desc || '').trim() || hasPhotos) loggedCount++;
        kcal += c;
        carb += Number(m.carb) || 0;
        prot += Number(m.prot) || 0;
        fat += Number(m.fat) || 0;
      });
      const macroSum = carb + prot + fat;
      return {
        kcal,
        pct: Math.min(100, Math.round((kcal / state.targetKcal) * 100)),
        loggedCount,
        carbPct: macroSum ? Math.round((carb / macroSum) * 100) : 45,
        protPct: macroSum ? Math.round((prot / macroSum) * 100) : 35,
        fatPct: macroSum ? Math.round((fat / macroSum) * 100) : 20,
        water: Number(d.water) || 0
      };
    }

    function computeCareScore() {
      const wr = getWorkoutRate();
      const ds = getDietStats();
      const chk = state.record.dailyCheckin || {};
      const weekDays = state.insights?.careSummary?.workoutDays || 0;
      let score = 55 + Math.min(20, weekDays * 6) + Math.round(wr.pct * 0.15);
      if (chk.workout === 'done') score += 5;
      if (chk.diet === 'done') score += 4;
      if (ds.loggedCount > 0) score += 3;
      return Math.min(100, score);
    }

    function heroRingsSvg(scorePct, kcalPct, routinePct) {
      const rings = [
        { r: 44, pct: scorePct, color: '#60A5FA', track: 'rgba(255,255,255,0.16)' },
        { r: 33, pct: Math.max(8, kcalPct), color: '#5EEAD4', track: 'rgba(255,255,255,0.14)' },
        { r: 22, pct: Math.max(8, routinePct), color: '#FFFFFF', track: 'rgba(255,255,255,0.12)' }
      ];
      return `
        <svg width="106" height="106" class="-rotate-90" viewBox="0 0 106 106">
          ${rings.map(ring => {
            const circ = 2 * Math.PI * ring.r;
            const offset = circ - (Math.min(100, ring.pct) / 100) * circ;
            return `
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.track}" stroke-width="7.5"/>
              <circle cx="53" cy="53" r="${ring.r}" fill="none" stroke="${ring.color}" stroke-width="7.5" stroke-linecap="round"
                stroke-dasharray="${circ.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
            `;
          }).join('')}
        </svg>
      `;
    }

    function miniRing(pct) {
      const r = 16;
      const c = 2 * Math.PI * r;
      const offset = c - (Math.min(100, pct) / 100) * c;
      return `
        <svg width="42" height="42" class="-rotate-90" viewBox="0 0 42 42">
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4.5"/>
          <circle cx="21" cy="21" r="${r}" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"
            stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}" class="transition-all duration-500"/>
        </svg>
      `;
    }

    function weeklyCurveSvg() {
      const wr = getWorkoutRate();
      const pts = state.weekDays.map((d, i) => {
        const isSel = d.fullDate === state.selectedDate;
        const worked = state.workoutDays.includes(d.fullDate);
        let val = worked ? 82 : 24;
        if (isSel) val = Math.max(val, wr.pct > 0 ? wr.pct : (state.record.dailyCheckin.workout === 'done' ? 85 : 35));
        const x = 16 + i * 52;
        const y = 74 - (val / 100) * 56;
        return { x, y, day: d.day, isSel, worked };
      });
      let pathD = `M ${pts[0].x} ${pts[0].y}`;
      for (let i = 0; i < pts.length - 1; i++) {
        const cpX = (pts[i].x + pts[i + 1].x) / 2;
        pathD += ` C ${cpX} ${pts[i].y}, ${cpX} ${pts[i + 1].y}, ${pts[i + 1].x} ${pts[i + 1].y}`;
      }
      const areaD = `${pathD} L ${pts[pts.length - 1].x} 82 L ${pts[0].x} 82 Z`;
      return `
        <svg viewBox="0 0 344 96" class="w-full h-24 overflow-visible">
          <defs>
            <linearGradient id="liveCurve" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient>
            <linearGradient id="liveFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563EB" stop-opacity="0.20"/><stop offset="100%" stop-color="#14B8A6" stop-opacity="0.0"/></linearGradient>
          </defs>
          <path d="${areaD}" fill="url(#liveFill)"/>
          <path d="${pathD}" fill="none" stroke="url(#liveCurve)" stroke-width="2.8" stroke-linecap="round"/>
          ${pts.map(pt => `
            <circle cx="${pt.x}" cy="${pt.y}" r="${pt.isSel ? 5.5 : 3.5}" fill="${pt.isSel ? '#14B8A6' : (pt.worked ? '#1D4ED8' : '#CBD5E1')}" stroke="#FFFFFF" stroke-width="2"/>
            <text x="${pt.x}" y="95" text-anchor="middle" font-size="10" font-weight="${pt.isSel ? '800' : '600'}" fill="${pt.isSel ? '#1D4ED8' : '#9CA3AF'}">${pt.day}</text>
          `).join('')}
        </svg>
      `;
    }

    function openMealModal(mealKey, mealLabel) {
      const m = state.record.diet[mealKey] || { desc: '', cal: '', carb: '', prot: '', fat: '', photos: [] };
      const presets = [
        { tag: '클린식', cal: '450', carb: '40', prot: '35', fat: '10', desc: '닭가슴살 · 현미밥 · 샐러드' },
        { tag: '일반식', cal: '650', carb: '70', prot: '28', fat: '18', desc: '일반 한식 · 단백질 반찬 포함' },
        { tag: '외식', cal: '820', carb: '85', prot: '25', fat: '32', desc: '외식 메뉴 · 양 조절' },
        { tag: '단백질·간식', cal: '220', carb: '12', prot: '26', fat: '6', desc: '프로틴 쉐이크 · 견과류' }
      ];
      let compressedPhoto = Array.isArray(m.photos) && m.photos[0] ? m.photos[0] : '';

      openModal(`${mealLabel} 식단 기록`, `
        <div class="space-y-4">
          <div>
            <label class="tap-scale w-full py-3 px-4 rounded-2xl border-2 border-dashed ${compressedPhoto ? 'border-[#0F766E] bg-[#F0FDFA] text-[#0F766E]' : 'border-gray-200 bg-[#F4F6F9] text-[#4B5563]'} flex items-center justify-center gap-2 text-[13px] font-bold cursor-pointer">
              <input id="meal-photo-input" type="file" accept="image/*" class="hidden" />
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              <span id="photo-status-txt">${compressedPhoto ? '식단 사진 준비됨 ✓ (변경하려면 터치)' : '사진 1장 첨부 (자동 압축)'}</span>
            </label>
            <img id="meal-photo-preview" src="${compressedPhoto}" alt="식단 사진" class="${compressedPhoto ? '' : 'hidden'} mt-2 w-full h-36 object-cover rounded-2xl" />
          </div>

          <div>
            <p class="text-[12px] font-bold text-[#4B5563] mb-2">원터치 태그로 2초 만에 저장</p>
            <div class="grid grid-cols-2 gap-2">
              ${presets.map((pr, idx) => `
                <button type="button" data-pr="${idx}" class="pr-btn tap-scale p-3 rounded-2xl bg-[#F4F6F9] hover:bg-[#EFF6FF] text-left">
                  <div class="flex items-center justify-between"><span class="text-[13px] font-bold text-[#111827]">${pr.tag}</span><span class="text-[11px] font-bold text-[#0F766E]">~${pr.cal}kcal</span></div>
                  <p class="text-[11px] text-[#6B7280] mt-0.5 truncate">${pr.desc}</p>
                </button>
              `).join('')}
            </div>
          </div>

          <form id="meal-form" class="pt-2 border-t border-gray-100 space-y-2.5">
            <input id="mf-desc" value="${escapeHtml(m.desc || '')}" placeholder="먹은 메뉴를 입력하세요" class="w-full text-sm px-3.5 py-2.5 rounded-2xl bg-[#F4F6F9]" />
            <input id="mf-cal" type="number" min="0" value="${escapeHtml(m.cal || '')}" placeholder="예상 칼로리 (kcal)" class="w-full text-sm px-3.5 py-2.5 rounded-2xl bg-[#F4F6F9]" />
            <button type="submit" class="w-full py-3 rounded-2xl hero-navy text-white text-sm font-bold">저장하기</button>
          </form>
        </div>
      `);

      document.getElementById('meal-photo-input').addEventListener('change', async e => {
        const f = e.target.files?.[0];
        if (!f) return;
        try {
          compressedPhoto = await compressImageFile(f);
          const prev = document.getElementById('meal-photo-preview');
          prev.src = compressedPhoto;
          prev.classList.remove('hidden');
          document.getElementById('photo-status-txt').textContent = '사진 압축 완료 ✓';
          showToast('사진이 가볍게 압축되었어요');
        } catch {
          showToast('사진을 불러오지 못했어요');
        }
      });

      document.querySelectorAll('.pr-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pr = presets[Number(btn.dataset.pr)];
          const updated = { desc: `[${pr.tag}] ${pr.desc}`, cal: pr.cal, carb: pr.carb, prot: pr.prot, fat: pr.fat, ...(compressedPhoto ? { photos: [compressedPhoto] } : {}) };
          state.record.diet[mealKey] = updated;
          closeModal();
          showToast(`${mealLabel} (${pr.tag}) 저장 완료!`);
          renderAll();
          savePatchLive({ diet: { [mealKey]: updated } });
        });
      });

      document.getElementById('meal-form').addEventListener('submit', e => {
        e.preventDefault();
        const desc = document.getElementById('mf-desc').value.trim();
        const cal = document.getElementById('mf-cal').value.trim();
        if (!desc && !cal && !compressedPhoto) return;
        const updated = { ...m, desc: desc || '사진 기록', cal, ...(compressedPhoto ? { photos: [compressedPhoto] } : {}) };
        state.record.diet[mealKey] = updated;
        closeModal();
        showToast(`${mealLabel} 식단이 저장되었어요`);
        renderAll();
        savePatchLive({ diet: { [mealKey]: updated } });
      });
    }

    function getExerciseProfile(title) {
      const t = String(title || '');
      if (/데드버그|플랭크|복근|크런치|코어|레그레이즈/i.test(t)) {
        return {
          primary: ['abs'],
          secondary: ['obliques', 'quads'],
          primaryLabel: '복직근 · 속근육(코어)',
          secondaryLabel: '복사근 · 장요근',
          steps: [
            '바닥에 등을 대고 누워 허리가 뜨지 않도록 복부를 지그시 눌러줍니다.',
            '숨을 길게 내쉬며 팔·다리를 천천히 뻗었다가 코어 힘으로 원위치합니다.'
          ]
        };
      }
      if (/데드|힙|루마니안|백|로우|랫|풀다운/i.test(t)) {
        return {
          primary: ['glutes', 'hamstrings', 'lats'],
          secondary: ['lowerback', 'traps', 'forearms'],
          primaryLabel: '둔근 · 햄스트링 · 광배근',
          secondaryLabel: '척추기립근 · 승모근',
          steps: [
            '발을 골반 너비로 두고 가슴을 펴 척추 중립 정렬을 맞춥니다.',
            '고관절을 뒤로 접으며 내려갔다가 발바닥으로 지면을 밀며 일어납니다.'
          ]
        };
      }
      if (/프레스|벤치|푸쉬업|체스트|가슴|딥스/i.test(t)) {
        return {
          primary: ['chest', 'delts'],
          secondary: ['triceps', 'abs'],
          primaryLabel: '대흉근 · 전면 삼각근',
          secondaryLabel: '상완삼두근 · 코어',
          steps: [
            '견갑골을 가볍게 모으고 내려 가슴 공간을 열어 자세를 고정합니다.',
            '호흡을 마시며 천천히 내린 뒤, 내쉬면서 목표 부위 힘으로 밀어 올립니다.'
          ]
        };
      }
      return {
        primary: ['quads', 'glutes'],
        secondary: ['abs', 'calves', 'hamstrings'],
        primaryLabel: '대퇴사두 · 둔근',
        secondaryLabel: '코어 · 햄스트링',
        steps: [
          '발바닥 3점 지지(엄지·새끼·뒤꿈치)를 고정하고 복압을 가볍게 잡습니다.',
          '무릎과 발끝 방향을 맞추며 3초간 천천히 내려갔다가 지면을 밀어 올라옵니다.'
        ]
      };
    }

    function openAddRoutineModal() {
      openModal('개인운동 직접 추가', `
        <form id="add-routine-form" class="space-y-3">
          <input id="ar-name" required placeholder="운동 이름 (예: 힙 쓰러스트)" class="w-full text-sm px-4 py-3 rounded-2xl bg-[#F4F6F9]" />

            <input id="ar-sets" type="number" min="1" value="3" placeholder="세트" class="w-full text-sm px-3 py-2.5 rounded-2xl bg-[#F4F6F9]" />
            <input id="ar-reps" type="number" min="1" value="12" placeholder="횟수" class="w-full text-sm px-3 py-2.5 rounded-2xl bg-[#F4F6F9]" />
          </div>
          <input id="ar-note" placeholder="메모 (선택)" class="w-full text-sm px-4 py-3 rounded-2xl bg-[#F4F6F9]" />
          <button type="submit" class="w-full py-3.5 rounded-2xl hero-navy text-white text-sm font-bold">수업일지에 추가</button>
        </form>
      `);
      document.getElementById('add-routine-form').addEventListener('submit', e => {
        e.preventDefault();
        const name = document.getElementById('ar-name').value.trim();
        if (!name) return;
        const sets = Math.max(1, Number(document.getElementById('ar-sets').value) || 3);
        state.record.routines.push({
          id: Date.now(),
          name,
          weight: document.getElementById('ar-weight').value.trim(),
          sets: String(sets),
          reps: document.getElementById('ar-reps').value.trim() || '12',
          note: document.getElementById('ar-note').value.trim(),
          completedSets: Array(sets).fill(true)
        });
        closeModal();
        triggerConfetti();
        showToast('개인운동이 추가되었어요!');
        renderAll();
        saveFullRecordLive();
      });
    }

      `);
      const pwEl = document.getElementById('coach-pw');
      if (pwEl) pwEl.value = '';
      document.getElementById('coach-login-form').addEventListener('submit', async e => {
        e.preventDefault();
        const pw = document.getElementById('coach-pw').value;
        if (isLiveOrigin) {
          try {
            const v = await postRecords({ action: 'verify', password: pw, date: state.selectedDate });
            if (v?.status !== 'success') { showToast('비밀번호가 일치하지 않아요'); return; }
            state.trainerPassword = pw;
            const ov = await postRecords({ action: 'trainerOverview', password: pw, date: state.selectedDate });
            if (ov?.status === 'success' && Array.isArray(ov.members)) state.trainerOverview = ov.members;
            state.isLive = true;
          } catch {
            showToast('코치 인증 중 오류가 발생했어요');
            return;
          }
        } else {
          state.trainerOverview = [
            { name: '김윤지', lastDate: state.selectedDate, activeToday: true, pendingWorkout: true, pendingDiet: true, weeklyWorkoutDays: 2 },
            { name: '이서연', lastDate: state.selectedDate, activeToday: true, pendingWorkout: false, pendingDiet: true, weeklyWorkoutDays: 3 },
            { name: '최민수', lastDate: shiftDateStr(state.selectedDate, -5), activeToday: false, pendingWorkout: false, pendingDiet: false, weeklyWorkoutDays: 0 }
          ];
        }
        state.appMode = 'coach';
        state.coachTab = 'coaching';
        const hasPending = state.trainerOverview.some(m => m.pendingWorkout || m.pendingDiet);
        state.coachFilter = hasPending ? 'pending' : 'all';
        state.fabOpen = false;
        closeModal();
        showToast('코치 모드로 전환되었어요');
        renderAll();
      });
    }

    async function fetchMemberForCoach(memberName) {
      if (!state.isLive || !state.trainerPassword) {
        return { daily: state.record, history: { previous: { '고블릿 스쿼트': { weight: 14, reps: 12, date: shiftDateStr(state.selectedDate, -3) } } } };
      }
      const [dRes, hRes] = await Promise.allSettled([
        postRecords({ action: 'read', member: memberName, date: state.selectedDate, password: state.trainerPassword }),
        postRecords({ action: 'workoutHistory', member: memberName, date: state.selectedDate, month: state.selectedDate.slice(0, 7), password: state.trainerPassword })
      ]);
      return {
        daily: (dRes.status === 'fulfilled' && dRes.value && typeof dRes.value === 'object') ? dRes.value : {},
        history: (hRes.status === 'fulfilled' && hRes.value?.status === 'success') ? hRes.value : { previous: {} }
      };
    }

          if (!name) { showToast('종목 이름을 입력해 주세요'); return; }
          replyMsg = document.getElementById('cd-reply-msg').value;
          dietMsg = document.getElementById('cd-diet-msg').value;
          const sets = Math.max(1, Number(document.getElementById('cd-new-sets').value) || 3);
          routines.push({
            id: Date.now(),
            routineType: document.getElementById('cd-new-type').value,
            name,
            weight: document.getElementById('cd-new-weight').value.trim(),
            sets: String(sets),
            reps: document.getElementById('cd-new-reps').value.trim() || '12',
            note: document.getElementById('cd-new-note').value.trim(),
            completedSets: Array(sets).fill(false)
          });
          renderDetailBody();
        });

            routines[Number(inp.dataset.ni)].note = e.target.value;
          });
        });

          b.addEventListener('click', () => {
            const idx = Number(b.dataset.wi);
            replyMsg = document.getElementById('cd-reply-msg').value;
            dietMsg = document.getElementById('cd-diet-msg').value;
            const cur = Number(routines[idx].weight) || 0;
            routines[idx].weight = String(Math.max(0, cur + Number(b.dataset.wd)));

          const picked = DAILY_COACH_TIPS[Number(e.target.value)];

            replyMsg = picked;
            document.getElementById('cd-reply-msg').value = picked;
          }
        });

          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (SR) {
            const rec = new SR();
            rec.lang = 'ko-KR';
            showToast('말씀해 주세요... 🎙');
            rec.onresult = ev => {
              const spoken = ev.results?.[0]?.[0]?.transcript || '';
              if (spoken) {
                replyMsg = spoken;
                document.getElementById('cd-reply-msg').value = spoken;
                showToast('음성이 답글로 입력되었어요');
              }
            };
            rec.start();
          } else {
            replyMsg = `${memberName}님 오늘 ${routines[0]?.name || '루틴'} ${routines[0]?.weight || ''}kg 안정적으로 완료! 다음 회차도 화이팅입니다.`;
            document.getElementById('cd-reply-msg').value = replyMsg;
            showToast('음성 초안이 자동 입력되었어요');
          }
        });

        document.getElementById('cd-broadcast-all').addEventListener('click', async () => {
          const finalReply = document.getElementById('cd-reply-msg').value.trim();
          if (!finalReply) {
            showToast('전체 적용할 코치 한마디를 먼저 선택하거나 입력해 주세요');
            return;
          }
          state.record.headerMessage = finalReply;
          const members = state.trainerOverview || [];
          closeModal();
          triggerConfetti();
          showToast(`전체 ${members.length || 1}명 회원님께 한마디를 통일 적용 중...`);
          renderAll();
          if (state.isLive && members.length) {
            await Promise.allSettled(
              members.map(m => savePatchLive({ headerMessage: finalReply }, m.name))
            );
            showToast(`전체 ${members.length}명 회원님께 통일 적용 완료!`);
          } else {
            showToast('전체 회원 한마디 통일 적용 완료!');
          }
        });

        document.getElementById('cd-save-all').addEventListener('click', async () => {
          const finalReply = document.getElementById('cd-reply-msg').value.trim();
          const finalDiet = document.getElementById('cd-diet-msg').value.trim();
          const fullPayload = {
            ...daily,
            headerMessage: finalReply || daily.headerMessage || '',
            routines,
            feedback: {
              ...(daily.feedback || {}),
              ...(finalReply ? { workout: finalReply } : {}),
              ...(finalDiet ? { diet: finalDiet } : {}),
              time: nowTimeHHMM()
            }
          };

          const ovTarget = state.trainerOverview.find(x => x.name === memberName);
          if (ovTarget) {
            if (finalReply) ovTarget.pendingWorkout = false;
            if (finalDiet) ovTarget.pendingDiet = false;
          }
          if (memberName === state.memberName) {
            state.record.headerMessage = fullPayload.headerMessage;
            state.record.routines = routines;
            state.record.feedback = fullPayload.feedback;
          }
          closeModal();
          triggerConfetti();
          showToast(`${memberName} 회원님 피드백 저장 완료!`);
          renderAll();
          await saveFullRecordLive(memberName, fullPayload);
        });
      }
      renderDetailBody();
    }

              <p class="text-[12px] font-bold text-white/80">오늘 섭취 칼로리</p>

              ${state.record.feedback?.diet ? `<p class="mt-2.5 p-2.5 rounded-xl bg-white/15 text-[12px]">코치 식단 피드백: "${escapeHtml(state.record.feedback.diet)}"</p>` : ''}

            ${renderWaterWidget(ds)}
            ${[['breakfast', '아침'], ['lunch', '점심'], ['dinner', '저녁'], ['snack', '간식']].map(([key, label]) => {
              const ml = state.record.diet[key] || {};
              const hasPhoto = Array.isArray(ml.photos) && ml.photos.length > 0;
              const logged = !!(String(ml.desc || '').trim() || Number(ml.cal) > 0 || hasPhoto);
              return `
                <div class="bg-white rounded-[22px] p-4 space-y-2.5">
                  <div class="flex items-center justify-between gap-2">
                    <div>
                      <p class="text-[15px] font-bold text-[#111827]">${label}</p>
                      <p class="text-[12px] text-[#6B7280] mt-0.5">${escapeHtml(ml.desc || '아직 기록 전이에요')}</p>
                    </div>
                    <button type="button" data-mkey="${key}" data-mlabel="${label}" class="meal-btn px-3.5 py-2 rounded-full text-[12px] font-bold ${logged ? 'bg-[#F0FDFA] text-[#0F766E]' : 'hero-navy text-white'}">${ml.cal ? ml.cal + ' kcal' : '기록하기'}</button>
                  </div>
                  ${hasPhoto ? `<img src="${ml.photos[0]}" alt="${label} 식단" class="w-full h-32 object-cover rounded-xl" />` : ''}
                </div>
              `;
            }).join('')}

        const w = state.insights?.weekly?.current || { days: 0, sets: 0, exercises: 0 };
        const imps = state.insights?.weekly?.improvements || [];

            <div class="bg-white rounded-[24px] p-5 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-[16px] font-bold text-[#111827]">이번 주 성장 요약</h2>
                <button type="button" id="btn-body-ounwan" class="tap-scale px-3 py-1 rounded-full hero-navy text-white text-[11px] font-bold">오운완 카드</button>
              </div>
              <div class="grid grid-cols-3 gap-2 text-center">
                <div class="p-3 rounded-2xl bg-[#F4F6F9]"><p class="text-[11px] text-[#6B7280]">운동 일수</p><p class="text-[18px] font-extrabold text-[#1D4ED8] mt-0.5">${w.days}일</p></div>
                <div class="p-3 rounded-2xl bg-[#F4F6F9]"><p class="text-[11px] text-[#6B7280]">완료 세트</p><p class="text-[18px] font-extrabold text-[#111827] mt-0.5">${w.sets}세트</p></div>
                <div class="p-3 rounded-2xl bg-[#F4F6F9]"><p class="text-[11px] text-[#6B7280]">식단 기록</p><p class="text-[18px] font-extrabold text-[#0F766E] mt-0.5">${state.insights?.careSummary?.dietDays || 0}일</p></div>
              </div>
              ${imps.length ? `
                <div class="pt-2 space-y-1.5">
                  <p class="text-[12px] font-bold text-[#1D4ED8]">지난주 대비 증량 성공 (눌러서 공유 카드)</p>
                  ${imps.map((it, idx) => `<button type="button" data-pridx="${idx}" class="pr-item-btn tap-scale w-full p-3 rounded-xl bg-[#EFF6FF] flex justify-between text-[13px]"><span class="font-bold text-[#111827]">🏆 ${escapeHtml(it.name)}</span><span class="font-bold text-[#1D4ED8]">${it.previous}kg → ${it.current}kg ›</span></button>`).join('')}
                </div>
              ` : `<div class="py-5 text-center text-[12px] text-[#6B7280] bg-[#F4F6F9] rounded-2xl">꾸준히 중량을 기록하면 지난주 대비 성장 그래프가 자동으로 채워져요!</div>`}

      const memos = state.record.memos || [];
      return `
        <div class="space-y-3.5 animate-in">
          <div class="bg-white rounded-[24px] p-5 space-y-2.5">
            <h2 class="text-[16px] font-bold text-[#111827]">코치 · 회원 메모</h2>

    // --- Coach View (Slim 2-Tab Cockpit) ---
    function renderCoachView() {
      const list = state.trainerOverview || [];
      const isPending = m => Boolean(m.pendingWorkout || m.pendingDiet);
      const isDormant = m => daysBetween(m.lastDate, state.selectedDate) >= 4;

      const pendingList = list.filter(isPending);
      const todayList = list.filter(m => m.activeToday);
      const dormantList = list.filter(isDormant);

      if (state.coachTab === 'coaching') {
        let filtered = list;
        if (state.coachFilter === 'pending') filtered = pendingList;
        else if (state.coachFilter === 'today') filtered = todayList;
        else if (state.coachFilter === 'dormant') filtered = dormantList;

        // Sort so pending feedback members always come first
        const sorted = [...filtered].sort((a, b) => {
          const ap = isPending(a) ? 1 : 0;
          const bp = isPending(b) ? 1 : 0;
          if (ap !== bp) return bp - ap;
          return (b.activeToday ? 1 : 0) - (a.activeToday ? 1 : 0);
        });

        return `
          <div class="space-y-3.5 animate-in">
            <section class="hero-navy rounded-[26px] p-5 text-white space-y-3.5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-white/15 text-[#5EEAD4]">${state.selectedDate} 코칭 브리핑</span>
                <span class="text-[11px] font-semibold text-white/75">전체 ${list.length}명</span>
              </div>
              <h1 class="text-[21px] font-extrabold leading-snug">
                ${pendingList.length ? `피드백 대기 ${pendingList.length}명부터<br/>바로 확인해 보세요` : `오늘 피드백 대기가 모두 완료되었어요 👍`}
              </h1>
              <div class="grid grid-cols-4 gap-1.5">
                ${[
                  ['pending', '피드백 대기', pendingList.length],
                  ['today', '오늘 활동', todayList.length],
                  ['dormant', '휴면 4일+', dormantList.length],
                  ['all', '전체', list.length]
                ].map(([fid, label, cnt]) => `
                  <button type="button" data-cfilter="${fid}" class="c-filter-btn tap-scale py-2 px-1 rounded-2xl text-center transition ${state.coachFilter === fid ? 'bg-white text-[#1E3A8A] shadow-md' : 'bg-white/10 text-white'}">
                    <p class="text-[16px] font-extrabold tabular-nums leading-none">${cnt}</p>
                    <p class="text-[10px] font-bold mt-1 opacity-85">${label}</p>
                  </button>
                `).join('')}
              </div>
            </section>

            <div class="space-y-2.5">
              ${sorted.length ? sorted.map(m => {
                const pending = isPending(m);
                const gapDays = daysBetween(m.lastDate, state.selectedDate);
                const badges = [];
                if (m.pendingDiet) badges.push('식단 미답변');
                if (m.pendingWorkout) badges.push('운동 피드백');
                if (gapDays >= 4) badges.push(`${gapDays}일 미접속`);
                return `
                  <button type="button" data-cname="${escapeHtml(m.name)}" class="c-detail-btn tap-scale w-full bg-white rounded-[22px] p-4 shadow-sm text-left flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-[15px] font-extrabold text-[#111827]">${escapeHtml(m.name)}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#EFF6FF] text-[#1D4ED8]">주 ${m.weeklyWorkoutDays || 0}회</span>
                        ${badges.map(bg => `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${bg.includes('미접속') ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-700'}">${bg}</span>`).join('')}
                      </div>
                      <p class="text-[12px] text-[#6B7280] mt-1">최근 기록: ${escapeHtml(m.lastDate || '없음')}</p>
                    </div>
                    <span class="shrink-0 px-3 py-2 rounded-xl ${pending ? 'hero-navy text-white' : 'bg-[#F4F6F9] text-[#4B5563]'} text-[11px] font-extrabold">
                      ${pending ? '바로 답글 ›' : '상세 ›'}
                    </span>
                  </button>
                `;
              }).join('') : `<div class="bg-white rounded-[22px] p-6 text-center text-[13px] text-[#6B7280]">해당 조건의 회원이 없습니다 👍</div>`}
            </div>
          </div>
        `;
      }

      // Second Coach Tab: '회원 · 매거진'
      const matchedMembers = list.filter(m => !state.coachSearch || m.name.includes(state.coachSearch));
      return `
        <div class="space-y-3.5 animate-in">
          <!-- Magazine Management Card -->
          <section class="bg-white rounded-[24px] p-5 shadow-sm space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h2 class="text-[16px] font-extrabold text-[#111827]">FIT-CONNECT 매거진</h2>
                <p class="text-[11px] text-[#6B7280] mt-0.5">회원 홈 상단에 노출 중인 칼럼 ${state.columns.length}건</p>
              </div>
              <button type="button" id="btn-coach-tab-col" class="tap-scale px-3.5 py-2 rounded-xl hero-navy text-white text-[12px] font-extrabold">+ 칼럼 발행</button>
            </div>
            <div class="space-y-1.5">
              ${state.columns.slice(0, 3).map((c, idx) => `
                <button type="button" data-colidx="${idx}" class="mag-item-btn tap-scale w-full p-3 rounded-2xl bg-[#F4F6F9] text-left flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <span class="text-[10px] font-bold text-[#1D4ED8]">#${escapeHtml(c.category || '인사이트')}</span>
                    <p class="text-[13px] font-bold text-[#111827] truncate">${escapeHtml(c.title)}</p>
                  </div>
                  <span class="text-[12px] font-bold text-[#6B7280]">›</span>
                </button>
              `).join('')}
            </div>
          </section>

          <!-- All Members Search & List -->
          <section class="space-y-2.5">
            <input id="coach-search-inp" value="${escapeHtml(state.coachSearch)}" placeholder="전체 회원 이름 검색 (${list.length}명)..." class="w-full text-[13px] px-4 py-3 rounded-2xl bg-white shadow-sm focus:outline-none" />
            ${matchedMembers.map(m => `
              <button type="button" data-cname="${escapeHtml(m.name)}" class="c-detail-btn tap-scale w-full bg-white rounded-[22px] p-4 shadow-sm text-left flex items-center justify-between gap-2">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-[15px] font-bold text-[#111827]">${escapeHtml(m.name)}</span>
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#EFF6FF] text-[#1D4ED8]">주 ${m.weeklyWorkoutDays || 0}회</span>
                  </div>
                  <p class="text-[12px] text-[#6B7280] mt-0.5">최근 기록: ${escapeHtml(m.lastDate || '없음')}</p>
                </div>
                <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${isPending(m) ? 'bg-amber-50 text-amber-700' : 'bg-[#F0FDFA] text-[#0F766E]'}">${isPending(m) ? '피드백 대기 ›' : '상세 보기 ›'}</span>
              </button>
            `).join('')}
          </section>
        </div>
      `;
    }

    function updateFabUI() {
      const menu = document.getElementById('fab-menu');
      const icon = document.getElementById('fab-icon');
      if (state.fabOpen) { menu.classList.remove('hidden'); menu.classList.add('flex'); icon.style.transform = 'rotate(45deg)'; }
      else { menu.classList.add('hidden'); menu.classList.remove('flex'); icon.style.transform = 'rotate(0deg)'; }
    }

    function renderAll() {
      renderHeader();
      renderBottomNav();
      document.getElementById('main-content').innerHTML = state.appMode === 'member' ? renderMemberView() : renderCoachView();
      updateFabUI();
      updateFloatingTimerUI();
      bindEvents();
    }

    function bindEvents() {
      const vBtn = document.getElementById('btn-verify');
      if (vBtn) {
        vBtn.addEventListener('click', () => {
          const nextVal = state.record.dailyCheckin.workout === 'done' ? 'rest' : 'done';
          state.record.dailyCheckin.workout = nextVal;
          if (nextVal === 'done') triggerConfetti();
          showToast(nextVal === 'done' ? '오늘 운동 인증 완료!' : '회복 상태로 변경했어요');
          renderAll();
          saveDailyCheckinLive({ ...state.record.dailyCheckin, workout: nextVal });
        });
      }

      const ounwanBtn = document.getElementById('btn-open-ounwan');
      if (ounwanBtn) ounwanBtn.addEventListener('click', openOunwanCardModal);
      const bodyOunwan = document.getElementById('btn-body-ounwan');
      if (bodyOunwan) bodyOunwan.addEventListener('click', openOunwanCardModal);

      document.querySelectorAll('.fb-react-btn').forEach(b => {
        b.addEventListener('click', () => {
          const val = b.dataset.rval;
          state.feedbackReaction = state.feedbackReaction === val ? '' : val;
          try {
            localStorage.setItem(`fit_react_${state.memberName}_${state.selectedDate}`, state.feedbackReaction);
          } catch {}
          if (state.feedbackReaction) showToast(`코치님께 '${state.feedbackReaction}' 반응을 보냈어요`);
          renderAll();
        });
      });

      const prBtn = document.getElementById('btn-open-pr');
      if (prBtn && state.insights?.weekly?.improvements?.[0]) {
        prBtn.addEventListener('click', () => openPRShareModal(state.insights.weekly.improvements[0]));
      }
      document.querySelectorAll('.pr-item-btn').forEach(b => {
        b.addEventListener('click', () => {
          const it = state.insights?.weekly?.improvements?.[Number(b.dataset.pridx)];
          if (it) openPRShareModal(it);
        });
      });

      const hmBtn = document.getElementById('btn-home-mission');
      if (hmBtn) {
        hmBtn.addEventListener('click', () => {
          const idx = (state.record.routines || []).findIndex(r => !Array.isArray(r.completedSets) || !r.completedSets.some(Boolean));
          if (idx >= 0) {
            const r = state.record.routines[idx];
            r.completedSets = Array(Math.max(1, Number(r.sets) || 3)).fill(true);
            state.timer.setsDone += 1;
            triggerConfetti();
            showToast(`${r.name} 완료 체크!`);
            if (state.timer.autoStartOnCheck) startTimerCountdown(getConfiguredTimerSeconds());
            renderAll();
            saveFullRecordLive();
          } else {
            state.memberTab = 'lesson';
            renderAll();
          }
        });
      }

      const hgBtn = document.getElementById('btn-home-guide');
      if (hgBtn) hgBtn.addEventListener('click', () => openFormGuideModal(hgBtn.dataset.gtitle, hgBtn.dataset.gnote));

      document.querySelectorAll('.w-add-btn').forEach(b => {
        b.addEventListener('click', () => addWaterCup(Number(b.dataset.wml)));
      });
      const wMinus = document.getElementById('btn-water-minus');
      if (wMinus) wMinus.addEventListener('click', () => addWaterCup(-250));

      document.querySelectorAll('.chk-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.record.dailyCheckin[b.dataset.grp] = b.dataset.val;
          showToast('오늘 상태가 저장되었어요');
          renderAll();
          saveDailyCheckinLive({ ...state.record.dailyCheckin });
        });
      });

      document.querySelectorAll('.meal-btn').forEach(b => b.addEventListener('click', () => openMealModal(b.dataset.mkey, b.dataset.mlabel)));

      document.querySelectorAll('.routine-toggle').forEach(b => {
        b.addEventListener('click', () => {
          const idx = Number(b.dataset.ridx);
          const r = state.record.routines[idx];
          if (!r) return;
          const setsCount = Math.max(1, Number(r.sets) || (Array.isArray(r.completedSets) ? r.completedSets.length : 3));
          const currentlyDone = Array.isArray(r.completedSets) && r.completedSets.some(Boolean);
          r.completedSets = Array(setsCount).fill(!currentlyDone);
          if (!currentlyDone) {
            state.timer.setsDone += 1;
            triggerConfetti();
            if (state.timer.autoStartOnCheck) startTimerCountdown(getConfiguredTimerSeconds());
          }
          renderAll();
          saveFullRecordLive();
        });
      });

      document.querySelectorAll('.routine-guide-btn').forEach(b => {
        b.addEventListener('click', () => openFormGuideModal(b.dataset.gtitle, b.dataset.gnote));
      });

      const addR = document.getElementById('btn-add-routine');
      if (addR) addR.addEventListener('click', openAddRoutineModal);

      const timerLessonBtn = document.getElementById('btn-open-timer-lesson');
      if (timerLessonBtn) timerLessonBtn.addEventListener('click', openTimerModal);
      const plateLessonBtn = document.getElementById('btn-open-plate-lesson');
      if (plateLessonBtn) plateLessonBtn.addEventListener('click', openPlateCalcModal);

      const magBtn = document.getElementById('btn-open-magazine');
      if (magBtn) magBtn.addEventListener('click', () => openMagazineModal(0));
      document.querySelectorAll('.mag-item-btn').forEach(b => {
        b.addEventListener('click', () => openMagazineModal(Number(b.dataset.colidx)));
      });

      const memoForm = document.getElementById('memo-form');
      if (memoForm) {
        memoForm.addEventListener('submit', e => {
          e.preventDefault();
          const inp = document.getElementById('memo-inp');
          const txt = inp.value.trim();
          if (!txt) return;
          state.record.memos.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), from: 'member', text: txt, time: nowTimeHHMM() });
          inp.value = '';
          showToast('코치님께 메모를 전송했어요');
          renderAll();
          savePatchLive({ memos: state.record.memos });
        });
      }

      const goL = document.getElementById('go-lesson');
      if (goL) goL.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goL2 = document.getElementById('go-lesson-2');
      if (goL2) goL2.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goD = document.getElementById('go-diet');
      if (goD) goD.addEventListener('click', () => { state.memberTab = 'diet'; renderAll(); });
      const goD2 = document.getElementById('go-diet-2');
      if (goD2) goD2.addEventListener('click', () => { state.memberTab = 'diet'; renderAll(); });

      // Coach events
      document.querySelectorAll('.c-filter-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.coachFilter = b.dataset.cfilter;
          renderAll();
        });
      });

      document.querySelectorAll('.c-detail-btn').forEach(b => {
        b.addEventListener('click', () => openCoachDetailSheet(b.dataset.cname));
      });

      const coachColBtn = document.getElementById('btn-coach-tab-col');
      if (coachColBtn) coachColBtn.addEventListener('click', openColumnWriteModal);

      const csInp = document.getElementById('coach-search-inp');
      if (csInp) {
        csInp.addEventListener('input', e => {
          state.coachSearch = e.target.value.trim();
          renderAll();
          const n = document.getElementById('coach-search-inp');
          if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
        });
      }
    }

    // Floating Timer Bar Listeners
    document.getElementById('ft-minus').addEventListener('click', () => {
      state.timer.remaining = Math.max(5, state.timer.remaining - 10);
      updateFloatingTimerUI();
    });
    document.getElementById('ft-plus').addEventListener('click', () => {
      state.timer.remaining += 10;
      updateFloatingTimerUI();
    });
    document.getElementById('ft-toggle').addEventListener('click', () => {
      state.timer.running = !state.timer.running;
      if (state.timer.running) runTimerTick();
      updateFloatingTimerUI();
    });
    document.getElementById('ft-open').addEventListener('click', openTimerModal);
    document.getElementById('ft-stop').addEventListener('click', stopTimer);

    // FAB Listeners
    document.getElementById('fab-toggle').addEventListener('click', () => { state.fabOpen = !state.fabOpen; updateFabUI(); });
    document.getElementById('fab-timer').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openTimerModal(); });
    document.getElementById('fab-plate').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openPlateCalcModal(); });
    document.getElementById('fab-ounwan').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openOunwanCardModal(); });
    document.getElementById('fab-diet').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openMealModal('lunch', '점심'); });
    document.getElementById('fab-water').addEventListener('click', () => { state.fabOpen = false; addWaterCup(250); });
    document.getElementById('fab-memo').addEventListener('click', () => { state.fabOpen = false; state.memberTab = 'feedback'; renderAll(); });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });

    initLiveMemberData();
  </script>
</body>
</html>
