    async function archiveCoachMember(memberName, button) {
      if (!state.isLive || !state.trainerPassword) {
        showToast('실제 코치 모드에서만 회원을 보관할 수 있어요');
        return;
      }
      if (!window.confirm(`${memberName} 회원을 목록에서 제거할까요?\n\n운동·식단·영상 기록은 삭제하지 않고 보관합니다.`)) return;
      const typed = window.prompt('실수 방지를 위해 회원 이름을 그대로 입력해 주세요.', '');
      if (typed !== memberName) {
        if (typed !== null) showToast('회원 이름이 일치하지 않아 취소했어요');
        return;
      }
      button.disabled = true;
      button.textContent = '처리 중';
      try {
        const res = await postRecords({ action: 'memberArchive', name: memberName, date: state.selectedDate, password: state.trainerPassword });
        if (res?.status !== 'success') throw new Error(res?.code || '보관 실패');
        state.trainerOverview = state.trainerOverview.filter(x => x.name !== memberName);
        state.archivedMemberNames = [...new Set([...(state.archivedMemberNames || []), memberName])];
        try {
          const local = JSON.parse(localStorage.getItem('fit_added_members_v2') || '[]');
          localStorage.setItem('fit_added_members_v2', JSON.stringify(local.filter(x => x?.name !== memberName)));
        } catch {}
        renderAll();
        showToast(`${memberName} 회원을 목록에서 보관했어요. 기록은 유지됩니다.`);
      } catch (err) {
        button.disabled = false;
        button.textContent = '삭제';
        showToast('회원 보관 실패: ' + (err?.message || '네트워크 오류'));
      }
    }

    async function restoreCoachMember(memberName, button) {
      if (!state.isLive || !state.trainerPassword) return;
      button.disabled = true;
      button.textContent = '복원 중';
      try {
        const res = await postRecords({ action: 'memberRegister', name: memberName, date: state.selectedDate, password: state.trainerPassword });
        if (res?.status !== 'success') throw new Error(res?.code || '복원 실패');
        state.archivedMemberNames = (state.archivedMemberNames || []).filter(n => n !== memberName);
        await enterCoachWithPassword(state.trainerPassword, true);

        button.disabled = false;
        button.textContent = '복원';
        showToast('회원 복원 실패: ' + (err?.message || '네트워크 오류'));
      }
    }

                <div class="p-3 rounded-2xl bg-[#F4F6F9]"><p class="text-[11px] text-[#6B7280]">완료 세트</p><p class="text-[18px] font-extrabold text-[#111827] mt-0.5">${w.sets}세트</p></div>
                <div class="p-3 rounded-2xl bg-[#F4F6F9]"><p class="text-[11px] text-[#6B7280]">식단 기록</p><p class="text-[18px] font-extrabold text-[#0F766E] mt-0.5">${state.insights?.careSummary?.dietDays || 0}일</p></div>
              </div>
              ${imps.length ? `
                <div class="pt-2 space-y-1.5">
                  <p class="text-[12px] font-bold text-[#1D4ED8]">지난주 대비 증량 성공 (눌러서 공유 카드)</p>
                  ${imps.map((it, idx) => `<button type="button" data-pridx="${idx}" class="pr-item-btn tap-scale w-full p-3 rounded-xl bg-[#EFF6FF] flex justify-between text-[13px]"><span class="font-bold text-[#111827]">🏆 ${escapeHtml(it.name)}</span><span class="font-bold text-[#1D4ED8]">${it.previous}kg → ${it.current}kg ›</span></button>`).join('')}
                </div>
              ` : `<div class="py-5 text-center text-[12px] text-[#6B7280] bg-[#F4F6F9] rounded-2xl">꾸준히 중량을 기록하면 지난주 대비 성장 그래프가 자동으로 채워져요!</div>`}
            </div>

            ${(() => {
              const fatKg = Math.max(0, Number(state.bodyValue.fatLostKg) || 0);
              const musKg = Math.max(0, Number(state.bodyValue.muscleGainedKg) || 0);
              const fatVal = Math.round(fatKg * 77); // 만원 단위 (지방 1kg = 7,700kcal → 77만원)
              const musVal = Math.round(musKg * 150); // 만원 단위 (근육 1kg = 2~3개월 근력·단백질·대사연금 → 150만원)
              const totalVal = fatVal + musVal;
              return `
                <section class="bg-white rounded-[24px] p-5 shadow-[0_4px_20px_rgba(15,23,42,0.04)] space-y-3.5">
                  <div class="flex items-center justify-between gap-2">
                    <div>
                      <span class="text-[10px] font-extrabold text-[#0F766E] uppercase tracking-wider">BODY ASSET VALUE</span>
                      <h2 class="text-[16px] font-extrabold text-[#111827] mt-0.5">내 몸 자산 가치 리포트 💰</h2>
                    </div>
                    <button type="button" id="btn-copy-bodyval" class="tap-scale px-3 py-1.5 rounded-xl bg-[#F0FDFA] text-[#0F766E] text-[11px] font-extrabold">자랑 복사</button>
                  </div>
                  <div class="p-4 rounded-2xl card-teal text-white space-y-1">
                    <p class="text-[11px] font-bold text-white/85">지방 1kg = 77만원 · 근육 1kg = 150만원 환산</p>
                    <p id="bv-total-text" class="text-[24px] font-extrabold tabular-nums">총 +${totalVal.toLocaleString()}만원 벌었어요!</p>
                    <p id="bv-sub-text" class="text-[12px] text-white/90">체지방 -${fatKg}kg (${fatVal.toLocaleString()}만원) · 골격근 +${musKg}kg (${musVal.toLocaleString()}만원)</p>
                  </div>
                  <div class="p-3 rounded-2xl bg-[#F0FDFA] text-[11px] text-[#0F766E] space-y-1 leading-relaxed">
                    <p>• <strong>지방 1kg = 77만원</strong>: 7,700kcal를 참아내고 태워 내 몸에서 덜어낸 2주의 노력 값</p>
                    <p>• <strong>근육 1kg = 150만원</strong>: 2~3개월 땀으로 만든 지치지 않는 체력 · 대사 엔진</p>
                  </div>
                  <div class="grid grid-cols-2 gap-2.5">
                    <div class="p-3 rounded-2xl bg-[#F4F6F9]">
                      <label class="text-[11px] font-bold text-[#4B5563] block mb-1">감량한 체지방 (kg)</label>
                      <input id="bv-fat-inp" type="number" step="0.1" min="0" value="${fatKg || ''}" placeholder="예: 1.5" class="w-full bg-white rounded-xl px-3 py-2 text-[14px] font-extrabold text-[#111827] tabular-nums focus:outline-none" />
                    </div>
                    <div class="p-3 rounded-2xl bg-[#F4F6F9]">
                      <label class="text-[11px] font-bold text-[#4B5563] block mb-1">늘어난 골격근 (kg)</label>
                      <input id="bv-mus-inp" type="number" step="0.1" min="0" value="${musKg || ''}" placeholder="예: 0.8" class="w-full bg-white rounded-xl px-3 py-2 text-[14px] font-extrabold text-[#1D4ED8] tabular-nums focus:outline-none" />
                    </div>
                  </div>
                </section>
              `;
            })()}
          </div>
        `;
      }

      const memos = state.record.memos || [];
      return `
        <div class="space-y-3.5 animate-in">
          <div class="bg-white rounded-[24px] p-5 space-y-2.5">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-[16px] font-bold text-[#111827]">코치 · 회원 메모</h2>
              <label class="tap-scale px-3 py-1.5 rounded-full bg-[#EFF6FF] text-[#1D4ED8] text-[11px] font-extrabold cursor-pointer">
                <input id="member-vid-upload" type="file" accept="video/mp4,video/quicktime,video/webm,video/*" class="hidden" />
                <span>📹 자세 영상 올리기</span>
              </label>
            </div>
            ${memos.length ? memos.map(f => `
              <div class="p-3.5 rounded-2xl ${f.from === 'trainer' ? 'bg-[#EFF6FF]' : 'bg-[#F4F6F9]'}">
                <div class="flex justify-between text-[11px] mb-1">
                  <span class="font-bold ${f.from === 'trainer' ? 'text-[#1D4ED8]' : 'text-[#111827]'}">${f.from === 'trainer' ? '명진 트레이너' : escapeHtml(state.memberName) + ' 회원님'}</span>
                  <span class="text-[#9CA3AF]">${escapeHtml(f.time || '')}</span>
                </div>
                <p class="text-[13px] text-[#374151]">${escapeHtml(f.text || '')}</p>
              </div>
            `).join('') : '<p class="text-[13px] text-[#6B7280] py-4 text-center">코치님께 궁금한 점을 편하게 남겨보세요.</p>'}
            <form id="memo-form" class="pt-2 flex gap-2">
              <input id="memo-inp" type="text" placeholder="코치님께 질문을 남겨보세요" class="flex-1 text-[13px] px-3.5 py-2.5 rounded-2xl bg-[#F4F6F9] focus:outline-none" />
              <button type="submit" class="px-4 py-2.5 rounded-2xl hero-navy text-white text-[13px] font-bold">전송</button>
            </form>
          </div>
        </div>
      `;
    }

    // --- Coach View (Slim 2-Tab Cockpit) ---
    function renderCoachView() {
      const list = state.trainerOverview || [];
      const isPending = m => Boolean(m.pendingWorkout || m.pendingDiet || Number(m.directPendingVideos || 0) > 0);
      const isDormant = m => daysBetween(m.lastDate, state.selectedDate) >= 4;

      const pendingList = list.filter(isPending);
      const todayList = list.filter(m => m.activeToday);
      const dormantList = list.filter(isDormant);
      const videoWaiting = list.reduce((n, m) => n + (Number(m.directPendingVideos) || 0), 0);
      const pendingVideoMembers = list.filter(m => Number(m.directPendingVideos || 0) > 0);
      const weeklyActiveMembers = list.filter(m => Number(m.weeklyActiveDays || 0) > 0).length;

      if (state.coachTab === 'coaching') {
        let filtered = list;
        if (state.coachFilter === 'pending') filtered = pendingList;
        else if (state.coachFilter === 'today') filtered = todayList;
        else if (state.coachFilter === 'dormant') filtered = dormantList;
        else if (state.coachFilter === 'videos') filtered = pendingVideoMembers;

        // Sort so pending feedback members always come first
        const sorted = [...filtered].sort((a, b) => {
          const ap = isPending(a) ? 1 : 0;
          const bp = isPending(b) ? 1 : 0;
          if (ap !== bp) return bp - ap;
          const av = Number(a.directPendingVideos) || 0, bv = Number(b.directPendingVideos) || 0;
          if (av !== bv) return bv - av;
          return (b.activeToday ? 1 : 0) - (a.activeToday ? 1 : 0);
        });

        return `
          <div class="space-y-3.5 animate-in">
            <section class="hero-navy rounded-[26px] p-5 text-white space-y-3.5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-white/15 text-[#5EEAD4]">${state.selectedDate} 코칭 브리핑</span>
                <button type="button" id="coach-refresh-overview" class="tap-scale text-[11px] font-bold bg-white/15 text-white px-3 py-2 rounded-xl">↻ 새로고침</button>
                <span class="text-[11px] font-semibold text-white/75">전체 ${list.length}명</span>
              </div>
              <h1 class="text-[21px] font-extrabold leading-snug">
                ${pendingList.length ? `피드백 대기 ${pendingList.length}명부터<br/>바로 확인해 보세요` : `오늘 피드백 대기가 모두 완료되었어요 👍`}
              </h1>
              <div class="grid grid-cols-5 gap-1">
                ${[
                  ['pending', '처리 필요', pendingList.length],
                  ['videos', '영상 대기', videoWaiting],
                  ['today', '오늘 기록', todayList.length],
                  ['dormant', '4일+ 미접속', dormantList.length],
                  ['all', '전체', list.length]
                ].map(([fid, label, cnt]) => `
                  <button type="button" data-cfilter="${fid}" class="c-filter-btn tap-scale py-2 px-1 rounded-2xl text-center transition ${state.coachFilter === fid ? 'bg-white text-[#1E3A8A] shadow-md' : 'bg-white/10 text-white'}">
                    <p class="text-[16px] font-extrabold tabular-nums leading-none">${cnt}</p>
                    <p class="text-[9px] font-bold mt-1 opacity-85 leading-tight">${label}</p>
                  </button>
                `).join('')}
              </div>
              <div class="rounded-xl bg-white/10 px-3 py-2.5 text-[11px] text-white/90">
                <span class="font-bold text-[#5EEAD4]">최근 7일 체크인</span>
                <span class="ml-1">활동 회원 ${weeklyActiveMembers}명 · 미답변 영상 ${videoWaiting}개</span>
              </div>
              <p class="text-[10px] text-white/65">미답변 기준은 선택한 날짜의 식단·운동 기록과 아직 피드백 없는 영상입니다.</p>
            </section>

            <div class="space-y-2.5">
              ${sorted.length ? sorted.map(m => {
                const pending = isPending(m);
                const gapDays = daysBetween(m.lastDate, state.selectedDate);
                const badges = [];
                if (m.pendingDiet) badges.push('식단 미답변');
                if (m.pendingWorkout) badges.push('운동 피드백');
                if (Number(m.directPendingVideos || 0) > 0) badges.push(`영상 ${m.directPendingVideos}건`);
                if (gapDays >= 4) badges.push(`${gapDays}일 미접속`);
                return `
                  <button type="button" data-cname="${escapeHtml(m.name)}" class="c-detail-btn tap-scale w-full bg-white rounded-[22px] p-4 shadow-sm text-left flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-[15px] font-extrabold text-[#111827]">${escapeHtml(m.name)}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#EFF6FF] text-[#1D4ED8]">주 ${m.weeklyWorkoutDays || 0}회</span>
                        ${badges.map(bg => `<span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full ${bg.includes('미접속') ? 'bg-red-50 text-red-600' : 'bg-amber-50 text-amber-700'}">${bg}</span>`).join('')}
                      </div>
                      <p class="text-[12px] text-[#6B7280] mt-1">최근 기록: ${escapeHtml(m.lastDate || '없음')}</p>
                      <p class="text-[11px] font-semibold text-[#475569] mt-1">최근 7일 · 운동 ${Number(m.weeklyWorkoutDays)||0}일 / 식단 ${Number(m.weeklyDietDays)||0}일 / 체크인 ${Number(m.weeklyCheckinDays)||0}일${Number(m.weeklyTiredDays)>0 ? ` · 피곤 ${m.weeklyTiredDays}일` : ''}</p>
                    </div>
                    <span class="shrink-0 px-3 py-2 rounded-xl ${pending ? 'hero-navy text-white' : 'bg-[#F4F6F9] text-[#4B5563]'} text-[11px] font-extrabold">
                      ${pending ? '바로 답글 ›' : '상세 ›'}
                    </span>
                  </button>
                `;
              }).join('') : `<div class="bg-white rounded-[22px] p-6 text-center text-[13px] text-[#6B7280]">해당 조건의 회원이 없습니다 👍</div>`}
            </div>
          </div>
        `;
      }

      // Second Coach Tab: '회원 · 매거진'
      const matchedMembers = list.filter(m => !state.coachSearch || m.name.includes(state.coachSearch));
      return `
        <div class="space-y-3.5 animate-in">
          <!-- Magazine Management Card -->
          <section class="bg-white rounded-[24px] p-5 shadow-sm space-y-3">
            <div class="flex items-center justify-between gap-2">
              <div>
                <h2 class="text-[16px] font-extrabold text-[#111827]">FIT-CONNECT 매거진</h2>
                <p class="text-[11px] text-[#6B7280] mt-0.5">회원 홈 상단에 노출 중인 칼럼 ${state.columns.length}건</p>
              </div>
              <button type="button" id="btn-coach-tab-col" class="tap-scale px-3.5 py-2 rounded-xl hero-navy text-white text-[12px] font-extrabold">+ 칼럼 발행</button>
            </div>
            <div class="space-y-1.5">
              ${state.columns.slice(0, 3).map((c, idx) => `
                <button type="button" data-colidx="${idx}" class="mag-item-btn tap-scale w-full p-3 rounded-2xl bg-[#F4F6F9] text-left flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <span class="text-[10px] font-bold text-[#1D4ED8]">#${escapeHtml(c.category || '인사이트')}</span>
                    <p class="text-[13px] font-bold text-[#111827] truncate">${escapeHtml(c.title)}</p>
                  </div>
                  <span class="text-[12px] font-bold text-[#6B7280]">›</span>
                </button>
              `).join('')}
            </div>
          </section>

          <!-- All Members Search & Add -->
          <section class="space-y-2.5">
            <div class="flex items-center gap-2">
              <input id="coach-search-inp" value="${escapeHtml(state.coachSearch)}" placeholder="회원 이름 검색 (${list.length}명)..." class="flex-1 text-[13px] px-4 py-3 rounded-2xl bg-white shadow-sm focus:outline-none" />
              <button type="button" id="btn-add-member" class="tap-scale shrink-0 px-3.5 py-3 rounded-2xl hero-navy text-white text-[12px] font-extrabold shadow-sm">+ 회원 추가</button>
            </div>
            ${matchedMembers.map(m => `
              <div class="flex items-center gap-2 bg-white rounded-[22px] p-2 shadow-sm">
              <button type="button" data-cname="${escapeHtml(m.name)}" class="c-detail-btn tap-scale flex-1 min-w-0 p-2 text-left flex items-center justify-between gap-2">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="text-[15px] font-bold text-[#111827]">${escapeHtml(m.name)}</span>
                    <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-[#EFF6FF] text-[#1D4ED8]">주 ${m.weeklyWorkoutDays || 0}회</span>
                  </div>
                  <p class="text-[12px] text-[#6B7280] mt-0.5">최근 기록: ${escapeHtml(m.lastDate || '없음')}</p>
                  <p class="text-[11px] text-[#475569] mt-1">7일 운동 ${Number(m.weeklyWorkoutDays)||0}일 · 식단 ${Number(m.weeklyDietDays)||0}일 · 체크인 ${Number(m.weeklyCheckinDays)||0}일</p>
                </div>
                <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${isPending(m) ? 'bg-amber-50 text-amber-700' : 'bg-[#F0FDFA] text-[#0F766E]'}">${isPending(m) ? '피드백 대기 ›' : '상세 보기 ›'}</span>
              </button>
              <button type="button" data-archive-member="${escapeHtml(m.name)}" class="c-archive-btn tap-scale shrink-0 rounded-xl px-2.5 py-2.5 bg-red-50 text-red-700 text-[11px] font-bold">삭제</button>
              </div>
            `).join('')}
            ${(state.archivedMemberNames || []).length ? `
              <details class="rounded-2xl bg-white p-3">
                <summary class="cursor-pointer text-[12px] font-bold text-[#64748B]">보관된 회원 (${state.archivedMemberNames.length}명) · 펼쳐서 복원</summary>
                <div class="space-y-2 mt-3">${state.archivedMemberNames.map(name => `
                  <div class="flex items-center justify-between gap-2 p-2 bg-[#F4F6F9] rounded-xl">
                    <span class="text-[12px] font-semibold text-[#475569]">${escapeHtml(name)}</span>
                    <button type="button" data-restore-member="${escapeHtml(name)}" class="c-restore-btn px-3 py-2 rounded-lg text-[11px] font-bold bg-[#EFF6FF] text-[#1D4ED8]">복원</button>
                  </div>`).join('')}</div>
              </details>` : ''}
          </section>
        </div>
      `;
    }

    function updateFabUI() {
      const menu = document.getElementById('fab-menu');
      const icon = document.getElementById('fab-icon');
      if (state.fabOpen) { menu.classList.remove('hidden'); menu.classList.add('flex'); icon.style.transform = 'rotate(45deg)'; }
      else { menu.classList.add('hidden'); menu.classList.remove('flex'); icon.style.transform = 'rotate(0deg)'; }
    }

    function renderAll() {
      renderHeader();
      renderBottomNav();
      document.getElementById('main-content').innerHTML = state.appMode === 'member' ? renderMemberView() : renderCoachView();
      updateFabUI();
      updateFloatingTimerUI();
      bindEvents();
      hydrateDirectImages();
      updateWorkoutSaveLabel();
    }

    function bindEvents() {
      const vBtn = document.getElementById('btn-verify');
      if (vBtn) {
        vBtn.addEventListener('click', () => {
          if (state.record.dailyCheckin.workout === 'done') {
            state.record.dailyCheckin.workout = 'rest';
            showToast('회복 상태로 변경했어요');
            renderAll();
            saveDailyCheckinLive({ ...state.record.dailyCheckin, workout: 'rest' });
          } else {
            openWorkoutVerifyModal();
          }
        });
      }

      const ounwanBtn = document.getElementById('btn-open-ounwan');
      if (ounwanBtn) ounwanBtn.addEventListener('click', openOunwanCardModal);
      const bodyOunwan = document.getElementById('btn-body-ounwan');
      if (bodyOunwan) bodyOunwan.addEventListener('click', openOunwanCardModal);

      const bvFat = document.getElementById('bv-fat-inp');
      const bvMus = document.getElementById('bv-mus-inp');
      const updateBodyValueUI = () => {
        const fk = Math.max(0, Number(bvFat?.value) || 0);
        const mk = Math.max(0, Number(bvMus?.value) || 0);
        state.bodyValue = { fatLostKg: fk, muscleGainedKg: mk };
        try { localStorage.setItem(`fit_bodyval_${state.memberName}`, JSON.stringify(state.bodyValue)); } catch {}
        const fv = Math.round(fk * 77);
        const mv = Math.round(mk * 150);
        const totEl = document.getElementById('bv-total-text');
        const subEl = document.getElementById('bv-sub-text');
        if (totEl) totEl.textContent = `총 +${(fv + mv).toLocaleString()}만원 벌었어요!`;
        if (subEl) subEl.textContent = `체지방 -${fk}kg (${fv.toLocaleString()}만원) · 골격근 +${mk}kg (${mv.toLocaleString()}만원)`;
      };
      if (bvFat) bvFat.addEventListener('input', updateBodyValueUI);
      if (bvMus) bvMus.addEventListener('input', updateBodyValueUI);
      const bvCopy = document.getElementById('btn-copy-bodyval');
      if (bvCopy) {
        bvCopy.addEventListener('click', () => {
          const fk = state.bodyValue.fatLostKg || 0;
          const mk = state.bodyValue.muscleGainedKg || 0;
          const tv = Math.round(fk * 77) + Math.round(mk * 150);
          copyTextSafe(`[FIT-CONNECT 몸 자산 리포트] ${state.memberName}님 · 체지방 -${fk}kg & 근육 +${mk}kg 달성 = 총 +${tv.toLocaleString()}만원 건강 자산 획득! 💰`);
          showToast('몸 자산 리포트 문구가 복사되었어요!');
        });
      }

      document.querySelectorAll('.fb-react-btn').forEach(b => {
        b.addEventListener('click', () => {
          const val = b.dataset.rval;
          state.feedbackReaction = state.feedbackReaction === val ? '' : val;
          try {
            localStorage.setItem(`fit_react_${state.memberName}_${state.selectedDate}`, state.feedbackReaction);
          } catch {}
          const reactId = 'react-' + state.selectedDate;
          const memos = Array.isArray(state.record.memos) ? state.record.memos.filter(m => m.id !== reactId) : [];
          if (state.feedbackReaction) {
            memos.push({ id: reactId, from: 'member', text: `[한마디 확인] ${state.feedbackReaction}`, time: nowTimeHHMM() });
            showToast(`코치님께 '${state.feedbackReaction}' 반응을 보냈어요`);
          } else {
            showToast('반응을 취소했어요');
          }
          state.record.memos = memos;
          renderAll();
          savePatchLive({ memos: state.record.memos });
        });
      });

      const prBtn = document.getElementById('btn-open-pr');
      if (prBtn && state.insights?.weekly?.improvements?.[0]) {
        prBtn.addEventListener('click', () => openPRShareModal(state.insights.weekly.improvements[0]));
      }
      document.querySelectorAll('.pr-item-btn').forEach(b => {
        b.addEventListener('click', () => {
          const it = state.insights?.weekly?.improvements?.[Number(b.dataset.pridx)];
          if (it) openPRShareModal(it);
        });
      });

      const hmBtn = document.getElementById('btn-home-mission');
      if (hmBtn) {
        hmBtn.addEventListener('click', () => {
          state.memberTab = 'lesson';
          renderAll();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }

      const hgBtn = document.getElementById('btn-home-guide');
      if (hgBtn) hgBtn.addEventListener('click', () => openFormGuideModal(hgBtn.dataset.gtitle, hgBtn.dataset.gnote));

      document.querySelectorAll('.w-add-btn').forEach(b => {
        b.addEventListener('click', () => addWaterCup(Number(b.dataset.wml)));
      });
      const wMinus = document.getElementById('btn-water-minus');
      if (wMinus) wMinus.addEventListener('click', () => addWaterCup(-250));

      document.querySelectorAll('.chk-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.record.dailyCheckin[b.dataset.grp] = b.dataset.val;
          showToast('오늘 상태가 저장되었어요');
          renderAll();
          saveDailyCheckinLive({ ...state.record.dailyCheckin });
        });
      });

      document.querySelectorAll('.meal-btn').forEach(b => b.addEventListener('click', () => openMealModal(b.dataset.mkey, b.dataset.mlabel)));
      // Always expose photo deletion on the member diet card, not only
      // inside the meal editor. Only the photographed meal can be deleted.
      document.querySelectorAll('.member-photo-delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const mealKey = btn.dataset.mealPhotoKey;
          const mealLabel = btn.dataset.mealPhotoLabel;
          if (!['breakfast','lunch','dinner','snack'].includes(mealKey) || !extractPhotoSrc(state.record.diet?.[mealKey])) return;
          if (!window.confirm(`${mealLabel} 사진만 삭제할까요? 식단 글과 칼로리는 남습니다.`)) return;
          btn.disabled = true;
          btn.textContent = '사진 삭제 중...';
          const targetMember = state.memberName;
          const targetDate = state.selectedDate;
          try {
            const auth = (state.appMode === 'coach' && state.trainerPassword)
              ? { password: state.trainerPassword }
              : (state.session ? { session: state.session } : { token: state.token });
            const res = await deleteMealPhoto(targetMember, targetDate, mealKey, auth);
            if (res?.status !== 'success') throw new Error(res?.code || '삭제 실패');
            if (targetMember === state.memberName && targetDate === state.selectedDate) {
              state.record.diet[mealKey] = { ...state.record.diet[mealKey], photos: [], photo: '' };
              saveCachedMemberData(targetDate);
              renderAll();
            }
            showToast(`${mealLabel} 사진을 삭제했어요 ✓`);
          } catch (err) {
            btn.disabled = false;
            btn.textContent = '🗑 사진만 삭제하기';
            showToast('사진 삭제 실패: ' + (err?.message || '네트워크 오류'));
          }
        });
      });

      document.querySelectorAll('.meal-yesterday-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          openMealModal(btn.dataset.prevmealKey,btn.dataset.prevmealLabel);
          document.getElementById('meal-copy-yesterday')?.click();
        });
      });
      document.getElementById('workout-save-retry')?.addEventListener('click',retryWorkoutSave);
      document.querySelectorAll('.routine-set-toggle').forEach(b => {
        b.addEventListener('click', () => {
          const ri=Number(b.dataset.setRidx),si=Number(b.dataset.setIdx);
          const routine=state.record.routines?.[ri];if(!routine)return;
          const count=Math.max(1,Number(routine.sets)||routine.completedSets?.length||3);
          const sets=Array.from({length:count},(_,i)=>Boolean(routine.completedSets?.[i]));
          sets[si]=!sets[si];routine.completedSets=sets;
          const completed=sets[si];enqueueWorkoutSave();renderAll();
          if(completed){
            state.timer.setsDone+=1;
            if(state.timer.autoStartOnCheck)startTimerCountdown(getConfiguredTimerSeconds());
          }
        });
      });
      document.querySelectorAll('.routine-toggle').forEach(b => {
        b.addEventListener('click', () => {
          const idx = Number(b.dataset.ridx);
          const r = state.record.routines[idx];
          if (!r) return;
          const setsCount = Math.max(1, Number(r.sets) || (Array.isArray(r.completedSets) ? r.completedSets.length : 3));
          const currentlyDone = Array.isArray(r.completedSets) && r.completedSets.length >= setsCount && r.completedSets.slice(0,setsCount).every(Boolean);
          r.completedSets = Array(setsCount).fill(!currentlyDone);
          if (!currentlyDone) {
            state.timer.setsDone += 1;
            triggerConfetti();
            if (state.timer.autoStartOnCheck) startTimerCountdown(getConfiguredTimerSeconds());
          }
          enqueueWorkoutSave();
          renderAll();
        });
      });

      document.querySelectorAll('.routine-guide-btn').forEach(b => {
        b.addEventListener('click', () => openFormGuideModal(b.dataset.gtitle, b.dataset.gnote, b.dataset.gvid, b.dataset.gvidid));
      });

      document.querySelectorAll('.dv-play-btn').forEach(b => {
        b.addEventListener('click', () => openFormGuideModal(b.dataset.dvname, b.dataset.dvfb, '', b.dataset.dvid));
      });

      document.querySelectorAll('.dv-del-btn').forEach(b => {
        b.addEventListener('click', async () => {
          const dvid = b.dataset.dvdelid;
          if (!dvid || !state.trainerPassword) return;
          showToast('영상을 삭제 중입니다...');
          try {
            const delRes = await postRecords({ action: 'directVideoDelete', id: dvid, member: state.memberName, date: state.selectedDate, password: state.trainerPassword });
            if (delRes?.status !== 'success') throw new Error(delRes?.code || '삭제 실패');
            videoPlayUrlCache.delete(dvid);
            state.directVideos = state.directVideos.filter(x => x.id !== dvid);
            renderAll();
            showToast('영상이 삭제되었습니다 ✓');
          } catch (err) {
            showToast('삭제 실패: ' + (err?.message || '오류'));
          }
        });
      });

      document.querySelectorAll('.lview-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.lessonView = b.dataset.lview;
          renderAll();
        });
      });

      document.querySelectorAll('.lib-del-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const exName = btn.dataset.libdel || '';
          const vidId = btn.dataset.libvidid || '';
          const lastDate = btn.dataset.libdate || '';
          const normKey = String(exName).trim().toLowerCase().replace(/\s+/g, '');
          if (!normKey) return;
          addHiddenExerciseKey(state.memberName, normKey);
          if (state.exerciseLibrary && state.exerciseLibrary[normKey]) {
            delete state.exerciseLibrary[normKey];
            try { localStorage.setItem(`fit_ex_lib_v2_${state.memberName}`, JSON.stringify(state.exerciseLibrary)); } catch {}
          }
          if (vidId && vidId.startsWith('direct:') && state.trainerPassword) {
            postRecords({ action: 'directVideoDelete', id: vidId, member: state.memberName, date: state.selectedDate, password: state.trainerPassword }).catch(() => {});
            videoPlayUrlCache.delete(vidId);
            state.directVideos = state.directVideos.filter(v => v.id !== vidId);
          }
          if (lastDate && state.trainerPassword && state.isLive) {
            try {
              const asDay = await postAppsScript({ action: 'read', member: state.memberName, date: lastDate, password: state.trainerPassword });
              const dayObj = unwrapDailyRecord(asDay);
              if (dayObj && Array.isArray(dayObj.routines)) {
                const nextRoutines = dayObj.routines.filter(r => String(r?.name || '').trim().toLowerCase().replace(/\s+/g, '') !== normKey);
                if (nextRoutines.length !== dayObj.routines.length) {
                  await postAppsScript({ member: state.memberName, date: lastDate, data: { ...dayObj, routines: nextRoutines }, password: state.trainerPassword });
                }
              }
            } catch {}
          }
          renderAll();
          showToast(`'${exName}' 항목을 서버(${lastDate || '목록'})에서도 삭제했어요 ✓`);
        });
      });

      const libSearch = document.getElementById('lesson-lib-search');
      if (libSearch) {
        libSearch.addEventListener('input', e => {
          state.lessonSearch = e.target.value;
          renderAll();
          const n = document.getElementById('lesson-lib-search');
          if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
        });
      }

      const addR = document.getElementById('btn-add-routine');
      if (addR) addR.addEventListener('click', openAddRoutineModal);

      const timerLessonBtn = document.getElementById('btn-open-timer-lesson');
      if (timerLessonBtn) timerLessonBtn.addEventListener('click', openTimerModal);
      const plateLessonBtn = document.getElementById('btn-open-plate-lesson');
      if (plateLessonBtn) plateLessonBtn.addEventListener('click', openPlateCalcModal);

      const magBtn = document.getElementById('btn-open-magazine');
      if (magBtn) magBtn.addEventListener('click', () => openMagazineModal(0));
      document.querySelectorAll('.mag-item-btn').forEach(b => {
        b.addEventListener('click', () => openMagazineModal(Number(b.dataset.colidx)));
      });

      const mVidInp = document.getElementById('member-vid-upload');
      if (mVidInp) {
        mVidInp.addEventListener('change', async e => {
          const f = e.target.files?.[0];
          if (!f) return;
          if (!state.isLive || !state.token) {
            showToast('라이브 회원 링크에서만 영상 업로드가 가능해요');
            return;
          }
          showToast('자세 영상을 업로드 중입니다... ⏳');
          setVideoUploadStatus('운동 영상 준비 중',0);
          try {
            const directId = await uploadDirectVideoFile(f, state.memberName, state.token, '회원 자세 체크 영상', pct => {
              setVideoUploadStatus('운동 영상 전송 중',pct);
            });
            setVideoUploadStatus('업로드 완료 · 기록 반영 중',100);
            state.record.memos.push({
              id: Date.now() + '-vid',
              from: 'member',
              text: `📹 자세 영상을 올렸어요 (${f.name || '영상'})`,
              time: nowTimeHHMM(),
              videoId: directId
            });
            state.directVideos.unshift({ id: directId, name: f.name || '자세 영상', question: '회원 자세 체크 영상', feedback: '' });
            showToast('자세 영상 업로드 완료! 수업일지 · 메모에 반영되었어요 ✓');
            renderAll();
            savePatchLive({ memos: state.record.memos });
            setVideoUploadStatus('',0,false);
          } catch (err) {
            setVideoUploadStatus('',0,false);
            showToast('영상 업로드 실패: ' + (err?.message || '50MB 이하 MP4/MOV만 가능'));
          }
        });
      }

      const memoForm = document.getElementById('memo-form');
      if (memoForm) {
        memoForm.addEventListener('submit', e => {
          e.preventDefault();
          const inp = document.getElementById('memo-inp');
          const txt = inp.value.trim();
          if (!txt) return;
          state.record.memos.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 6), from: 'member', text: txt, time: nowTimeHHMM() });
          inp.value = '';
          showToast('코치님께 메모를 전송했어요');
          renderAll();
          savePatchLive({ memos: state.record.memos });
        });
      }

      document.getElementById('home-quick-workout')?.addEventListener('click', () => {state.memberTab='lesson';state.lessonView='today';renderAll();});
      document.getElementById('home-quick-diet')?.addEventListener('click', () => {state.memberTab='diet';renderAll();});
      const goL = document.getElementById('go-lesson');
      if (goL) goL.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goL2 = document.getElementById('go-lesson-2');
      if (goL2) goL2.addEventListener('click', () => { state.memberTab = 'lesson'; renderAll(); });
      const goD = document.getElementById('go-diet');
      if (goD) goD.addEventListener('click', () => { state.memberTab = 'diet'; renderAll(); });

      // Coach events
      document.getElementById('coach-refresh-overview')?.addEventListener('click', refreshCoachOverview);
      document.querySelectorAll('.c-filter-btn').forEach(b => {
        b.addEventListener('click', () => {
          state.coachFilter = b.dataset.cfilter;
          renderAll();
        });
      });

      document.querySelectorAll('.c-detail-btn').forEach(b => {
        b.addEventListener('click', () => openCoachDetailSheet(b.dataset.cname));
      });

      document.querySelectorAll('.c-archive-btn').forEach(btn => {
        btn.addEventListener('click', () => archiveCoachMember(btn.dataset.archiveMember, btn));
      });
      document.querySelectorAll('.c-restore-btn').forEach(btn => {
        btn.addEventListener('click', () => restoreCoachMember(btn.dataset.restoreMember, btn));
      });

      const addMemberBtn = document.getElementById('btn-add-member');
      if (addMemberBtn) addMemberBtn.addEventListener('click', openAddMemberModal);

      const coachColBtn = document.getElementById('btn-coach-tab-col');
      if (coachColBtn) coachColBtn.addEventListener('click', openColumnWriteModal);

      const csInp = document.getElementById('coach-search-inp');
      if (csInp) {
        csInp.addEventListener('input', e => {
          state.coachSearch = e.target.value.trim();
          renderAll();
          const n = document.getElementById('coach-search-inp');
          if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
        });
      }
    }

    // Floating Timer Bar Listeners
    document.getElementById('ft-minus').addEventListener('click', () => {
      state.timer.remaining = Math.max(5, state.timer.remaining - 10);
      updateFloatingTimerUI();
    });
    document.getElementById('ft-plus').addEventListener('click', () => {
      state.timer.remaining += 10;
      updateFloatingTimerUI();
    });
    document.getElementById('ft-toggle').addEventListener('click', () => {
      state.timer.running = !state.timer.running;
      if (state.timer.running) runTimerTick();
      updateFloatingTimerUI();
    });
    document.getElementById('ft-open').addEventListener('click', openTimerModal);
    document.getElementById('ft-stop').addEventListener('click', stopTimer);

    // FAB Listeners
    document.getElementById('fab-toggle').addEventListener('click', () => { state.fabOpen = !state.fabOpen; updateFabUI(); });
    document.getElementById('fab-timer').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openTimerModal(); });
    document.getElementById('fab-plate').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openPlateCalcModal(); });
    document.getElementById('fab-ounwan').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openOunwanCardModal(); });
    document.getElementById('fab-diet').addEventListener('click', () => { state.fabOpen = false; updateFabUI(); openMealModal('lunch', '점심'); });
    document.getElementById('fab-water').addEventListener('click', () => { state.fabOpen = false; addWaterCup(250); });
    document.getElementById('fab-memo').addEventListener('click', () => { state.fabOpen = false; state.memberTab = 'feedback'; renderAll(); });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-backdrop').addEventListener('click', e => { if (e.target.id === 'modal-backdrop') closeModal(); });

    initLiveMemberData();
  </script>
</body>
</html>
